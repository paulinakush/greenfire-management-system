/* ---------------------------------------------------------
   TILT — efecto "tarjeta 3D" con CSS transform (perspective +
   rotateX/rotateY) siguiendo el cursor, sin librerías externas
--------------------------------------------------------- */

const TILT_RESET = {
  transform: "perspective(900px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)",
  transition: "transform 0.6s cubic-bezier(0.22, 1, 0.36, 1)",
};

const useTilt = ({ max = 10, scale = 1.04 } = {}) => {
  const ref = useRef(null);
  const [style, setStyle] = useState(TILT_RESET);

  const onMouseMove = (e) => {
    const el = ref.current;
    if (!el) return;
    const rect = el.getBoundingClientRect();
    const px = (e.clientX - rect.left) / rect.width - 0.5;
    const py = (e.clientY - rect.top) / rect.height - 0.5;
    setStyle({
      transform:
        `perspective(900px) rotateX(${(-py * max * 2).toFixed(2)}deg) ` +
        `rotateY(${(px * max * 2).toFixed(2)}deg) scale3d(${scale}, ${scale}, ${scale})`,
      transition: "transform 0.08s linear",
    });
  };

  const onMouseLeave = () => setStyle(TILT_RESET);

  return { ref, style, onMouseMove, onMouseLeave };
};

const TiltBox = ({ as: As = "div", className, style, tiltMax = 10, tiltScale = 1.04, children, ...rest }) => {
  const tilt = useTilt({ max: tiltMax, scale: tiltScale });
  return (
    <As
      ref={tilt.ref}
      onMouseMove={tilt.onMouseMove}
      onMouseLeave={tilt.onMouseLeave}
      className={className}
      style={{ ...style, ...tilt.style, willChange: "transform" }}
      {...rest}
    >
      {children}
    </As>
  );
};

const NAV_LINKS = [
  { label: "Inicio", href: "/" },
  { label: "Sustratos", href: "/sustratos" },

const Navbar = ({ cartCount, route, navigate }) => {
  const [open, setOpen] = useState(false);
  const [scrolled, setScrolled] = useState(false);
  const isHome = route === "/";

  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 20);
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  const handleClick = (e, href) => {
    e.preventDefault();
    setOpen(false);
    navigate(href);
  };

  const solid = !isHome || scrolled || open;

  return (
    <header
      className={
        "fixed top-0 inset-x-0 z-40 transition-colors duration-300 border-b " +
        (solid
          ? "bg-deep/95 backdrop-blur border-white/10"
          : "bg-transparent border-transparent")
      }
    >
      <div className="max-w-7xl mx-auto px-5 md:px-8">
        <div className="relative overflow-hidden flex items-center justify-between h-20 md:h-24">
          <div className="absolute inset-0">
            <SideRays
              speed={2.5}
              rayColor1="#EAB308"
              rayColor2="#10B981"
              intensity={2}
              spread={2}
              origin="top-right"
              tilt={0}
              saturation={1.5}
              blend={0.75}
              falloff={1.6}
              opacity={1}
            />
          </div>

          <a href="/" onClick={(e) => handleClick(e, "/")} className="relative z-10 flex items-center gap-2 shrink-0">
            <img src={IMG.logoBlanco} alt="Green Fire" className="h-8 md:h-10 w-auto" />
          </a>

          <nav className="relative z-10 hidden md:flex items-center gap-8">
            {NAV_LINKS.map((l) => (
              <a
                key={l.href}
                href={l.href}
                onClick={(e) => handleClick(e, l.href)}
                className={
                  "text-sm font-medium transition-colors " +
                  (route === l.href ? "text-white" : "text-white/70 hover:text-white")
                }
              >
                {l.label}
              </a>
            ))}
          </nav>

          <div className="relative z-10 flex items-center gap-3">
            <button
              aria-label="Carrito"
              className="relative text-white/90 hover:text-white transition-colors p-2"
            >
              <CartIcon className="w-6 h-6" />
              {cartCount > 0 && (
                <span className="absolute -top-0.5 -right-0.5 bg-white text-deep text-[10px] font-bold rounded-full w-4.5 h-4.5 min-w-[18px] h-[18px] flex items-center justify-center">
                  {cartCount}
                </span>
              )}
            </button>
            <button
              className="md:hidden text-white p-1"
              aria-label="Abrir menú"
              onClick={() => setOpen((v) => !v)}
            >
              {open ? <CloseIcon /> : <MenuIcon />}

/* ---------------------------------------------------------
   MASKED HEADING (técnica de clip-text tipo React Bits "Gradient Text",
   adaptada para un título grande de dos líneas)
--------------------------------------------------------- */

const hexToRgb = hex => {
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  return m ? [parseInt(m[1], 16) / 255, parseInt(m[2], 16) / 255, parseInt(m[3], 16) / 255] : [1, 1, 1];
};

const originToFlip = origin => {
  switch (origin) {
    case 'top-left': return [1, 0];
    case 'bottom-right': return [0, 1];
    case 'bottom-left': return [1, 1];
    default: return [0, 0];
  }
};

const SideRays = ({
  speed = 2.5,
  rayColor1 = '#EAB308',
  rayColor2 = '#96c8ff',
  intensity = 2,
  spread = 2,
  origin = 'top-right',
  tilt = 0,
  saturation = 1.5,
  blend = 0.75,
  falloff = 1.6,
  opacity = 1.0,
  className = ''
}) => {
  const containerRef = useRef(null);
  const uniformsRef = useRef(null);
  const rendererRef = useRef(null);
  const animationIdRef = useRef(null);
  const meshRef = useRef(null);
  const cleanupFunctionRef = useRef(null);
  const [isVisible, setIsVisible] = useState(false);
  const observerRef = useRef(null);

  useEffect(() => {
    if (!containerRef.current) return;

    observerRef.current = new IntersectionObserver(
      entries => {
        const entry = entries[0];
        setIsVisible(entry.isIntersecting);
      },
      { threshold: 0.1 }
    );

    observerRef.current.observe(containerRef.current);

    return () => {
      if (observerRef.current) {
        observerRef.current.disconnect();
        observerRef.current = null;
      }
    };
  }, []);

  useEffect(() => {
    if (!isVisible || !containerRef.current) return;

    if (cleanupFunctionRef.current) {
      cleanupFunctionRef.current();
      cleanupFunctionRef.current = null;
    }

    const initializeWebGL = async () => {
      if (!containerRef.current) return;

      const { Renderer, Program, Triangle, Mesh } = await import('https://esm.sh/ogl@1.0.6');

      await new Promise(resolve => setTimeout(resolve, 10));

      if (!containerRef.current) return;

      const renderer = new Renderer({
        dpr: Math.min(window.devicePixelRatio, 2),
        alpha: true
      });
      rendererRef.current = renderer;

      const gl = renderer.gl;
      gl.canvas.style.width = '100%';
      gl.canvas.style.height = '100%';

      while (containerRef.current.firstChild) {
        containerRef.current.removeChild(containerRef.current.firstChild);
      }
      containerRef.current.appendChild(gl.canvas);

      const vert = `
attribute vec2 position;
void main() {
  gl_Position = vec4(position, 0.0, 1.0);
}`;

      const frag = `precision highp float;

uniform float iTime;
uniform vec2 iResolution;
uniform float iSpeed;
uniform vec3 iRayColor1;
uniform vec3 iRayColor2;
uniform float iIntensity;
uniform float iSpread;
uniform float iFlipX;
uniform float iFlipY;
uniform float iTilt;
uniform float iSaturation;
uniform float iBlend;
uniform float iFalloff;
uniform float iOpacity;

float rayStrength(vec2 raySource, vec2 rayRefDirection, vec2 coord, float seedA, float seedB, float speed) {
  vec2 sourceToCoord = coord - raySource;
  float cosAngle = dot(normalize(sourceToCoord), rayRefDirection);
  return clamp(
    (0.45 + 0.15 * sin(cosAngle * seedA + iTime * speed)) +
    (0.3 + 0.2 * cos(-cosAngle * seedB + iTime * speed)),
    0.0, 1.0) *
    clamp((iResolution.x - length(sourceToCoord)) / iResolution.x, 0.5, 1.0);
}

void main() {
  vec2 fragCoord = gl_FragCoord.xy;
  if (iFlipX > 0.5) fragCoord.x = iResolution.x - fragCoord.x;
  if (iFlipY > 0.5) fragCoord.y = iResolution.y - fragCoord.y;

  vec2 coord = vec2(fragCoord.x, iResolution.y - fragCoord.y);
  vec2 rayPos = vec2(iResolution.x * 1.1, -0.5 * iResolution.y);

  float tiltRad = iTilt * 3.14159265 / 180.0;
  float cs = cos(tiltRad);
  float sn = sin(tiltRad);
  vec2 rel = coord - rayPos;
  vec2 tiltedCoord = vec2(rel.x * cs - rel.y * sn, rel.x * sn + rel.y * cs) + rayPos;

  float halfSpread = iSpread * 0.275;
  vec2 rayRefDir1 = normalize(vec2(cos(0.785398 + halfSpread), sin(0.785398 + halfSpread)));
  vec2 rayRefDir2 = normalize(vec2(cos(0.785398 - halfSpread), sin(0.785398 - halfSpread)));

  vec4 rays1 = vec4(iRayColor1, 1.0) * rayStrength(rayPos, rayRefDir1, tiltedCoord, 36.2214, 21.11349, iSpeed);
  vec4 rays2 = vec4(iRayColor2, 1.0) * rayStrength(rayPos, rayRefDir2, tiltedCoord, 22.3991, 18.0234, iSpeed * 0.2);

  vec4 color = rays1 * (1.0 - iBlend) * 0.9 + rays2 * iBlend * 0.9;

  float distanceToLight = length(fragCoord.xy - vec2(rayPos.x, iResolution.y - rayPos.y)) / iResolution.y;
  float brightness = iIntensity * 0.4 / pow(max(distanceToLight, 0.001), iFalloff);
  color.rgb *= brightness;

  float gray = dot(color.rgb, vec3(0.299, 0.587, 0.114));
  color.rgb = mix(vec3(gray), color.rgb, iSaturation);

  color.a = max(color.r, max(color.g, color.b)) * iOpacity;
  gl_FragColor = color;
}`;

      const [flipX, flipY] = originToFlip(origin);
      const uniforms = {
        iTime: { value: 0 },
        iResolution: { value: [1, 1] },
        iSpeed: { value: speed },
        iRayColor1: { value: hexToRgb(rayColor1) },
        iRayColor2: { value: hexToRgb(rayColor2) },
        iIntensity: { value: intensity },
        iSpread: { value: spread },
        iFlipX: { value: flipX },
        iFlipY: { value: flipY },
        iTilt: { value: tilt },
        iSaturation: { value: saturation },
        iBlend: { value: blend },
        iFalloff: { value: falloff },
        iOpacity: { value: opacity }
      };
      uniformsRef.current = uniforms;

      const geometry = new Triangle(gl);
      const program = new Program(gl, { vertex: vert, fragment: frag, uniforms });
      const mesh = new Mesh(gl, { geometry, program });
      meshRef.current = mesh;

      const updateSize = () => {
        if (!containerRef.current || !renderer) return;
        renderer.dpr = Math.min(window.devicePixelRatio, 2);
        const { clientWidth: w, clientHeight: h } = containerRef.current;
        renderer.setSize(w, h);
        uniforms.iResolution.value = [w * renderer.dpr, h * renderer.dpr];
      };

      const loop = t => {
        if (!rendererRef.current || !uniformsRef.current || !meshRef.current) return;
        uniforms.iTime.value = t * 0.001;
        try {
          renderer.render({ scene: mesh });
          animationIdRef.current = requestAnimationFrame(loop);
        } catch (e) {
          return;
        }
      };

      window.addEventListener('resize', updateSize);
      updateSize();
      animationIdRef.current = requestAnimationFrame(loop);

      cleanupFunctionRef.current = () => {
        if (animationIdRef.current) {
          cancelAnimationFrame(animationIdRef.current);
          animationIdRef.current = null;
        }
        window.removeEventListener('resize', updateSize);
        if (renderer) {
          try {
            const loseCtx = renderer.gl.getExtension('WEBGL_lose_context');
            if (loseCtx) loseCtx.loseContext();
            const canvas = renderer.gl.canvas;
            if (canvas && canvas.parentNode) canvas.parentNode.removeChild(canvas);
          } catch (e) {}
        }
        rendererRef.current = null;
        uniformsRef.current = null;
        meshRef.current = null;
      };
    };

    initializeWebGL();

    return () => {
      if (cleanupFunctionRef.current) {
        cleanupFunctionRef.current();
        cleanupFunctionRef.current = null;
      }
    };
  }, [isVisible, speed, rayColor1, rayColor2, intensity, spread, origin, tilt, saturation, blend, falloff, opacity]);

  useEffect(() => {
    if (!uniformsRef.current) return;
    const u = uniformsRef.current;
    u.iSpeed.value = speed;
    u.iRayColor1.value = hexToRgb(rayColor1);
    u.iRayColor2.value = hexToRgb(rayColor2);
    u.iIntensity.value = intensity;
    u.iSpread.value = spread;
    const [flipX, flipY] = originToFlip(origin);
    u.iFlipX.value = flipX;
    u.iFlipY.value = flipY;
    u.iTilt.value = tilt;
    u.iSaturation.value = saturation;
    u.iBlend.value = blend;
    u.iFalloff.value = falloff;
    u.iOpacity.value = opacity;
  }, [speed, rayColor1, rayColor2, intensity, spread, origin, tilt, saturation, blend, falloff, opacity]);

  return <div ref={containerRef} className={`side-rays-container ${className}`.trim()} />;
};

/* ---------------------------------------------------------
   APP + ROUTER (estado de página activa, sin recarga)
--------------------------------------------------------- */

const ROUTES = ["/", "/sustratos", "/lamparas", "/catalogo", "/sucursales", "/contacto"];

const getRouteFromLocation = () => {
  try {
    const p = window.location.pathname;
    return ROUTES.indexOf(p) !== -1 ? p : "/";
  } catch (e) {
    return "/";
  }
};

const App = () => {
  const [route, setRoute] = useState(getRouteFromLocation);
  const [cartCount, setCartCount] = useState(0);

  const navigate = (path) => {
    if (path === route) return;
    try {
      window.history.pushState({}, "", path);
    } catch (e) {
      // Bajo file:// (abierto con doble clic) pushState no está permitido
      // fuera del archivo actual. Igual navegamos por estado en memoria.
    }
    setRoute(path);
    window.scrollTo(0, 0);
  };

  useEffect(() => {
    const onPopState = () => setRoute(getRouteFromLocation());
    window.addEventListener("popstate", onPopState);
    return () => window.removeEventListener("popstate", onPopState);
  }, []);

  const handleAdd = (product, variant) => {
    setCartCount((c) => c + 1);
  };

  let page;
  if (route === "/sustratos") page = <SustratosPage />;
  else if (route === "/lamparas") page = <LamparasPage />;
  else if (route === "/catalogo") page = <Catalogo onAdd={handleAdd} />;
  else if (route === "/sucursales") page = <Sucursales />;
  else if (route === "/contacto") page = <Contacto />;
  else
    page = (
      <>
        <Hero />
        <QuienesSomos />
      </>
    );

  return (
    <div className="min-h-screen">
      <Navbar cartCount={cartCount} route={route} navigate={navigate} />
      <div className={route === "/" ? "" : "pt-20 md:pt-24"}>{page}</div>
      <Footer navigate={navigate} />
    </div>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<script>
  (function () {
    var source = document.getElementById("app-source").textContent;
    try {
      var output = Babel.transform(source, {
        presets: [["react", { runtime: "classic" }]],
        filename: "app.jsx",
      }).code;
      (0, eval)(output);
    } catch (err) {
      var root = document.getElementById("root");
      root.innerHTML =
        '<pre style="white-space:pre-wrap;padding:24px;color:#b91c1c;font-family:monospace;">' +
        "Error al inicializar el prototipo:\n\n" +
        String(err && err.stack ? err.stack : err) +
        "</pre>";
      console.error(err);
    }
  })();
</script>
