const fmtDate = (iso) => {
  if (!iso) return "-";
  // Fechas "solo fecha" (YYYY-MM-DD) se arman en horario local: new Date(iso)
  // las interpreta como medianoche UTC y en husos negativos (AR) muestran el
  // día anterior.
  const soloFecha = /^\d{4}-\d{2}-\d{2}$/.test(iso);
  const d = soloFecha ? new Date(`${iso}T00:00:00`) : new Date(iso);
  return d.toLocaleDateString("es-AR");
};

const fmtDateTime = (iso) => {
  if (!iso) return "-";
  const d = new Date(iso);
  return `${d.toLocaleDateString("es-AR")} ${d.toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" })}`;
};

const enumLabel = (enumName, value) => {
  const item = (window.GF_ENUMS[enumName] || []).find((e) => e.value === value);
  return item ? item.label : value;
};

const exportCSV = (filename, columns, rows) => {
  const esc = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const header = columns.map((c) => esc(c.label)).join(",");
  const lines = rows.map((r) => columns.map((c) => esc(c.csvValue ? c.csvValue(r) : c.searchValue ? c.searchValue(r) : r[c.key])).join(","));
  const csv = [header, ...lines].join("\n");
  const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
};

const Sidebar = ({ modules, activeKey, onNavigate, mobileOpen, onCloseMobile }) => {
  const parentOfActive = modules.find((m) => m.children && m.children.some((c) => c.key === activeKey));
  const [openKey, setOpenKey] = useState(parentOfActive ? parentOfActive.key : null);

  const navigate = (key) => {
    onNavigate(key);
    onCloseMobile();
  };

  return (
    <>
      {mobileOpen && <div className="fixed inset-0 bg-deep/60 z-20 md:hidden" onClick={onCloseMobile} />}
      <aside
        className={`fixed top-16 left-0 bottom-0 w-64 bg-deep border-r border-white/5 overflow-y-auto py-4 z-30 transition-transform duration-200 md:translate-x-0 ${
          mobileOpen ? "translate-x-0" : "-translate-x-full"
        }`}
      >
        <nav className="px-3 space-y-1">
          {modules.map((m) => {
          if (m.children) {
            const isOpen = openKey === m.key;
            const childActive = m.children.some((c) => c.key === activeKey);
            return (
              <div key={m.key}>
                <button
                  onClick={() => setOpenKey(isOpen ? null : m.key)}
                  className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-colors ${
                    childActive ? "text-institutional" : "text-white/70 hover:text-white hover:bg-white/5"
                  }`}
                >
                  {m.icon}
                  <span className="flex-1 text-left">{m.label}</span>
                  <ChevronDownIcon className={`w-4 h-4 transition-transform ${isOpen ? "rotate-180" : ""}`} />
                </button>
                {isOpen && (
                  <div className="mt-1 ml-4 pl-4 border-l border-white/10 space-y-0.5">
                    {m.children.map((c) => {
                      const active = activeKey === c.key;
                      return (
                        <button
                          key={c.key}
                          onClick={() => navigate(c.key)}
                          className={`relative w-full flex items-center gap-2 pl-3 pr-2 py-2 rounded-lg text-sm text-left ${
                            active ? "bg-institutional/15 text-institutional font-semibold" : "text-white/60 hover:text-white hover:bg-white/5"
                          }`}
                        >
                          {active && <span className="absolute left-0 top-0 bottom-0 w-1 rounded-full bg-institutional" />}
                          <span className="w-1.5 h-1.5 rounded-full bg-current opacity-60 shrink-0" />
                          {c.label}
                        </button>
                      );
                    })}
                  </div>
                )}
              </div>
            );
          }
          const active = activeKey === m.key;
          return (
            <button
              key={m.key}
              onClick={() => navigate(m.key)}
              className={`relative w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-colors ${
                active ? "bg-institutional/15 text-institutional font-semibold" : "text-white/70 hover:text-white hover:bg-white/5"
              }`}
            >
              {active && <span className="absolute left-0 top-1.5 bottom-1.5 w-1 rounded-full bg-institutional" />}
              {m.icon}
              {m.label}
            </button>
          );
          })}
        </nav>
      </aside>
    </>
  );
};

const SalesChart = ({ data, range, onRangeChange }) => {
  const [hover, setHover] = useState(null);
  const max = Math.max(1, ...data.map((d) => d.value));
  const w = 640,
    h = 220,
    padTop = 16,
    padBottom = 28,
    padSide = 8,
    barGap = 10;
  const barW = data.length ? (w - padSide * 2 - barGap * (data.length - 1)) / data.length : 0;
  const hasData = data.some((d) => d.value > 0);

  return (
    <Card className="p-6">
      <div className="flex flex-wrap items-center justify-between gap-4 mb-5">
        <h3 className="font-display font-bold text-base text-deep">Ventas por período</h3>
        <div className="flex items-center gap-1 bg-deep/5 rounded-full p-1">
          {CHART_RANGES.map((r) => (
            <button
              key={r.key}
              onClick={() => onRangeChange(r.key)}
              className={`px-3 py-1.5 rounded-full text-xs font-semibold transition-colors ${
                range === r.key ? "bg-institutional text-white" : "text-deep/60 hover:text-deep"
              }`}
            >
              {r.label}
            </button>
          ))}
        </div>
      </div>

      {!hasData ? (
        <EmptyState text="Todavía no hay ventas ni pedidos confirmados en este período." />
      ) : (
        <div className="relative">
          <svg viewBox={`0 0 ${w} ${h}`} className="w-full h-52" preserveAspectRatio="none">
            {data.map((d, i) => {
              const barH = Math.max(2, ((h - padTop - padBottom) * d.value) / max);
              const x = padSide + i * (barW + barGap);
              const y = h - padBottom - barH;
              return (
                <g key={i} onMouseEnter={() => setHover(i)} onMouseLeave={() => setHover((v) => (v === i ? null : v))}>
                  <rect x={x} y={padTop} width={barW} height={h - padTop - padBottom} fill="transparent" />
                  <rect x={x} y={y} width={barW} height={barH} rx={4} fill={hover === i ? "#29683D" : "#00AE4C"} />
                  <text x={x + barW / 2} y={h - 8} textAnchor="middle" fontSize="9" fill="#1A312B" opacity="0.45">
                    {d.label}
                  </text>
                </g>
              );
            })}
          </svg>
          {hover !== null && data[hover] && (
            <div
              className="absolute -translate-x-1/2 -translate-y-full bg-deep text-white text-xs rounded-lg px-2.5 py-1.5 pointer-events-none whitespace-nowrap"
              style={{
                left: `${((padSide + hover * (barW + barGap) + barW / 2) / w) * 100}%`,
                top: `${((h - padBottom - Math.max(2, ((h - padTop - padBottom) * data[hover].value) / max)) / h) * 100}%`,
              }}
            >
              {money(data[hover].value)}
            </div>
          )}
        </div>
      )}
    </Card>
  );
};

const DataTable = ({ columns, rows, getRowId, actionsRenderer, searchPlaceholder = "Buscar…", pageSizeOptions = [10, 25, 50] }) => {
  const [query, setQuery] = useState("");
  const [visibleCols, setVisibleCols] = useState(() => new Set(columns.filter((c) => c.defaultVisible !== false).map((c) => c.key)));
  const [colsMenuOpen, setColsMenuOpen] = useState(false);
  const [pageSize, setPageSize] = useState(pageSizeOptions[0]);
  const [page, setPage] = useState(1);

  const q = query.trim().toLowerCase();
  const filtered = q
    ? rows.filter((r) => columns.some((c) => String((c.searchValue ? c.searchValue(r) : r[c.key]) ?? "").toLowerCase().includes(q)))
    : rows;

  const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
  const safePage = Math.min(page, totalPages);
  const start = (safePage - 1) * pageSize;
  const pageRows = filtered.slice(start, start + pageSize);
  const visibleColumns = columns.filter((c) => visibleCols.has(c.key));

  const toggleCol = (key) => {
    setVisibleCols((prev) => {
      const next = new Set(prev);
      if (next.has(key)) next.delete(key);
      else next.add(key);
      return next;
    });
  };

  return (
    <div>
      <div className="flex flex-wrap items-center gap-2 mb-3">
        <div className="relative flex-1 min-w-[200px] max-w-xs">
          <SearchIcon className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-deep/35" />
          <input
            value={query}
            onChange={(e) => {
              setQuery(e.target.value);
              setPage(1);
            }}
            placeholder={searchPlaceholder}
            className={`${inputClass} pl-9`}
          />
        </div>
        <div className="flex-1" />
        <div className="relative">
          <Button variant="secondary" onClick={() => setColsMenuOpen((v) => !v)}>
            <ColumnsIcon /> Columnas
          </Button>
          {colsMenuOpen && (
            <div
              className="absolute right-0 top-11 w-56 bg-white rounded-xl shadow-xl border border-deep/8 py-2 z-30"
              onMouseLeave={() => setColsMenuOpen(false)}
            >
              {columns.map((c) => (
                <label key={c.key} className="flex items-center gap-2 px-3.5 py-1.5 text-sm text-deep/80 cursor-pointer">
                  <input type="checkbox" checked={visibleCols.has(c.key)} onChange={() => toggleCol(c.key)} />
                  {c.label}
                </label>
              ))}
            </div>
          )}
        </div>
        <select
          value={pageSize}
          onChange={(e) => {
            setPageSize(Number(e.target.value));
            setPage(1);
          }}
          className={`${inputClass} w-auto`}
        >
          {pageSizeOptions.map((n) => (
            <option key={n} value={n}>
              {n} por página
            </option>
          ))}
        </select>
      </div>

      {filtered.length === 0 ? (
        <EmptyState text="No se encontraron resultados." />
      ) : (
        <>
          <TableWrap>
            <table className="w-full text-sm">
              <thead className="bg-institutional/10 text-deep/70 text-xs uppercase">
                <tr>
                  {visibleColumns.map((c) => (
                    <th key={c.key} className="text-left px-4 py-3 font-semibold whitespace-nowrap">
                      {c.label}
                    </th>
                  ))}
                  {actionsRenderer && <th className="px-4 py-3"></th>}
                </tr>
              </thead>
              <tbody>
                {pageRows.map((row, i) => (
                  <tr key={getRowId(row)} className={i % 2 === 1 ? "bg-deep/[0.025]" : ""}>
                    {visibleColumns.map((c) => (
                      <td key={c.key} className="px-4 py-3 border-t border-deep/5">
                        {c.render ? c.render(row) : row[c.key]}
                      </td>
                    ))}
                    {actionsRenderer && <td className="px-4 py-3 border-t border-deep/5">{actionsRenderer(row)}</td>}
                  </tr>
                ))}
              </tbody>
            </table>
          </TableWrap>

          <div className="flex flex-wrap items-center justify-between gap-3 mt-3 text-sm text-deep/55">
            <p>
              {start + 1}-{Math.min(start + pageSize, filtered.length)} de {filtered.length}
            </p>
            <div className="flex items-center gap-1">
              <button
                disabled={safePage <= 1}
                onClick={() => setPage((p) => Math.max(1, p - 1))}
                className="px-2.5 py-1.5 rounded-lg border border-deep/10 disabled:opacity-30"
              >
                ‹
              </button>
              <span className="px-2">
                {safePage} / {totalPages}
              </span>
              <button
                disabled={safePage >= totalPages}
                onClick={() => setPage((p) => Math.min(totalPages, p + 1))}
                className="px-2.5 py-1.5 rounded-lg border border-deep/10 disabled:opacity-30"
              >
                ›
              </button>
            </div>
          </div>
        </>
      )}
    </div>
  );
};

    EYEBROWS[it.key] = { n: String(n++).padStart(2, "0"), label: "Compras" };
  });
  CONTABILIDAD_ITEMS.forEach((it) => {
    EYEBROWS[it.key] = { n: String(n++).padStart(2, "0"), label: "Contabilidad" };
  });
  CONFIG_ITEMS.forEach((it) => {
    EYEBROWS[it.key] = { n: String(n++).padStart(2, "0"), label: "Configuraciones" };
  });
})();

const mismoMes = (fechaStr) => {
  const d = new Date(`${fechaStr}T00:00:00`);
  const hoy = new Date();
  return d.getFullYear() === hoy.getFullYear() && d.getMonth() === hoy.getMonth();
};

    .sort((a, b) => a.razon_social.localeCompare(b.razon_social));

    e.preventDefault();

    GFDB.insert("proveedores", { razon_social: razonSocial, contacto, tipo_provee: tipoProvee, observaciones, activo: true });

    setContacto("");
    setTipoProvee("");

const ComprasTab = ({ session, bump, showToast }) => {
  const formRef = useRef(null);
  const proveedores = GFDB.get("proveedores").filter((p) => p.activo);
  const insumos = GFDB.get("insumos");
  const [proveedorId, setProveedorId] = useState(proveedores[0]?.id || "");
  const [lineas, setLineas] = useState([{ insumoId: insumos[0]?.id || "", cantidad: "", costo: "" }]);
  const [observaciones, setObservaciones] = useState("");
  const [filtroProveedor, setFiltroProveedor] = useState("todos");
  const [detalleCompra, setDetalleCompra] = useState(null);

  const setLinea = (idx, patch) => setLineas((prev) => prev.map((l, i) => (i === idx ? { ...l, ...patch } : l)));
  const addLinea = () => setLineas((prev) => [...prev, { insumoId: insumos[0]?.id || "", cantidad: "", costo: "" }]);
  const removeLinea = (idx) => setLineas((prev) => prev.filter((_, i) => i !== idx));

  const compras = GFDB.get("compras")
    .filter((c) => filtroProveedor === "todos" || c.proveedor_id === Number(filtroProveedor))
    .slice()
    .sort((a, b) => (a.fecha < b.fecha ? 1 : -1));

  const handleSubmit = (e) => {
    e.preventDefault();
    const itemsInsumos = lineas
      .filter((l) => l.insumoId && Number(l.cantidad) > 0)
      .map((l) => ({ insumoId: Number(l.insumoId), cantidad: Number(l.cantidad), costoUnitario: Number(l.costo || 0) }));
    if (!proveedorId || itemsInsumos.length === 0) return;
    GFDB.registrarCompra({ proveedorId: Number(proveedorId), usuarioId: session.usuarioId, tipo: "insumo", itemsInsumos, observaciones });
    setLineas([{ insumoId: insumos[0]?.id || "", cantidad: "", costo: "" }]);
    setObservaciones("");
    bump();
    showToast("Compra registrada. Stock de insumos actualizado.");
  };

  const columns = [
    { key: "fecha", label: "Fecha", render: (c) => fmtDate(c.fecha) },
    {
      key: "proveedor",
      label: "Proveedor",
      render: (c) => GFDB.find("proveedores", c.proveedor_id).razon_social,
      searchValue: (c) => GFDB.find("proveedores", c.proveedor_id).razon_social,
    },
    {
      key: "insumos",
      label: "Insumos",
      render: (c) =>
        GFDB.query("detalle_compra_insumos", (d) => d.compra_id === c.id)
          .map((l) => `${GFDB.find("insumos", l.insumo_id).nombre} (${l.cantidad})`)
          .join(", "),
    },
    { key: "costo_total", label: "Costo total", render: (c) => money(c.costo_total) },
  ];

  const actionsRenderer = (c) => <RowActions onView={() => setDetalleCompra(c.id)} />;

  const compraActiva = detalleCompra ? GFDB.find("compras", detalleCompra) : null;

  return (
    <div>
      <SectionBar eyebrowNumber={EYEBROWS.compras.n} eyebrow={EYEBROWS.compras.label} title="Compras" description="Historial de compras a proveedores." />
      <ListToolbar
        onNew={() => formRef.current?.scrollIntoView({ behavior: "smooth", block: "start" })}
        newLabel="Nueva compra"
        onExport={() => exportCSV("compras.csv", columns, compras)}
        onPrint={() => window.print()}
      />
      <FiltersBar
        filters={[
          {
            label: "Proveedor",
            value: filtroProveedor,
            onChange: setFiltroProveedor,
            options: [{ value: "todos", label: "Todos los proveedores" }, ...proveedores.map((p) => ({ value: String(p.id), label: p.razon_social }))],
          },
        ]}
      />
      <DataTable columns={columns} rows={compras} getRowId={(c) => c.id} actionsRenderer={actionsRenderer} searchPlaceholder="Buscar proveedor…" />

      {compraActiva && (
        <Modal open={true} onClose={() => setDetalleCompra(null)} title={`Compra #${compraActiva.id}`}>
          <p className="text-sm text-deep/60 mb-1">
            Proveedor: <span className="font-medium text-deep">{GFDB.find("proveedores", compraActiva.proveedor_id).razon_social}</span>
          </p>
          <p className="text-sm text-deep/60 mb-4">Fecha: {fmtDate(compraActiva.fecha)}</p>
          <ul className="divide-y divide-deep/6 mb-4">
            {GFDB.query("detalle_compra_insumos", (d) => d.compra_id === compraActiva.id).map((l) => {
              const insumo = GFDB.find("insumos", l.insumo_id);
              return (
                <li key={l.id} className="py-2 flex items-center justify-between text-sm">
                  <span>
                    {insumo.nombre} · {l.cantidad} {insumo.unidad_medida}
                  </span>
                  <span className="font-medium">{money(l.subtotal)}</span>
                </li>
              );
            })}
          </ul>
          <p className="text-right font-semibold text-deep">Total: {money(compraActiva.costo_total)}</p>
          {compraActiva.observaciones && <p className="text-xs text-deep/50 mt-3">Obs: {compraActiva.observaciones}</p>}
        </Modal>
      )}

      <div ref={formRef} className="mt-8">
        <h2 className="font-display font-bold text-lg text-deep mb-3">Nueva compra</h2>
        <Card className="p-6">
          <form onSubmit={handleSubmit} className="space-y-4">
            <Field label="Proveedor">
              <select value={proveedorId} onChange={(e) => setProveedorId(e.target.value)} className={inputClass}>
                {proveedores.map((p) => (
                  <option key={p.id} value={p.id}>
                    {p.razon_social}
                  </option>
                ))}
              </select>
            </Field>

            <div className="space-y-3">
              {lineas.map((l, idx) => (
                <div key={idx} className="grid grid-cols-1 sm:grid-cols-[1fr_120px_140px_auto] gap-3 items-end">
                  <Field label="Insumo / materia prima">
                    <select value={l.insumoId} onChange={(e) => setLinea(idx, { insumoId: e.target.value })} className={inputClass}>
                      {insumos.map((i) => (
                        <option key={i.id} value={i.id}>
                          {i.nombre} ({i.unidad_medida})
                        </option>
                      ))}
                    </select>
                  </Field>
                  <Field label="Cantidad">
                    <input type="number" min="1" value={l.cantidad} onChange={(e) => setLinea(idx, { cantidad: e.target.value })} className={inputClass} />
                  </Field>
                  <Field label="Costo unitario">
                    <input type="number" min="0" value={l.costo} onChange={(e) => setLinea(idx, { costo: e.target.value })} className={inputClass} />
                  </Field>
                  {lineas.length > 1 && (
                    <Button type="button" variant="ghost" onClick={() => removeLinea(idx)}>
                      Quitar
                    </Button>
                  )}
                </div>
              ))}
            </div>
            <Button type="button" variant="secondary" onClick={addLinea}>
              <PlusIcon /> Agregar insumo
            </Button>

            <Field label="Observaciones">
              <textarea value={observaciones} onChange={(e) => setObservaciones(e.target.value)} rows={2} className={inputClass} />
            </Field>
            <Button type="submit">Registrar compra</Button>
          </form>
        </Card>
      </div>
    </div>
  );
};

const ListasPreciosTab = ({ bump, showToast }) => {
  const listas = GFDB.get("listas_precios");
  const productos = GFDB.get("productos");
  const [nombreNueva, setNombreNueva] = useState("");
  const [listaEditando, setListaEditando] = useState(null);

  const crearLista = (e) => {
    e.preventDefault();
    if (!nombreNueva.trim()) return;
    GFDB.insert("listas_precios", { nombre: nombreNueva, es_predeterminada: false });
    setNombreNueva("");
    bump();
    showToast("Lista de precios creada.");
  };

  const precioEnLista = (listaId, productoId) => {
    const item = GFDB.query("lista_precios_items", (i) => i.lista_id === listaId && i.producto_id === productoId)[0];
    return item ? item.precio : GFDB.find("productos", productoId).precio;
  };

  const guardarPrecio = (listaId, productoId, precio) => {
    const item = GFDB.query("lista_precios_items", (i) => i.lista_id === listaId && i.producto_id === productoId)[0];
    if (item) GFDB.update("lista_precios_items", item.id, { precio });
    else GFDB.insert("lista_precios_items", { lista_id: listaId, producto_id: productoId, precio });
    bump();
  };

  const listaActiva = listaEditando ? GFDB.find("listas_precios", listaEditando) : null;

  return (
    <div>
      <SectionBar eyebrowNumber={EYEBROWS["listas-precios"].n} eyebrow={EYEBROWS["listas-precios"].label} title="Listas de Precios" />

            </tr>
          </thead>
          <tbody>
            {listas.map((l, i) => (
              <tr key={l.id} className={i % 2 === 1 ? "bg-deep/[0.025]" : ""}>
                <td className="px-4 py-3 border-t border-deep/5 font-medium text-deep">
                  {l.nombre} {l.es_predeterminada && <span className="text-xs text-deep/40 font-normal">(predeterminada)</span>}
                </td>
                <td className="px-4 py-3 border-t border-deep/5 text-right">

          <div className="space-y-2 max-h-[60vh] overflow-y-auto">

                <input
                  type="number"

/* ---------------------------------------------------------
   TRANSFERENCIAS DE STOCK (enviar, del lado fábrica)
--------------------------------------------------------- */
const TransferenciasFabricaTab = ({ session, bump, showToast }) => {
  const ubicacionFabrica = GFDB.ubicacionFabrica();
  const sucursales = GFDB.get("sucursales");
  const productos = GFDB.get("productos");
  const [destinoSucursalId, setDestinoSucursalId] = useState(sucursales[0]?.id || "");
  const [lineas, setLineas] = useState([{ productoId: productos[0]?.id || "", cantidad: "" }]);
  const [observaciones, setObservaciones] = useState("");

  const setLinea = (idx, patch) => setLineas((prev) => prev.map((l, i) => (i === idx ? { ...l, ...patch } : l)));
  const addLinea = () => setLineas((prev) => [...prev, { productoId: productos[0]?.id || "", cantidad: "" }]);
  const removeLinea = (idx) => setLineas((prev) => prev.filter((_, i) => i !== idx));

  const transferencias = GFDB.query("transferencias_stock", (t) => t.origen_ubicacion_id === ubicacionFabrica.id).sort((a, b) => (a.fecha < b.fecha ? 1 : -1));

  const handleSubmit = (e) => {
    e.preventDefault();
    const destino = GFDB.ubicacionDeSucursal(Number(destinoSucursalId));
    const items = lineas.filter((l) => l.productoId && Number(l.cantidad) > 0).map((l) => ({ productoId: Number(l.productoId), cantidad: Number(l.cantidad) }));
    if (!destino || items.length === 0) return;
    GFDB.crearTransferencia({ origenId: ubicacionFabrica.id, destinoId: destino.id, usuarioId: session.usuarioId, items, observaciones });
    setLineas([{ productoId: productos[0]?.id || "", cantidad: "" }]);
    setObservaciones("");
    bump();
    showToast("Transferencia enviada. Queda pendiente de recepción en la sucursal.");
  };

  const columns = [
    { key: "fecha", label: "Fecha", render: (t) => fmtDate(t.fecha) },
    { key: "destino", label: "Destino", render: (t) => GFDB.find("ubicaciones_stock", t.destino_ubicacion_id)?.nombre || "-" },
    {
      key: "items",
      label: "Productos",
      render: (t) =>
        GFDB.query("detalle_transferencia_stock", (d) => d.transferencia_id === t.id)
          .map((d) => `${GFDB.find("productos", d.producto_id).nombre} (${d.cantidad})`)
          .join(", "),
    },
    {
      key: "estado",
      label: "Estado",
      render: (t) => (
        <span className={`text-xs font-semibold ${t.estado === "recibido" ? "text-institutional" : "text-amber-600"}`}>
          {enumLabel("estado_transferencia", t.estado)}
        </span>
      ),
      csvValue: (t) => enumLabel("estado_transferencia", t.estado),
    },
  ];

  return (
    <div>
      <SectionBar eyebrowNumber={EYEBROWS.transferencias.n} eyebrow={EYEBROWS.transferencias.label} title="Transferencias de Stock" description="Envío de producto terminado desde el stock central hacia una sucursal." />
      <DataTable columns={columns} rows={transferencias} getRowId={(t) => t.id} searchPlaceholder="Buscar producto…" />

      <div className="mt-8">
        <h2 className="font-display font-bold text-lg text-deep mb-3">Nueva transferencia</h2>
        <Card className="p-6">
          <form onSubmit={handleSubmit} className="space-y-4">
            <Field label="Sucursal destino">
              <select value={destinoSucursalId} onChange={(e) => setDestinoSucursalId(e.target.value)} className={inputClass}>
                {sucursales.map((s) => (
                  <option key={s.id} value={s.id}>
                    {s.nombre}
                  </option>
                ))}
              </select>
            </Field>

            <div className="space-y-3">
              {lineas.map((l, idx) => (
                <div key={idx} className="grid grid-cols-1 sm:grid-cols-[1fr_140px_auto] gap-3 items-end">
                  <Field label="Producto">
                    <select value={l.productoId} onChange={(e) => setLinea(idx, { productoId: e.target.value })} className={inputClass}>
                      {productos.map((p) => (
                        <option key={p.id} value={p.id}>
                          {p.nombre}
                        </option>
                      ))}
                    </select>
                  </Field>
                  <Field label="Cantidad">
                    <input type="number" min="1" value={l.cantidad} onChange={(e) => setLinea(idx, { cantidad: e.target.value })} className={inputClass} />
                  </Field>
                  {lineas.length > 1 && (
                    <Button type="button" variant="ghost" onClick={() => removeLinea(idx)}>
                      Quitar
                    </Button>
                  )}
                </div>
              ))}
            </div>
            <Button type="button" variant="secondary" onClick={addLinea}>
              <PlusIcon /> Agregar producto
            </Button>

            <Field label="Observaciones">
              <textarea value={observaciones} onChange={(e) => setObservaciones(e.target.value)} rows={2} className={inputClass} />
            </Field>
            <Button type="submit">Enviar transferencia</Button>
          </form>
        </Card>
      </div>
    </div>
  );
};

/* ---------------------------------------------------------
   ESTADÍSTICAS
--------------------------------------------------------- */
const EstadisticasComprasTab = () => {
  const totales = {};
  GFDB.get("compras").forEach((c) => {
    totales[c.proveedor_id] = (totales[c.proveedor_id] || 0) + c.costo_total;
  });
  const filas = Object.entries(totales)
    .map(([proveedorId, total]) => ({ id: Number(proveedorId), proveedor: GFDB.find("proveedores", Number(proveedorId)), total }))
    .filter((f) => f.proveedor)
    .sort((a, b) => b.total - a.total);

  const columns = [
    { key: "proveedor", label: "Proveedor", render: (f) => f.proveedor.razon_social },
    { key: "total", label: "Total comprado", render: (f) => money(f.total) },
  ];

  return (
    <div>
      <SectionBar eyebrowNumber={EYEBROWS["stats-compras"].n} eyebrow={EYEBROWS["stats-compras"].label} title="Compras por proveedor" />
      {filas.length === 0 ? <EmptyState text="Todavía no hay compras registradas." /> : <DataTable columns={columns} rows={filas} getRowId={(f) => f.id} searchPlaceholder="Buscar proveedor…" />}
    </div>
  );
};

const EstadisticasProductosFabricaTab = () => {
  const cantidades = {};
  GFDB.get("producciones").forEach((p) => {
    cantidades[p.producto_id] = (cantidades[p.producto_id] || 0) + p.cantidad_producida;
  });
  const filas = Object.entries(cantidades)
    .map(([productoId, cantidad]) => ({ id: Number(productoId), producto: GFDB.find("productos", Number(productoId)), cantidad }))
    .filter((f) => f.producto)
    .sort((a, b) => b.cantidad - a.cantidad);

  const columns = [
    { key: "producto", label: "Producto", render: (f) => f.producto.nombre },
    { key: "cantidad", label: "Unidades producidas", render: (f) => f.cantidad },
  ];

  return (
    <div>
      <SectionBar eyebrowNumber={EYEBROWS["stats-productos"].n} eyebrow={EYEBROWS["stats-productos"].label} title="Top productos producidos" />
      {filas.length === 0 ? <EmptyState text="Todavía no hay producciones registradas." /> : <DataTable columns={columns} rows={filas} getRowId={(f) => f.id} searchPlaceholder="Buscar producto…" />}
    </div>
  );
};

/* ---------------------------------------------------------
   CONFIGURACIONES — Usuarios / Roles / Integraciones (idéntico criterio
   que sucursal — usuarios es una tabla global, se gestiona igual desde
   cualquiera de las dos interfaces)
--------------------------------------------------------- */
const UsuariosTab = ({ session, bump, showToast }) => {
  const usuarios = GFDB.get("usuarios");
  const roles = GFDB.get("roles");
  const sucursales = GFDB.get("sucursales");
  const [nombre, setNombre] = useState("");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [rolId, setRolId] = useState(roles.find((r) => r.nombre === "administrativo_fabrica")?.id || roles[0]?.id || "");
  const [sucursalId, setSucursalId] = useState(sucursales[0]?.id || "");
  const [nuevoAbierto, setNuevoAbierto] = useState(false);

  const rolElegido = roles.find((r) => r.id === Number(rolId));
  const esFabrica = rolElegido?.nombre === "administrativo_fabrica";

  const crear = (e) => {
    e.preventDefault();
    if (!nombre.trim() || !email.trim() || !password.trim()) return;
    GFDB.insert("usuarios", { nombre, email, password, rol_id: Number(rolId), sucursal_id: esFabrica ? null : Number(sucursalId), activo: true });
    setNombre("");
    setEmail("");
    setPassword("");
    setNuevoAbierto(false);
    bump();
    showToast("Usuario creado.");
  };

  const columns = [
    { key: "nombre", label: "Nombre", render: (u) => u.nombre },
    { key: "email", label: "Email", render: (u) => u.email },
    { key: "rol", label: "Rol", render: (u) => ROLE_LABELS[GFDB.find("roles", u.rol_id)?.nombre] || "-" },
    { key: "sucursal", label: "Sucursal", render: (u) => GFDB.find("sucursales", u.sucursal_id)?.nombre || "Fábrica" },
    {
      key: "estado",
      label: "Estado",
      render: (u) => <span className={`text-xs font-semibold ${u.activo ? "text-institutional" : "text-deep/40"}`}>{u.activo ? "Activo" : "Inactivo"}</span>,
      csvValue: (u) => (u.activo ? "Activo" : "Inactivo"),
    },
  ];

  const actionsRenderer = (u) => (
    <RowActions
      onDelete={() => {
        GFDB.update("usuarios", u.id, { activo: !u.activo });
        bump();
        showToast(u.activo ? "Usuario desactivado." : "Usuario reactivado.");
      }}
      deleteIcon={PowerIcon}
      deleteLabel={u.activo ? "Desactivar" : "Activar"}
    />
  );

  return (
    <div>
      <SectionBar eyebrowNumber={EYEBROWS["config-usuarios"].n} eyebrow={EYEBROWS["config-usuarios"].label} title="Usuarios" description="Usuarios internos autorizados a acceder al panel (sucursales y fábrica)." />
      <ListToolbar onNew={() => setNuevoAbierto(true)} newLabel="Nuevo usuario" onExport={() => exportCSV("usuarios.csv", columns, usuarios)} />
      <DataTable columns={columns} rows={usuarios} getRowId={(u) => u.id} actionsRenderer={actionsRenderer} searchPlaceholder="Buscar usuario…" />

      <Modal open={nuevoAbierto} onClose={() => setNuevoAbierto(false)} title="Nuevo usuario">
        <form onSubmit={crear} className="space-y-4">
          <Field label="Nombre">
            <input required value={nombre} onChange={(e) => setNombre(e.target.value)} className={inputClass} />
          </Field>
          <Field label="Email">
            <input type="email" required value={email} onChange={(e) => setEmail(e.target.value)} className={inputClass} />
          </Field>
          <Field label="Contraseña">
            <input type="password" required value={password} onChange={(e) => setPassword(e.target.value)} className={inputClass} />
          </Field>
          <Field label="Rol">
            <select value={rolId} onChange={(e) => setRolId(e.target.value)} className={inputClass}>
              {roles.map((r) => (
                <option key={r.id} value={r.id}>
                  {ROLE_LABELS[r.nombre]}
                </option>
              ))}
            </select>
          </Field>
          {!esFabrica && (
            <Field label="Sucursal">
              <select value={sucursalId} onChange={(e) => setSucursalId(e.target.value)} className={inputClass}>
                {sucursales.map((s) => (
                  <option key={s.id} value={s.id}>
                    {s.nombre}
                  </option>
                ))}
              </select>
            </Field>
          )}
          <Button type="submit">
            <PlusIcon /> Crear usuario
          </Button>
        </form>
      </Modal>
    </div>
  );
};

    <Card className="p-6 max-w-lg">

      </p>

/* ---------------------------------------------------------
   APP
--------------------------------------------------------- */
const FabricaApp = () => {
  const [session] = useState(() => GFAuth.requireRole(["administrativo_fabrica"]));
  const [tab, setTab] = useState("dashboard");
  const [tick, setTick] = useState(0);
  const [toast, setToast] = useState(null);

  const bump = () => setTick((t) => t + 1);
  const showToast = (message, kind = "success") => {
    setToast({ message, kind });
    setTimeout(() => setToast(null), 3000);
  };

  if (!session) return null;

  let content;
  if (tab === "dashboard") content = <DashboardFabricaTab onNavigate={setTab} />;
  else if (tab === "proveedores") content = <ProveedoresTab session={session} bump={bump} showToast={showToast} />;
  else if (tab === "compras") content = <ComprasTab session={session} bump={bump} showToast={showToast} />;
  else if (tab === "produccion") content = <ProduccionTab session={session} bump={bump} showToast={showToast} />;
  else if (tab === "trazabilidad") content = <TrazabilidadTab />;
  else if (tab === "productos-lista") content = <ListaProductosFabricaTab bump={bump} showToast={showToast} />;
  else if (tab === "listas-precios") content = <ListasPreciosTab bump={bump} showToast={showToast} />;
  else if (tab === "ajuste-fabrica") content = <AjusteFabricaTab session={session} bump={bump} showToast={showToast} />;
  else if (tab === "transferencias") content = <TransferenciasFabricaTab session={session} bump={bump} showToast={showToast} />;
  else if (tab === "categorias") content = <CategoriasTab bump={bump} showToast={showToast} />;
  else if (tab === "marcas") content = <MarcasTab bump={bump} showToast={showToast} />;
  else if (tab === "grupos") content = <GruposTab bump={bump} showToast={showToast} />;
  else if (tab === "variantes") content = <VariantesTab bump={bump} showToast={showToast} />;
  else if (tab === "depositos") content = <DepositosTab bump={bump} showToast={showToast} />;
  else if (tab === "stats-compras") content = <EstadisticasComprasTab />;
  else if (tab === "stats-productos") content = <EstadisticasProductosFabricaTab />;
  else if (tab === "config-usuarios") content = <UsuariosTab session={session} bump={bump} showToast={showToast} />;
  else if (tab === "config-roles") content = <RolesTab />;
  else if (tab === "config-integraciones") content = <IntegracionesTab />;
  else if (COMPRAS_PLACEHOLDER_ITEMS.some((it) => it.key === tab)) {
    const it = COMPRAS_PLACEHOLDER_ITEMS.find((i) => i.key === tab);
    content = (
      <ProximamenteTab
        eyebrowNumber={EYEBROWS[tab].n}
        eyebrow={EYEBROWS[tab].label}
        titulo={it.label}
        descripcion="Todavía no está construido como documento propio — hoy la compra se registra directo en Facturas. Queda planificado para una etapa siguiente."
      />
    );
  } else if (CONTABILIDAD_ITEMS.some((it) => it.key === tab)) {
    const it = CONTABILIDAD_ITEMS.find((i) => i.key === tab);
    content = (
      <ProximamenteTab
        eyebrowNumber={EYEBROWS[tab].n}
        eyebrow={EYEBROWS[tab].label}
        titulo={it.label}
        descripcion="Bajo el CUIT propio de fábrica — nunca consolidado con ninguna sucursal. Motor contable planificado para una etapa siguiente del roadmap."
      />
    );
  } else if (["config-emails", "config-leyendas", "config-reportes"].includes(tab)) {
    const it = CONFIG_ITEMS.find((i) => i.key === tab);
    content = <ProximamenteTab eyebrowNumber={EYEBROWS[tab].n} eyebrow={EYEBROWS[tab].label} titulo={it.label} />;
  }
  else content = <DashboardFabricaTab onNavigate={setTab} />;

  return (
    <PrivateShell
      session={session}
      modules={FABRICA_MODULES}
      quickAccess={FABRICA_QUICK_ACCESS}
      activeKey={tab}
      onNavigate={setTab}
      notifCount={0}
      onLogout={GFAuth.logout}
    >
      {content}
      <Toast message={toast?.message} kind={toast?.kind} onClose={() => setToast(null)} />
    </PrivateShell>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<FabricaApp />);
