const money = (n) =>

const fmtDate = (iso) => {
  if (!iso) return "-";
  // Fechas "solo fecha" (YYYY-MM-DD) se arman en horario local: new Date(iso)
  // las interpreta como medianoche UTC y en husos negativos (AR) muestran el
  // día anterior.
  const soloFecha = /^\d{4}-\d{2}-\d{2}$/.test(iso);
  const d = soloFecha ? new Date(`${iso}T00:00:00`) : new Date(iso);
  return d.toLocaleDateString("es-AR");
};

const fmtDateTime = (iso) => {
  if (!iso) return "-";
  const d = new Date(iso);
  return `${d.toLocaleDateString("es-AR")} ${d.toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" })}`;
};

const enumLabel = (enumName, value) => {
  const item = (window.GF_ENUMS[enumName] || []).find((e) => e.value === value);
  return item ? item.label : value;
};

const exportCSV = (filename, columns, rows) => {
  const esc = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const header = columns.map((c) => esc(c.label)).join(",");
  const lines = rows.map((r) => columns.map((c) => esc(c.csvValue ? c.csvValue(r) : c.searchValue ? c.searchValue(r) : r[c.key])).join(","));
  const csv = [header, ...lines].join("\n");
  const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
};

            <button
              key={q.key}

              onClick={() => onNavigate(target)}
              className={`p-2.5 rounded-xl transition-colors shrink-0 ${
                activeKey === target ? "bg-institutional text-white" : "text-white/55 hover:text-white hover:bg-white/10"
              }`}
            >

            </button>
          );

      <button className="relative p-2 rounded-xl text-white/70 hover:text-white hover:bg-white/10 shrink-0" title="Notificaciones">

            {notifCount}

          <span className="w-8 h-8 rounded-full bg-institutional text-white text-xs font-bold flex items-center justify-center">{iniciales}</span>

const Sidebar = ({ modules, activeKey, onNavigate, mobileOpen, onCloseMobile }) => {
  const parentOfActive = modules.find((m) => m.children && m.children.some((c) => c.key === activeKey));
  const [openKey, setOpenKey] = useState(parentOfActive ? parentOfActive.key : null);

  const navigate = (key) => {
    onNavigate(key);
    onCloseMobile();
  };

  return (
    <>
      {mobileOpen && <div className="fixed inset-0 bg-deep/60 z-20 md:hidden" onClick={onCloseMobile} />}
      <aside
        className={`fixed top-16 left-0 bottom-0 w-64 bg-deep border-r border-white/5 overflow-y-auto py-4 z-30 transition-transform duration-200 md:translate-x-0 ${
          mobileOpen ? "translate-x-0" : "-translate-x-full"
        }`}
      >
        <nav className="px-3 space-y-1">
          {modules.map((m) => {
          if (m.children) {
            const isOpen = openKey === m.key;
            const childActive = m.children.some((c) => c.key === activeKey);
            return (
              <div key={m.key}>
                <button
                  onClick={() => setOpenKey(isOpen ? null : m.key)}
                  className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-colors ${
                    childActive ? "text-institutional" : "text-white/70 hover:text-white hover:bg-white/5"
                  }`}
                >
                  {m.icon}
                  <span className="flex-1 text-left">{m.label}</span>
                  <ChevronDownIcon className={`w-4 h-4 transition-transform ${isOpen ? "rotate-180" : ""}`} />
                </button>
                {isOpen && (
                  <div className="mt-1 ml-4 pl-4 border-l border-white/10 space-y-0.5">
                    {m.children.map((c) => {
                      const active = activeKey === c.key;
                      return (
                        <button
                          key={c.key}
                          onClick={() => navigate(c.key)}
                          className={`relative w-full flex items-center gap-2 pl-3 pr-2 py-2 rounded-lg text-sm text-left ${
                            active ? "bg-institutional/15 text-institutional font-semibold" : "text-white/60 hover:text-white hover:bg-white/5"
                          }`}
                        >
                          {active && <span className="absolute left-0 top-0 bottom-0 w-1 rounded-full bg-institutional" />}
                          <span className="w-1.5 h-1.5 rounded-full bg-current opacity-60 shrink-0" />
                          {c.label}
                        </button>
                      );
                    })}
                  </div>
                )}
              </div>
            );
          }
          const active = activeKey === m.key;
          return (
            <button
              key={m.key}
              onClick={() => navigate(m.key)}
              className={`relative w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-colors ${
                active ? "bg-institutional/15 text-institutional font-semibold" : "text-white/70 hover:text-white hover:bg-white/5"
              }`}
            >
              {active && <span className="absolute left-0 top-1.5 bottom-1.5 w-1 rounded-full bg-institutional" />}
              {m.icon}
              {m.label}
            </button>
          );
          })}
        </nav>
      </aside>
    </>
  );
};

const SalesChart = ({ data, range, onRangeChange }) => {
  const [hover, setHover] = useState(null);
  const max = Math.max(1, ...data.map((d) => d.value));
  const w = 640,
    h = 220,
    padTop = 16,
    padBottom = 28,
    padSide = 8,
    barGap = 10;
  const barW = data.length ? (w - padSide * 2 - barGap * (data.length - 1)) / data.length : 0;
  const hasData = data.some((d) => d.value > 0);

  return (
    <Card className="p-6">
      <div className="flex flex-wrap items-center justify-between gap-4 mb-5">
        <h3 className="font-display font-bold text-base text-deep">Ventas por período</h3>
        <div className="flex items-center gap-1 bg-deep/5 rounded-full p-1">
          {CHART_RANGES.map((r) => (
            <button
              key={r.key}
              onClick={() => onRangeChange(r.key)}
              className={`px-3 py-1.5 rounded-full text-xs font-semibold transition-colors ${
                range === r.key ? "bg-institutional text-white" : "text-deep/60 hover:text-deep"
              }`}
            >
              {r.label}
            </button>
          ))}
        </div>
      </div>

      {!hasData ? (
        <EmptyState text="Todavía no hay ventas ni pedidos confirmados en este período." />
      ) : (
        <div className="relative">
          <svg viewBox={`0 0 ${w} ${h}`} className="w-full h-52" preserveAspectRatio="none">
            {data.map((d, i) => {
              const barH = Math.max(2, ((h - padTop - padBottom) * d.value) / max);
              const x = padSide + i * (barW + barGap);
              const y = h - padBottom - barH;
              return (
                <g key={i} onMouseEnter={() => setHover(i)} onMouseLeave={() => setHover((v) => (v === i ? null : v))}>
                  <rect x={x} y={padTop} width={barW} height={h - padTop - padBottom} fill="transparent" />
                  <rect x={x} y={y} width={barW} height={barH} rx={4} fill={hover === i ? "#29683D" : "#00AE4C"} />
                  <text x={x + barW / 2} y={h - 8} textAnchor="middle" fontSize="9" fill="#1A312B" opacity="0.45">
                    {d.label}
                  </text>
                </g>
              );
            })}
          </svg>
          {hover !== null && data[hover] && (
            <div
              className="absolute -translate-x-1/2 -translate-y-full bg-deep text-white text-xs rounded-lg px-2.5 py-1.5 pointer-events-none whitespace-nowrap"
              style={{
                left: `${((padSide + hover * (barW + barGap) + barW / 2) / w) * 100}%`,
                top: `${((h - padBottom - Math.max(2, ((h - padTop - padBottom) * data[hover].value) / max)) / h) * 100}%`,
              }}
            >
              {money(data[hover].value)}
            </div>
          )}
        </div>
      )}
    </Card>
  );
};

const DataTable = ({ columns, rows, getRowId, actionsRenderer, searchPlaceholder = "Buscar…", pageSizeOptions = [10, 25, 50] }) => {
  const [query, setQuery] = useState("");
  const [visibleCols, setVisibleCols] = useState(() => new Set(columns.filter((c) => c.defaultVisible !== false).map((c) => c.key)));
  const [colsMenuOpen, setColsMenuOpen] = useState(false);
  const [pageSize, setPageSize] = useState(pageSizeOptions[0]);
  const [page, setPage] = useState(1);

  const q = query.trim().toLowerCase();
  const filtered = q
    ? rows.filter((r) => columns.some((c) => String((c.searchValue ? c.searchValue(r) : r[c.key]) ?? "").toLowerCase().includes(q)))
    : rows;

  const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
  const safePage = Math.min(page, totalPages);
  const start = (safePage - 1) * pageSize;
  const pageRows = filtered.slice(start, start + pageSize);
  const visibleColumns = columns.filter((c) => visibleCols.has(c.key));

  const toggleCol = (key) => {
    setVisibleCols((prev) => {
      const next = new Set(prev);
      if (next.has(key)) next.delete(key);
      else next.add(key);
      return next;
    });
  };

  return (
    <div>
      <div className="flex flex-wrap items-center gap-2 mb-3">
        <div className="relative flex-1 min-w-[200px] max-w-xs">
          <SearchIcon className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-deep/35" />
          <input
            value={query}
            onChange={(e) => {
              setQuery(e.target.value);
              setPage(1);
            }}
            placeholder={searchPlaceholder}
            className={`${inputClass} pl-9`}
          />
        </div>
        <div className="flex-1" />
        <div className="relative">
          <Button variant="secondary" onClick={() => setColsMenuOpen((v) => !v)}>
            <ColumnsIcon /> Columnas
          </Button>
          {colsMenuOpen && (
            <div
              className="absolute right-0 top-11 w-56 bg-white rounded-xl shadow-xl border border-deep/8 py-2 z-30"
              onMouseLeave={() => setColsMenuOpen(false)}
            >
              {columns.map((c) => (
                <label key={c.key} className="flex items-center gap-2 px-3.5 py-1.5 text-sm text-deep/80 cursor-pointer">
                  <input type="checkbox" checked={visibleCols.has(c.key)} onChange={() => toggleCol(c.key)} />
                  {c.label}
                </label>
              ))}
            </div>
          )}
        </div>
        <select
          value={pageSize}
          onChange={(e) => {
            setPageSize(Number(e.target.value));
            setPage(1);
          }}
          className={`${inputClass} w-auto`}
        >
          {pageSizeOptions.map((n) => (
            <option key={n} value={n}>
              {n} por página
            </option>
          ))}
        </select>
      </div>

      {filtered.length === 0 ? (
        <EmptyState text="No se encontraron resultados." />
      ) : (
        <>
          <TableWrap>
            <table className="w-full text-sm">
              <thead className="bg-institutional/10 text-deep/70 text-xs uppercase">
                <tr>
                  {visibleColumns.map((c) => (
                    <th key={c.key} className="text-left px-4 py-3 font-semibold whitespace-nowrap">
                      {c.label}
                    </th>
                  ))}
                  {actionsRenderer && <th className="px-4 py-3"></th>}
                </tr>
              </thead>
              <tbody>
                {pageRows.map((row, i) => (
                  <tr key={getRowId(row)} className={i % 2 === 1 ? "bg-deep/[0.025]" : ""}>
                    {visibleColumns.map((c) => (
                      <td key={c.key} className="px-4 py-3 border-t border-deep/5">
                        {c.render ? c.render(row) : row[c.key]}
                      </td>
                    ))}
                    {actionsRenderer && <td className="px-4 py-3 border-t border-deep/5">{actionsRenderer(row)}</td>}
                  </tr>
                ))}
              </tbody>
            </table>
          </TableWrap>

          <div className="flex flex-wrap items-center justify-between gap-3 mt-3 text-sm text-deep/55">
            <p>
              {start + 1}-{Math.min(start + pageSize, filtered.length)} de {filtered.length}
            </p>
            <div className="flex items-center gap-1">
              <button
                disabled={safePage <= 1}
                onClick={() => setPage((p) => Math.max(1, p - 1))}
                className="px-2.5 py-1.5 rounded-lg border border-deep/10 disabled:opacity-30"
              >
                ‹
              </button>
              <span className="px-2">
                {safePage} / {totalPages}
              </span>
              <button
                disabled={safePage >= totalPages}
                onClick={() => setPage((p) => Math.min(totalPages, p + 1))}
                className="px-2.5 py-1.5 rounded-lg border border-deep/10 disabled:opacity-30"
              >
                ›
              </button>
            </div>
          </div>
        </>
      )}
    </div>
  );
};

const { useState, useEffect } = React;

const MENSAJES_POR_MOTIVO = {
  vencida: { tipo: "aviso", texto: "Tu sesión venció por inactividad. Ingresá de nuevo." },
  salida: { tipo: "ok", texto: "Cerraste la sesión." },
};

const Aviso = ({ tipo, children }) => {
  const estilos = {
    error: "text-red-700 bg-red-50 border-red-100",
    aviso: "text-amber-800 bg-amber-50 border-amber-100",
    ok: "text-medium bg-institutional/10 border-institutional/20",
  };
  return (
    <div role={tipo === "error" ? "alert" : "status"} className={`text-sm border rounded-xl px-3.5 py-2.5 ${estilos[tipo]}`}>
      {children}
    </div>
  );
};

/** Mensaje claro para cada respuesta de la API. El login fallido trae siempre el mismo texto del servidor. */
const mensajeDeError = (r, porDefecto) => {
  if (r.status === 0) return r.data.mensaje;
  if (r.status === 400 && r.data && r.data.campos) return Object.values(r.data.campos).join(" ");
  return (r.data && r.data.mensaje) || porDefecto;
};

const LinkBoton = ({ onClick, children }) => (
  <button type="button" onClick={onClick} className="text-sm font-semibold text-medium hover:text-institutional">
    {children}
  </button>
);

const FormIngreso = ({ aviso, onSesion, onOlvide }) => {
  const [usuario, setUsuario] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [cargando, setCargando] = useState(false);

  const enviar = async (e) => {
    e.preventDefault();
    setError("");
    setCargando(true);
    const r = await GFAuth.login(usuario.trim(), password);
    setCargando(false);
    if (!r.ok) {
      setError(mensajeDeError(r, "No se pudo iniciar sesión."));
      setPassword("");
      return;
    }
    onSesion(r.data);
  };

  return (
    <form onSubmit={enviar} className="space-y-4" noValidate>
      {aviso && <Aviso tipo={aviso.tipo}>{aviso.texto}</Aviso>}
      <Field label="Usuario o email">
        <input type="text" required autoComplete="username" autoCapitalize="none" spellCheck={false} value={usuario}
          onChange={(e) => setUsuario(e.target.value)} className={inputClass} autoFocus />
      </Field>
      <Field label="Contraseña">
        <input type="password" required autoComplete="current-password" value={password}
          onChange={(e) => setPassword(e.target.value)} className={inputClass} placeholder="••••••••" />
      </Field>
      {error && <Aviso tipo="error">{error}</Aviso>}
      <Button type="submit" disabled={cargando || !usuario.trim() || !password} className="w-full">
        {cargando ? "Ingresando…" : "Ingresar"}
      </Button>
      <div className="text-center">
        <LinkBoton onClick={onOlvide}>Olvidé mi contraseña</LinkBoton>
      </div>
    </form>
  );
};

const ElegirAmbito = ({ sesion, onElegido, onSalir }) => {
  const [error, setError] = useState("");
  const [eligiendo, setEligiendo] = useState(null);

  const elegir = async (p) => {
    setError("");
    setEligiendo(p.ambitoId);
    const r = await GFAuth.elegirAmbito(p.ambitoId);
    setEligiendo(null);
    if (r.status === 401) {
      window.location.replace("login.html?motivo=vencida");
      return;
    }
    if (!r.ok) {
      setError(mensajeDeError(r, "No se pudo entrar a ese ámbito."));
      return;
    }
    onElegido(r.data);
  };

  const actual = sesion.ambitoActivo && sesion.ambitoActivo.ambitoId;
  return (
    <div className="space-y-4">
      <div>
        <p className="font-semibold">Hola, {sesion.usuario.nombre}</p>
        <p className="text-sm text-deep/60">Tenés un perfil en más de un ámbito. ¿Con cuál querés entrar?</p>
      </div>
      <div className="space-y-2">
        {sesion.perfiles.map((p) => (
          <button key={p.ambitoId} type="button" onClick={() => elegir(p)} disabled={eligiendo !== null}
            className="w-full text-left rounded-xl border border-deep/10 hover:border-institutional hover:bg-institutional/5 px-4 py-3 transition-colors disabled:opacity-60">
            <span className="block font-semibold">
              {p.ambitoNombre}
              {p.ambitoId === actual && <span className="ml-2 text-xs font-medium text-medium">(actual)</span>}
            </span>
            <span className="block text-sm text-deep/60">
              {GFAuth.TIPOS_AMBITO[p.ambitoTipo]} · {GFAuth.PERFILES[p.perfil] || p.perfil}
              {eligiendo === p.ambitoId && " · entrando…"}
            </span>
          </button>
        ))}
      </div>
      {error && <Aviso tipo="error">{error}</Aviso>}
      <div className="text-center">
        <LinkBoton onClick={onSalir}>Cerrar sesión</LinkBoton>
      </div>
    </div>
  );
};

const Recuperar = ({ onVolver }) => {
  const [email, setEmail] = useState("");
  const [enviado, setEnviado] = useState(false);
  const [error, setError] = useState("");
  const [cargando, setCargando] = useState(false);

  const enviar = async (e) => {
    e.preventDefault();
    setError("");
    setCargando(true);
    const r = await GFAuth.recuperar(email.trim());
    setCargando(false);
    if (!r.ok) {
      setError(mensajeDeError(r, "No se pudo registrar el pedido."));
      return;
    }
    setEnviado(true);
  };

  if (enviado) {
    return (
      <div className="space-y-4">

        <p className="text-sm text-deep/60">

        </p>

          <LinkBoton onClick={onVolver}>Volver al ingreso</LinkBoton>
        </div>
      </div>

  return (
    <form onSubmit={enviar} className="space-y-4" noValidate>
      <div>
        <p className="font-semibold">Olvidé mi contraseña</p>
        <p className="text-sm text-deep/60">Ingresá tu email y te generamos un link para elegir una contraseña nueva.</p>
      </div>
      <Field label="Email">
        <input type="email" required autoComplete="username" value={email} onChange={(e) => setEmail(e.target.value)}
          className={inputClass} placeholder="nombre@greenfire.com" autoFocus />
      </Field>
      {error && <Aviso tipo="error">{error}</Aviso>}
      <Button type="submit" disabled={cargando || !email.trim()} className="w-full">
        {cargando ? "Enviando…" : "Pedir el link"}
      </Button>
      <div className="text-center">
        <LinkBoton onClick={onVolver}>Volver al ingreso</LinkBoton>
      </div>
    </form>
  );
};

const Restablecer = ({ token, onListo }) => {
  const [password, setPassword] = useState("");
  const [repetida, setRepetida] = useState("");
  const [error, setError] = useState("");
  const [cargando, setCargando] = useState(false);

  const enviar = async (e) => {
    e.preventDefault();
    setError("");
    if (password.length < 10) {
      setError("La contraseña debe tener al menos 10 caracteres.");
      return;
    }
    if (password !== repetida) {
      setError("Las dos contraseñas no coinciden.");
      return;
    }
    setCargando(true);
    const r = await GFAuth.restablecer(token, password);
    setCargando(false);
    if (!r.ok) {
      setError(mensajeDeError(r, "No se pudo cambiar la contraseña."));
      return;
    }
    onListo();
  };

  return (
    <form onSubmit={enviar} className="space-y-4" noValidate>
      <div>
        <p className="font-semibold">Elegí una contraseña nueva</p>
        <p className="text-sm text-deep/60">Al menos 10 caracteres. Se cierran las sesiones abiertas de tu cuenta.</p>
      </div>
      <Field label="Contraseña nueva">
        <input type="password" autoComplete="new-password" value={password} onChange={(e) => setPassword(e.target.value)}
          className={inputClass} autoFocus />
      </Field>
      <Field label="Repetila">
        <input type="password" autoComplete="new-password" value={repetida} onChange={(e) => setRepetida(e.target.value)}
          className={inputClass} />
      </Field>
      {error && <Aviso tipo="error">{error}</Aviso>}
      <Button type="submit" disabled={cargando} className="w-full">
        {cargando ? "Guardando…" : "Guardar la contraseña"}
      </Button>
    </form>
  );
};

/**
 * Pantallas: ingresar, elegir ámbito (si el usuario tiene más de un perfil, o desde "Cambiar de ámbito"),
 * olvidé mi contraseña y elegir una nueva (con el token del link de recuperación).
 */
const LoginApp = () => {
  const params = new URLSearchParams(window.location.search);
  const token = params.get("token");
  const [pantalla, setPantalla] = useState(token ? "restablecer" : "cargando");
  const [sesion, setSesion] = useState(null);
  const [aviso, setAviso] = useState(MENSAJES_POR_MOTIVO[params.get("motivo")] || null);

  const entrar = (s) => {
    if (!s.usuario.adminTecnico && !s.ambitoActivo) {
      setSesion(s);
      setPantalla("elegir");
      return;
    }
    window.location.replace(GFAuth.destino(s));
  };

  // Con una sesión abierta no se muestra el formulario: se entra, o se elige el ámbito si lo pidió.
  useEffect(() => {
    if (token) return;
    GFAuth.me().then((r) => {
      if (r.ok && params.get("elegir") && !r.data.usuario.adminTecnico && r.data.perfiles.length > 1) {
        setSesion(r.data);
        setPantalla("elegir");
      } else if (r.ok) {
        entrar(r.data);
      } else {
        if (r.status === 0) setAviso({ tipo: "error", texto: r.data.mensaje });
        setPantalla("ingreso");
      }
    });
  }, []);

  const volverAlIngreso = (nuevoAviso) => {
    setAviso(nuevoAviso || null);
    window.history.replaceState(null, "", "login.html");
    setPantalla("ingreso");
  };

  let contenido;
  if (pantalla === "cargando") contenido = <p className="text-sm text-deep/50 text-center">Cargando…</p>;
  else if (pantalla === "elegir")
    contenido = <ElegirAmbito sesion={sesion} onElegido={(s) => window.location.replace(GFAuth.destino(s))} onSalir={GFAuth.logout} />;
  else if (pantalla === "recuperar") contenido = <Recuperar onVolver={() => volverAlIngreso()} />;
  else if (pantalla === "restablecer")
    contenido = (
      <Restablecer token={token}
        onListo={() => volverAlIngreso({ tipo: "ok", texto: "Listo: ya podés ingresar con tu contraseña nueva." })} />
    );
  else contenido = <FormIngreso aviso={aviso} onSesion={entrar} onOlvide={() => { setAviso(null); setPantalla("recuperar"); }} />;

  return (
    <div className="min-h-screen flex items-center justify-center px-5 py-12 bg-gradient-to-br from-deep via-deep to-medium">
      <div className="w-full max-w-md">
        <div className="flex flex-col items-center mb-8">
          <img src="../assets/logos/logo-blanco-v2.png" alt="Green Fire" className="h-12 w-auto mb-4" />
          <h1 className="font-display font-bold text-xl text-white">Acceso interno</h1>
          <p className="text-sm text-white/60 mt-1">Fábrica y locales</p>
        </div>
        <div className="bg-white rounded-2xl shadow-xl p-7 md:p-8">{contenido}</div>
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<LoginApp />);
</script>
