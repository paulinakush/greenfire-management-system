    <div>
      <SectionBar eyebrowNumber={EYEBROWS["stats-ventas"].n} eyebrow={EYEBROWS["stats-ventas"].label} title="Ventas" description="Ventas presenciales y comprobantes emitidos, combinados." />
      {filas.length === 0 ? <EmptyState text="Todavía no hay ventas registradas." /> : <DataTable columns={columns} rows={filas} getRowId={(f) => f.id} searchPlaceholder="Buscar…" />}
    </div>
  );
};

const EstadisticasPresupuestosTab = ({ session }) => {
  const presupuestos = GFDB.query("comprobantes_venta", (c) => c.sucursal_id === session.sucursalId && c.tipo === "presupuesto");
  const facturas = GFDB.query("comprobantes_venta", (c) => c.sucursal_id === session.sucursalId && c.tipo === "factura");
  const totalPresupuestado = presupuestos.reduce((acc, c) => acc + c.total, 0);

  return (
    <div>
      <SectionBar eyebrowNumber={EYEBROWS["stats-presupuestos"].n} eyebrow={EYEBROWS["stats-presupuestos"].label} title="Presupuestos" />
      <div className="grid sm:grid-cols-3 gap-4">
        <KpiCard icon={<ClipboardIcon />} color="#00AE4C" label="Presupuestos emitidos" value={presupuestos.length} />
        <KpiCard icon={<CheckIcon />} color="#29683D" label="Facturas emitidas" value={facturas.length} />
        <KpiCard icon={<CashIcon />} color="#1A312B" label="Total presupuestado" value={money(totalPresupuestado)} />
      </div>
      <p className="text-xs text-deep/40 mt-4 max-w-md">
        Todavía no se vincula un presupuesto puntual con la factura que lo termina reemplazando — por eso no hay una tasa de conversión, solo los totales de cada uno.
      </p>
    </div>
  );
};

/* ---------------------------------------------------------
   CONFIGURACIONES — Usuarios / Roles / Integraciones (reales);
   Emails/Leyendas/Reportes usan el mismo placeholder que Contabilidad.
--------------------------------------------------------- */
const UsuariosTab = ({ session, bump, showToast }) => {
  const usuarios = GFDB.get("usuarios");
  const roles = GFDB.get("roles");
  const sucursales = GFDB.get("sucursales");
  const [nombre, setNombre] = useState("");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [rolId, setRolId] = useState(roles[0]?.id || "");
  const [sucursalId, setSucursalId] = useState(session.sucursalId || "");
  const [nuevoAbierto, setNuevoAbierto] = useState(false);

  const rolElegido = roles.find((r) => r.id === Number(rolId));
  const esFabrica = rolElegido?.nombre === "administrativo_fabrica";

  const crear = (e) => {
    e.preventDefault();
    if (!nombre.trim() || !email.trim() || !password.trim()) return;
    GFDB.insert("usuarios", { nombre, email, password, rol_id: Number(rolId), sucursal_id: esFabrica ? null : Number(sucursalId), activo: true });
    setNombre("");
    setEmail("");
    setPassword("");
    setNuevoAbierto(false);
    bump();
    showToast("Usuario creado.");
  };

  const columns = [
    { key: "nombre", label: "Nombre", render: (u) => u.nombre },
    { key: "email", label: "Email", render: (u) => u.email },
    { key: "rol", label: "Rol", render: (u) => ROLE_LABELS[GFDB.find("roles", u.rol_id)?.nombre] || "-" },
    { key: "sucursal", label: "Sucursal", render: (u) => GFDB.find("sucursales", u.sucursal_id)?.nombre || "Fábrica" },
    {
      key: "estado",
      label: "Estado",
      render: (u) => <span className={`text-xs font-semibold ${u.activo ? "text-institutional" : "text-deep/40"}`}>{u.activo ? "Activo" : "Inactivo"}</span>,
      csvValue: (u) => (u.activo ? "Activo" : "Inactivo"),
    },
  ];

  const actionsRenderer = (u) => (
    <RowActions
      onDelete={() => {
        GFDB.update("usuarios", u.id, { activo: !u.activo });
        bump();
        showToast(u.activo ? "Usuario desactivado." : "Usuario reactivado.");
      }}
      deleteIcon={PowerIcon}
      deleteLabel={u.activo ? "Desactivar" : "Activar"}
    />
  );

  return (
    <div>
      <SectionBar eyebrowNumber={EYEBROWS["config-usuarios"].n} eyebrow={EYEBROWS["config-usuarios"].label} title="Usuarios" description="Usuarios internos autorizados a acceder al panel." />
      <ListToolbar onNew={() => setNuevoAbierto(true)} newLabel="Nuevo usuario" onExport={() => exportCSV("usuarios.csv", columns, usuarios)} />
      <DataTable columns={columns} rows={usuarios} getRowId={(u) => u.id} actionsRenderer={actionsRenderer} searchPlaceholder="Buscar usuario…" />

      <Modal open={nuevoAbierto} onClose={() => setNuevoAbierto(false)} title="Nuevo usuario">
        <form onSubmit={crear} className="space-y-4">
          <Field label="Nombre">
            <input required value={nombre} onChange={(e) => setNombre(e.target.value)} className={inputClass} />
          </Field>
          <Field label="Email">
            <input type="email" required value={email} onChange={(e) => setEmail(e.target.value)} className={inputClass} />
          </Field>
          <Field label="Contraseña">
            <input type="password" required value={password} onChange={(e) => setPassword(e.target.value)} className={inputClass} />
          </Field>
          <Field label="Rol">
            <select value={rolId} onChange={(e) => setRolId(e.target.value)} className={inputClass}>
              {roles.map((r) => (
                <option key={r.id} value={r.id}>
                  {ROLE_LABELS[r.nombre]}
                </option>
              ))}
            </select>
          </Field>
          {!esFabrica && (
            <Field label="Sucursal">
              <select value={sucursalId} onChange={(e) => setSucursalId(e.target.value)} className={inputClass}>
                {sucursales.map((s) => (
                  <option key={s.id} value={s.id}>
                    {s.nombre}
                  </option>
                ))}
              </select>
            </Field>
          )}
          <Button type="submit">
            <PlusIcon /> Crear usuario
          </Button>
        </form>
      </Modal>
    </div>
  );
};

const RolesTab = () => {
  const roles = GFDB.get("roles");
  return (
    <div>
      <SectionBar eyebrowNumber={EYEBROWS["config-roles"].n} eyebrow={EYEBROWS["config-roles"].label} title="Roles" description="Roles fijos del sistema — no se crean roles nuevos desde acá." />
      <TableWrap>
        <table className="w-full text-sm">
          <thead className="bg-institutional/10 text-deep/70 text-xs uppercase">
            <tr>
              <th className="text-left px-4 py-3">Rol</th>
              <th className="text-left px-4 py-3">Descripción</th>
            </tr>
          </thead>
          <tbody>
            {roles.map((r, i) => (
              <tr key={r.id} className={i % 2 === 1 ? "bg-deep/[0.025]" : ""}>
                <td className="px-4 py-3 border-t border-deep/5 font-medium text-deep">{ROLE_LABELS[r.nombre]}</td>
                <td className="px-4 py-3 border-t border-deep/5 text-deep/50">{r.descripcion}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </TableWrap>
    </div>
  );
};

const IntegracionesTab = ({ session }) => {
  const sucursal = GFDB.find("sucursales", session.sucursalId);
  return (
    <div>
      <SectionBar eyebrowNumber={EYEBROWS["config-integraciones"].n} eyebrow={EYEBROWS["config-integraciones"].label} title="Integraciones" />
      <Card className="p-6 max-w-lg">
        <div className="flex items-center gap-3 mb-4">
          <span className="w-11 h-11 rounded-full bg-amber-100 text-amber-700 flex items-center justify-center">
            <PlugIcon className="w-5 h-5" />
          </span>
          <div>
            <p className="font-semibold text-deep">Conexión ARCA</p>
            <span className="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-semibold bg-amber-100 text-amber-700">Pendiente de integración</span>
          </div>
        </div>
        <p className="text-sm text-deep/60 mb-1">
          CUIT de esta sucursal: <span className="font-medium text-deep">{sucursal.cuit}</span>
        </p>
        <p className="text-xs text-deep/45 mt-3">
          Cada sucursal tiene su propia conexión ARCA con su propio CUIT — nunca se comparte ni se consolida con otra sucursal ni con fábrica. La numeración y el circuito de facturas ya están construidos; falta conectar la API real de ARCA para autorizar comprobantes (CAE) automáticamente.
        </p>
      </Card>
    </div>
  );
};

/* ---------------------------------------------------------
   APP
--------------------------------------------------------- */
const SucursalApp = () => {
  const [session] = useState(() => GFAuth.requireRole(["empleado_sucursal", "responsable_sucursal"]));
  const [tab, setTab] = useState(() => (session?.rolNombre === "empleado_sucursal" ? "ventas" : "dashboard"));
  const [tick, setTick] = useState(0);
  const [toast, setToast] = useState(null);

  const bump = () => setTick((t) => t + 1);
  const showToast = (message, kind = "success") => {
    setToast({ message, kind });
    setTimeout(() => setToast(null), 3000);
  };

  if (!session) return null;

  const modules = modulosParaRol(session.rolNombre);
  const quickAccess = quickAccessParaRol(session.rolNombre);
  const notifCount = GFDB.query("pedidos", (p) => p.sucursal_id === session.sucursalId && p.estado === "pendiente").length;

  let content;
  let esProximamente = false;
  if (tab === "dashboard") content = <DashboardSucursalTab session={session} onNavigate={setTab} />;
  else if (tab === "stock") content = <StockTab session={session} />;
  else if (tab === "ingreso") content = <IngresoTab session={session} bump={bump} showToast={showToast} />;
  else if (tab === "pedidos") content = <PedidosTab session={session} bump={bump} showToast={showToast} />;
  else if (tab === "ventas") content = <NuevaVentaTab showToast={showToast} onNavigate={setTab} />;
  else if (tab === "ventas-dia") content = <VentasDelDiaTab showToast={showToast} />;
  else if (tab === "caja") content = <CajaApiTab showToast={showToast} />;
  else if (tab === "ajuste" && session.rolNombre === "responsable_sucursal") content = <AjusteTab session={session} bump={bump} showToast={showToast} />;
  else if (tab === "catalogo" && session.rolNombre === "responsable_sucursal") content = <CatalogoTab session={session} bump={bump} showToast={showToast} />;
  else if (tab === "catalogo-consulta") content = <CatalogoConsultaTab session={session} />;
  else if (tab === "transferencias") content = <TransferenciasTab session={session} bump={bump} showToast={showToast} />;
  else if (tab === "venta-facturas" && session.rolNombre === "responsable_sucursal")
    content = <ComprobanteScreen tipo="factura" tabKey="venta-facturas" session={session} bump={bump} showToast={showToast} />;
  else if (tab === "venta-presupuestos" && session.rolNombre === "responsable_sucursal")
    content = <ComprobanteScreen tipo="presupuesto" tabKey="venta-presupuestos" session={session} bump={bump} showToast={showToast} />;
  else if (tab === "venta-recibos" && session.rolNombre === "responsable_sucursal")
    content = <ComprobanteScreen tipo="recibo" tabKey="venta-recibos" session={session} bump={bump} showToast={showToast} />;
  else if (tab === "venta-remitos" && session.rolNombre === "responsable_sucursal")
    content = <ComprobanteScreen tipo="remito" tabKey="venta-remitos" session={session} bump={bump} showToast={showToast} />;
  else if (tab === "venta-recibos-app") content = <ComprobanteScreen tipo="recibo" tabKey="venta-recibos-app" session={session} bump={bump} showToast={showToast} soloLectura />;
  else if (tab === "cobranzas" && session.rolNombre === "responsable_sucursal") content = <CobranzasTab session={session} bump={bump} showToast={showToast} />;
  else if (tab === "listas-precios" && session.rolNombre === "responsable_sucursal") content = <ListasPreciosTab bump={bump} showToast={showToast} />;
  else if (tab === "categorias" && session.rolNombre === "responsable_sucursal") content = <CategoriasTab bump={bump} showToast={showToast} />;
  else if (tab === "marcas" && session.rolNombre === "responsable_sucursal") content = <MarcasTab bump={bump} showToast={showToast} />;
  else if (tab === "grupos" && session.rolNombre === "responsable_sucursal") content = <GruposTab bump={bump} showToast={showToast} />;
  else if (tab === "variantes" && session.rolNombre === "responsable_sucursal") content = <VariantesTab bump={bump} showToast={showToast} />;
  else if (tab === "depositos" && session.rolNombre === "responsable_sucursal") content = <DepositosTab session={session} bump={bump} showToast={showToast} />;
  else if (tab === "clientes") content = <ClientesTab bump={bump} showToast={showToast} />;
  else if (tab === "stats-clientes" && session.rolNombre === "responsable_sucursal") content = <EstadisticasClientesTab session={session} />;
  else if (tab === "stats-productos" && session.rolNombre === "responsable_sucursal") content = <EstadisticasProductosTab session={session} />;
  else if (tab === "stats-ventas" && session.rolNombre === "responsable_sucursal") content = <EstadisticasVentasTab session={session} />;
  else if (tab === "stats-presupuestos" && session.rolNombre === "responsable_sucursal") content = <EstadisticasPresupuestosTab session={session} />;
  else if (tab === "config-usuarios" && session.rolNombre === "responsable_sucursal") content = <UsuariosTab session={session} bump={bump} showToast={showToast} />;
  else if (tab === "config-roles" && session.rolNombre === "responsable_sucursal") content = <RolesTab />;
  else if (tab === "config-integraciones" && session.rolNombre === "responsable_sucursal") content = <IntegracionesTab session={session} />;
  else if (session.rolNombre === "responsable_sucursal" && CAJA_PLACEHOLDER_ITEMS.some((it) => it.key === tab)) {
    const it = CAJA_PLACEHOLDER_ITEMS.find((i) => i.key === tab);
    esProximamente = true;
    content = (
      <ProximamenteTab
        eyebrowNumber={EYEBROWS[tab].n}
        eyebrow={EYEBROWS[tab].label}
        titulo={it.label}
        descripcion="Todavía no está construido — queda planificado para la etapa de Caja ampliada del roadmap."
      />
    );
  } else if (session.rolNombre === "responsable_sucursal" && CONTABILIDAD_ITEMS.some((it) => it.key === tab)) {
    const it = CONTABILIDAD_ITEMS.find((i) => i.key === tab);
    esProximamente = true;
    content = (
      <ProximamenteTab
        eyebrowNumber={EYEBROWS[tab].n}
        eyebrow={EYEBROWS[tab].label}
        titulo={it.label}
        descripcion={`Bajo el CUIT propio de esta sucursal (${GFDB.find("sucursales", session.sucursalId)?.cuit}) — nunca consolidado con otra sucursal ni fábrica. Motor contable planificado para una etapa siguiente del roadmap.`}
      />
    );
  } else if (session.rolNombre === "responsable_sucursal" && ["config-emails", "config-leyendas", "config-reportes"].includes(tab)) {
    const it = CONFIG_ITEMS.find((i) => i.key === tab);
    esProximamente = true;
    content = <ProximamenteTab eyebrowNumber={EYEBROWS[tab].n} eyebrow={EYEBROWS[tab].label} titulo={it.label} />;
  } else if (session.rolNombre === "empleado_sucursal") content = <ClientesTab bump={bump} showToast={showToast} />;
  else content = <DashboardSucursalTab session={session} onNavigate={setTab} />;

  return (
    <PrivateShell
      session={session}
      modules={modules}
      quickAccess={quickAccess}
      activeKey={tab}
      onNavigate={setTab}
      notifCount={notifCount}
      notifTitle="Pedidos pendientes (datos de prueba)"
      onLogout={GFAuth.logout}
    >
      {!PANTALLAS_CONECTADAS.includes(tab) && !esProximamente && <AvisoDatosDePrueba />}
      {content}
      <Toast message={toast?.message} kind={toast?.kind} onClose={() => setToast(null)} />
    </PrivateShell>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<SucursalApp />);
</script>

<script>
  // Primero se valida la sesión contra la API (shared/auth.js); sin sesión, al login.
  GFAuth.arrancar(["dueno_local", "empleado_local"], function (sesion) {
    // La sesión real (perfil y ámbito) la usan las pantallas conectadas a la API.
    window.GF_SESION_REAL = sesion;
    var barra = document.getElementById("gf-barra-sesion");
    var medirBarra = function () {
      document.documentElement.style.setProperty("--gf-barra", (barra ? barra.offsetHeight : 0) + "px");
    };
    medirBarra();
    if (barra && window.ResizeObserver) new ResizeObserver(medirBarra).observe(barra);
    var source = document.getElementById("app-source").textContent;
    try {
      var output = Babel.transform(source, {
        presets: [["react", { runtime: "classic" }]],
        filename: "app.jsx",
      }).code;
      (0, eval)(output);
    } catch (err) {
      var root = document.getElementById("root");
      root.innerHTML =
        '<pre style="white-space:pre-wrap;padding:24px;color:#b91c1c;font-family:monospace;">' +
        "Error al inicializar el prototipo:\n\n" +
        String(err && err.stack ? err.stack : err) +
        "</pre>";
      console.error(err);
    }
  });
</script>
</body>
