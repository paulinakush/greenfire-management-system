const fmtDate = (iso) => {
  if (!iso) return "-";
  // Fechas "solo fecha" (YYYY-MM-DD) se arman en horario local: new Date(iso)
  // las interpreta como medianoche UTC y en husos negativos (AR) muestran el
  // día anterior.
  const soloFecha = /^\d{4}-\d{2}-\d{2}$/.test(iso);
  const d = soloFecha ? new Date(`${iso}T00:00:00`) : new Date(iso);
  return d.toLocaleDateString("es-AR");
};

const fmtDateTime = (iso) => {
  if (!iso) return "-";
  const d = new Date(iso);
  return `${d.toLocaleDateString("es-AR")} ${d.toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" })}`;
};

const enumLabel = (enumName, value) => {
  const item = (window.GF_ENUMS[enumName] || []).find((e) => e.value === value);
  return item ? item.label : value;
};

const exportCSV = (filename, columns, rows) => {
  const esc = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const header = columns.map((c) => esc(c.label)).join(",");
  const lines = rows.map((r) => columns.map((c) => esc(c.csvValue ? c.csvValue(r) : c.searchValue ? c.searchValue(r) : r[c.key])).join(","));
  const csv = [header, ...lines].join("\n");
  const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
};

const Sidebar = ({ modules, activeKey, onNavigate, mobileOpen, onCloseMobile }) => {
  const parentOfActive = modules.find((m) => m.children && m.children.some((c) => c.key === activeKey));
  const [openKey, setOpenKey] = useState(parentOfActive ? parentOfActive.key : null);

  const navigate = (key) => {
    onNavigate(key);
    onCloseMobile();
  };

  return (
    <>
      {mobileOpen && <div className="fixed inset-0 bg-deep/60 z-20 md:hidden" onClick={onCloseMobile} />}
      <aside
        className={`fixed top-16 left-0 bottom-0 w-64 bg-deep border-r border-white/5 overflow-y-auto py-4 z-30 transition-transform duration-200 md:translate-x-0 ${
          mobileOpen ? "translate-x-0" : "-translate-x-full"
        }`}
      >
        <nav className="px-3 space-y-1">
          {modules.map((m) => {
          if (m.children) {
            const isOpen = openKey === m.key;
            const childActive = m.children.some((c) => c.key === activeKey);
            return (
              <div key={m.key}>
                <button
                  onClick={() => setOpenKey(isOpen ? null : m.key)}
                  className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-colors ${
                    childActive ? "text-institutional" : "text-white/70 hover:text-white hover:bg-white/5"
                  }`}
                >
                  {m.icon}
                  <span className="flex-1 text-left">{m.label}</span>
                  <ChevronDownIcon className={`w-4 h-4 transition-transform ${isOpen ? "rotate-180" : ""}`} />
                </button>
                {isOpen && (
                  <div className="mt-1 ml-4 pl-4 border-l border-white/10 space-y-0.5">
                    {m.children.map((c) => {
                      const active = activeKey === c.key;
                      return (
                        <button
                          key={c.key}
                          onClick={() => navigate(c.key)}
                          className={`relative w-full flex items-center gap-2 pl-3 pr-2 py-2 rounded-lg text-sm text-left ${
                            active ? "bg-institutional/15 text-institutional font-semibold" : "text-white/60 hover:text-white hover:bg-white/5"
                          }`}
                        >
                          {active && <span className="absolute left-0 top-0 bottom-0 w-1 rounded-full bg-institutional" />}
                          <span className="w-1.5 h-1.5 rounded-full bg-current opacity-60 shrink-0" />
                          {c.label}
                        </button>
                      );
                    })}
                  </div>
                )}
              </div>
            );
          }
          const active = activeKey === m.key;
          return (
            <button
              key={m.key}
              onClick={() => navigate(m.key)}
              className={`relative w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-colors ${
                active ? "bg-institutional/15 text-institutional font-semibold" : "text-white/70 hover:text-white hover:bg-white/5"
              }`}
            >
              {active && <span className="absolute left-0 top-1.5 bottom-1.5 w-1 rounded-full bg-institutional" />}
              {m.icon}
              {m.label}
            </button>
          );
          })}
        </nav>
      </aside>
    </>
  );
};

const CHART_RANGES = [
  { key: "semana", label: "Última Semana" },

const SalesChart = ({ data, range, onRangeChange }) => {
  const [hover, setHover] = useState(null);
  const max = Math.max(1, ...data.map((d) => d.value));
  const w = 640,
    h = 220,
    padTop = 16,
    padBottom = 28,
    padSide = 8,
    barGap = 10;
  const barW = data.length ? (w - padSide * 2 - barGap * (data.length - 1)) / data.length : 0;
  const hasData = data.some((d) => d.value > 0);

  return (
    <Card className="p-6">
      <div className="flex flex-wrap items-center justify-between gap-4 mb-5">
        <h3 className="font-display font-bold text-base text-deep">Ventas por período</h3>
        <div className="flex items-center gap-1 bg-deep/5 rounded-full p-1">
          {CHART_RANGES.map((r) => (
            <button
              key={r.key}
              onClick={() => onRangeChange(r.key)}
              className={`px-3 py-1.5 rounded-full text-xs font-semibold transition-colors ${
                range === r.key ? "bg-institutional text-white" : "text-deep/60 hover:text-deep"
              }`}
            >
              {r.label}
            </button>
          ))}
        </div>
      </div>

      {!hasData ? (
        <EmptyState text="Todavía no hay ventas ni pedidos confirmados en este período." />
      ) : (
        <div className="relative">
          <svg viewBox={`0 0 ${w} ${h}`} className="w-full h-52" preserveAspectRatio="none">
            {data.map((d, i) => {
              const barH = Math.max(2, ((h - padTop - padBottom) * d.value) / max);
              const x = padSide + i * (barW + barGap);
              const y = h - padBottom - barH;
              return (
                <g key={i} onMouseEnter={() => setHover(i)} onMouseLeave={() => setHover((v) => (v === i ? null : v))}>
                  <rect x={x} y={padTop} width={barW} height={h - padTop - padBottom} fill="transparent" />
                  <rect x={x} y={y} width={barW} height={barH} rx={4} fill={hover === i ? "#29683D" : "#00AE4C"} />
                  <text x={x + barW / 2} y={h - 8} textAnchor="middle" fontSize="9" fill="#1A312B" opacity="0.45">
                    {d.label}
                  </text>
                </g>
              );
            })}
          </svg>
          {hover !== null && data[hover] && (
            <div
              className="absolute -translate-x-1/2 -translate-y-full bg-deep text-white text-xs rounded-lg px-2.5 py-1.5 pointer-events-none whitespace-nowrap"
              style={{
                left: `${((padSide + hover * (barW + barGap) + barW / 2) / w) * 100}%`,
                top: `${((h - padBottom - Math.max(2, ((h - padTop - padBottom) * data[hover].value) / max)) / h) * 100}%`,
              }}
            >
              {money(data[hover].value)}
            </div>
          )}
        </div>
      )}
    </Card>
  );
};

const DataTable = ({ columns, rows, getRowId, actionsRenderer, searchPlaceholder = "Buscar…", pageSizeOptions = [10, 25, 50] }) => {
  const [query, setQuery] = useState("");
  const [visibleCols, setVisibleCols] = useState(() => new Set(columns.filter((c) => c.defaultVisible !== false).map((c) => c.key)));
  const [colsMenuOpen, setColsMenuOpen] = useState(false);
  const [pageSize, setPageSize] = useState(pageSizeOptions[0]);
  const [page, setPage] = useState(1);

  const q = query.trim().toLowerCase();
  const filtered = q
    ? rows.filter((r) => columns.some((c) => String((c.searchValue ? c.searchValue(r) : r[c.key]) ?? "").toLowerCase().includes(q)))
    : rows;

  const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
  const safePage = Math.min(page, totalPages);
  const start = (safePage - 1) * pageSize;
  const pageRows = filtered.slice(start, start + pageSize);
  const visibleColumns = columns.filter((c) => visibleCols.has(c.key));

  const toggleCol = (key) => {
    setVisibleCols((prev) => {
      const next = new Set(prev);
      if (next.has(key)) next.delete(key);
      else next.add(key);
      return next;
    });
  };

  return (
    <div>
      <div className="flex flex-wrap items-center gap-2 mb-3">
        <div className="relative flex-1 min-w-[200px] max-w-xs">
          <SearchIcon className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-deep/35" />
          <input
            value={query}
            onChange={(e) => {
              setQuery(e.target.value);
              setPage(1);
            }}
            placeholder={searchPlaceholder}
            className={`${inputClass} pl-9`}
          />
        </div>
        <div className="flex-1" />
        <div className="relative">
          <Button variant="secondary" onClick={() => setColsMenuOpen((v) => !v)}>
            <ColumnsIcon /> Columnas
          </Button>
          {colsMenuOpen && (
            <div
              className="absolute right-0 top-11 w-56 bg-white rounded-xl shadow-xl border border-deep/8 py-2 z-30"
              onMouseLeave={() => setColsMenuOpen(false)}
            >
              {columns.map((c) => (
                <label key={c.key} className="flex items-center gap-2 px-3.5 py-1.5 text-sm text-deep/80 cursor-pointer">
                  <input type="checkbox" checked={visibleCols.has(c.key)} onChange={() => toggleCol(c.key)} />
                  {c.label}
                </label>
              ))}
            </div>
          )}
        </div>
        <select
          value={pageSize}
          onChange={(e) => {
            setPageSize(Number(e.target.value));
            setPage(1);
          }}
          className={`${inputClass} w-auto`}
        >
          {pageSizeOptions.map((n) => (
            <option key={n} value={n}>
              {n} por página
            </option>
          ))}
        </select>
      </div>

      {filtered.length === 0 ? (
        <EmptyState text="No se encontraron resultados." />
      ) : (
        <>
          <TableWrap>
            <table className="w-full text-sm">
              <thead className="bg-institutional/10 text-deep/70 text-xs uppercase">
                <tr>
                  {visibleColumns.map((c) => (
                    <th key={c.key} className="text-left px-4 py-3 font-semibold whitespace-nowrap">
                      {c.label}
                    </th>
                  ))}
                  {actionsRenderer && <th className="px-4 py-3"></th>}
                </tr>
              </thead>
              <tbody>
                {pageRows.map((row, i) => (
                  <tr key={getRowId(row)} className={i % 2 === 1 ? "bg-deep/[0.025]" : ""}>
                    {visibleColumns.map((c) => (
                      <td key={c.key} className="px-4 py-3 border-t border-deep/5">
                        {c.render ? c.render(row) : row[c.key]}
                      </td>
                    ))}
                    {actionsRenderer && <td className="px-4 py-3 border-t border-deep/5">{actionsRenderer(row)}</td>}
                  </tr>
                ))}
              </tbody>
            </table>
          </TableWrap>

          <div className="flex flex-wrap items-center justify-between gap-3 mt-3 text-sm text-deep/55">
            <p>
              {start + 1}-{Math.min(start + pageSize, filtered.length)} de {filtered.length}
            </p>
            <div className="flex items-center gap-1">
              <button
                disabled={safePage <= 1}
                onClick={() => setPage((p) => Math.max(1, p - 1))}
                className="px-2.5 py-1.5 rounded-lg border border-deep/10 disabled:opacity-30"
              >
                ‹
              </button>
              <span className="px-2">
                {safePage} / {totalPages}
              </span>
              <button
                disabled={safePage >= totalPages}
                onClick={() => setPage((p) => Math.min(totalPages, p + 1))}
                className="px-2.5 py-1.5 rounded-lg border border-deep/10 disabled:opacity-30"
              >
                ›
              </button>
            </div>
          </div>
        </>
      )}
    </div>
  );
};

const ESTADOS_CONTABLES = ["confirmado", "en_preparacion", "listo_retiro", "pendiente_envio", "finalizado"];

const buildRangeBuckets = (range) => {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const buckets = [];
  if (range === "semana") {
    for (let i = 6; i >= 0; i--) {
      const start = new Date(today);
      start.setDate(start.getDate() - i);
      const end = new Date(start);
      end.setDate(end.getDate() + 1);
      buckets.push({ start, end, label: start.toLocaleDateString("es-AR", { day: "2-digit", month: "2-digit" }) });
    }
  } else if (range === "mes") {
    for (let i = 3; i >= 0; i--) {
      const end = new Date(today);
      end.setDate(end.getDate() - i * 7);
      const start = new Date(end);
      start.setDate(start.getDate() - 7);
      buckets.push({ start, end, label: start.toLocaleDateString("es-AR", { day: "2-digit", month: "2-digit" }) });
    }
  } else {
    for (let i = 5; i >= 0; i--) {
      const start = new Date(today.getFullYear(), today.getMonth() - i, 1);
      const end = new Date(today.getFullYear(), today.getMonth() - i + 1, 1);
      buckets.push({ start, end, label: start.toLocaleDateString("es-AR", { month: "short" }) });
    }
  }
  return buckets;
};

const useSalesChartData = (sucursalId) => {
  const [range, setRange] = useState("semana");
  const buckets = buildRangeBuckets(range);
  const ventas = GFDB.query("ventas", (v) => v.sucursal_id === sucursalId);
  const pedidos = GFDB.query("pedidos", (p) => p.sucursal_id === sucursalId && ESTADOS_CONTABLES.includes(p.estado));
  const data = buckets.map((b) => {
    const totalVentas = ventas
      .filter((v) => {
        const d = new Date(v.fecha_hora);
        return d >= b.start && d < b.end;
      })
      .reduce((acc, v) => acc + v.total, 0);
    const totalPedidos = pedidos
      .filter((p) => {
        const d = new Date(p.fecha);
        return d >= b.start && d < b.end;
      })
      .reduce((acc, p) => acc + p.total, 0);
    return { label: b.label, value: totalVentas + totalPedidos };
  });
  return { range, setRange, data };
};

      .filter((l) => l.productoId && Number(l.cantidad) > 0)
      .map((l) => ({ productoId: Number(l.productoId), cantidad: Number(l.cantidad), precioUnitario: Number(l.precio) }));
    if (!clienteId || items.length === 0) return;
    GFDB.crearPedidoManual({ sucursalId: session.sucursalId, clienteId: Number(clienteId), usuarioId: session.usuarioId, modalidad, items, observaciones });
    bump();
    showToast("Pedido cargado como pendiente de confirmar.");
    onClose();
  };

  return (
    <Modal open={true} onClose={onClose} title="Nuevo pedido" wide>
      <form onSubmit={handleSubmit} className="space-y-4">
        <div className="grid sm:grid-cols-2 gap-4">

            <select value={clienteId} onChange={(e) => setClienteId(e.target.value)} className={inputClass}>

                  {c.nombre}
                </option>
              ))}
            </select>
          </Field>
          <Field label="Modalidad de entrega">
            <select value={modalidad} onChange={(e) => setModalidad(e.target.value)} className={inputClass}>
              {window.GF_ENUMS.modalidad_entrega.map((m) => (
                <option key={m.value} value={m.value}>
                  {m.label}
                </option>
              ))}
            </select>
          </Field>
        </div>

        <div className="space-y-3">
          {lineas.map((l, idx) => (
            <div key={idx} className="grid grid-cols-1 sm:grid-cols-[1fr_100px_140px_auto] gap-3 items-end">
              <Field label="Producto">
                <select
                  value={l.productoId}
                  onChange={(e) => {
                    const p = GFDB.find("productos", Number(e.target.value));
                    setLinea(idx, { productoId: e.target.value, precio: p ? p.precio : 0 });
                  }}
                  className={inputClass}
                >
                  {productos.map((p) => (
                    <option key={p.id} value={p.id}>
                      {p.nombre}
                    </option>
                  ))}
                </select>
              </Field>
              <Field label="Cantidad">
                <input type="number" min="1" value={l.cantidad} onChange={(e) => setLinea(idx, { cantidad: e.target.value })} className={inputClass} />
              </Field>
              <Field label="Precio unit.">
                <input type="number" min="0" value={l.precio} onChange={(e) => setLinea(idx, { precio: e.target.value })} className={inputClass} />
              </Field>
              {lineas.length > 1 && (
                <Button type="button" variant="ghost" onClick={() => removeLinea(idx)}>
                  Quitar
                </Button>
              )}
            </div>
          ))}
        </div>
        <Button type="button" variant="secondary" onClick={addLinea}>
          <PlusIcon /> Agregar producto
        </Button>

        <div className="flex items-center justify-between pt-2 border-t border-deep/8">
          <p className="text-2xl font-display font-bold text-deep">{money(total)}</p>
        </div>

        <Field label="Observaciones">
          <textarea value={observaciones} onChange={(e) => setObservaciones(e.target.value)} rows={2} className={inputClass} />
        </Field>
        <Button type="submit">Cargar pedido</Button>
      </form>
    </Modal>
  );
};

const PedidosTab = ({ session, bump, showToast }) => {
  const [filtroEstado, setFiltroEstado] = useState("todos");
  const [filtroModalidad, setFiltroModalidad] = useState("todas");
  const [filtroFecha, setFiltroFecha] = useState("todas");
  const [seleccionado, setSeleccionado] = useState(null);
  const [nuevoAbierto, setNuevoAbierto] = useState(false);

  const dentroDeRangoFecha = (fechaISO) => {
    if (filtroFecha === "todas") return true;
    const dias = filtroFecha === "hoy" ? 1 : filtroFecha === "7d" ? 7 : 30;
    const limite = new Date();
    limite.setDate(limite.getDate() - dias);
    return new Date(fechaISO) >= limite;
  };

  const pedidos = GFDB.query("pedidos", (p) => p.sucursal_id === session.sucursalId)
    .filter((p) => filtroEstado === "todos" || p.estado === filtroEstado)
    .filter((p) => filtroModalidad === "todas" || p.modalidad === filtroModalidad)
    .filter((p) => dentroDeRangoFecha(p.fecha))
    .sort((a, b) => new Date(b.fecha) - new Date(a.fecha));

  const pedidoActivo = seleccionado ? GFDB.find("pedidos", seleccionado) : null;

  const columns = [
    { key: "id", label: "Pedido", render: (p) => `#${p.id}` },
    {
      key: "cliente",
      label: "Cliente",
      render: (p) => GFDB.find("clientes", p.cliente_id).nombre,
      searchValue: (p) => GFDB.find("clientes", p.cliente_id).nombre,
    },
    { key: "fecha", label: "Fecha", render: (p) => fmtDate(p.fecha) },
    { key: "modalidad", label: "Modalidad", render: (p) => enumLabel("modalidad_entrega", p.modalidad) },
    { key: "total", label: "Total", render: (p) => money(p.total) },
    { key: "estado", label: "Estado", render: (p) => <StatusPill estado={p.estado} />, csvValue: (p) => enumLabel("estado_pedido", p.estado) },
    { key: "pago", label: "Pago", render: (p) => <PagoPill habilitado={p.pago_habilitado} />, csvValue: (p) => (p.pago_habilitado ? "Habilitado" : "No habilitado") },
  ];

  const actionsRenderer = (p) => {
    const proximos = GFDB.proximosEstadosPedido(p.estado);
    const extra = proximos.map((estado) => ({
      icon: <CheckIcon className="w-4 h-4" />,
      label: `Marcar como "${enumLabel("estado_pedido", estado)}"`,
      onClick: () => {
        GFDB.avanzarEstadoPedido(p.id, estado, session.usuarioId);
        bump();
        showToast(`Pedido #${p.id} actualizado a "${enumLabel("estado_pedido", estado)}".`);
      },
    }));
    return (
      <div className="flex items-center justify-end gap-2">
        {p.estado === "pendiente" && (
          <>
            <MiniButton
              onClick={() => {
                GFDB.confirmarPedido(p.id, session.usuarioId);
                bump();
                showToast("Pedido confirmado. El pago ya está habilitado para el cliente.");
              }}
            >
              Confirmar
            </MiniButton>
            <MiniButton
              variant="danger"
              onClick={() => {
                GFDB.rechazarPedido(p.id, session.usuarioId);
                bump();
                showToast("Pedido rechazado.", "error");
              }}
            >
              Rechazar
            </MiniButton>
          </>
        )}
        <RowActions onView={() => setSeleccionado(p.id)} extra={extra} />
      </div>
    );
  };

  return (
    <div>
      <SectionBar
        eyebrowNumber={EYEBROWS.pedidos.n}
        eyebrow={EYEBROWS.pedidos.label}
        title="Pedidos"
        description="Confirmar un pedido habilita recién ahí el pago para el cliente."
      />
      <ListToolbar onNew={() => setNuevoAbierto(true)} newLabel="Nuevo pedido" onExport={() => exportCSV("pedidos.csv", columns, pedidos)} onPrint={() => window.print()} />
      <FiltersBar
        filters={[
          { label: "Estado", value: filtroEstado, onChange: setFiltroEstado, options: ESTADOS_FILTRO },
          { label: "Modalidad de entrega", value: filtroModalidad, onChange: setFiltroModalidad, options: MODALIDADES_FILTRO },
          { label: "Fecha", value: filtroFecha, onChange: setFiltroFecha, options: FECHA_FILTROS },
        ]}
      />
      <DataTable columns={columns} rows={pedidos} getRowId={(p) => p.id} actionsRenderer={actionsRenderer} searchPlaceholder="Buscar cliente…" />

      {pedidoActivo && (
        <PedidoDetalleModal pedido={pedidoActivo} onClose={() => setSeleccionado(null)} session={session} bump={bump} showToast={showToast} />
      )}
      {nuevoAbierto && <NuevoPedidoModal session={session} onClose={() => setNuevoAbierto(false)} bump={bump} showToast={showToast} />}
    </div>
  );
};

const VentasTab = ({ session, bump, showToast }) => {
  const productos = GFDB.get("productos");

  const [medioFiltro, setMedioFiltro] = useState("todos");

  const setLinea = (idx, patch) => setLineas((prev) => prev.map((l, i) => (i === idx ? { ...l, ...patch } : l)));
  const addLinea = () => setLineas((prev) => [...prev, { productoId: productos[0]?.id || "", cantidad: 1, precio: productos[0]?.precio || 0 }]);
  const removeLinea = (idx) => setLineas((prev) => prev.filter((_, i) => i !== idx));

  const total = lineas.reduce((acc, l) => acc + Number(l.cantidad || 0) * Number(l.precio || 0), 0);

  const handleSubmit = (e) => {
    e.preventDefault();
    const items = lineas
      .filter((l) => l.productoId && Number(l.cantidad) > 0)
      .map((l) => ({ productoId: Number(l.productoId), cantidad: Number(l.cantidad), precioUnitario: Number(l.precio) }));
    if (items.length === 0) return;
    GFDB.registrarVentaPresencial({ sucursalId: session.sucursalId, usuarioId: session.usuarioId, items, medioPago });
    setLineas([{ productoId: productos[0]?.id || "", cantidad: 1, precio: productos[0]?.precio || 0 }]);
    setMedioPago("efectivo");
    bump();
    showToast("Venta registrada y stock actualizado.");

  const ventas = GFDB.query("ventas", (v) => v.sucursal_id === session.sucursalId)
    .filter((v) => medioFiltro === "todos" || v.medio_pago === medioFiltro)
    .sort((a, b) => new Date(b.fecha_hora) - new Date(a.fecha_hora));

    { key: "fecha", label: "Fecha", render: (v) => fmtDateTime(v.fecha_hora) },
    {
      key: "usuario",
      label: "Usuario",
      render: (v) => GFDB.find("usuarios", v.usuario_id)?.nombre || "-",
      searchValue: (v) => GFDB.find("usuarios", v.usuario_id)?.nombre || "",
    },
    { key: "medio", label: "Medio de pago", render: (v) => enumLabel("medio_pago", v.medio_pago) },
    { key: "total", label: "Total", render: (v) => money(v.total) },
  ];

  return (
    <div>
      <SectionBar eyebrowNumber={EYEBROWS.ventas.n} eyebrow={EYEBROWS.ventas.label} title="Ventas presenciales" description="Actualiza el stock de la sucursal automáticamente." />
      <Card className="p-6 mb-8">
        <form onSubmit={handleSubmit} className="space-y-4">
          <div className="space-y-3">
            {lineas.map((l, idx) => (
              <div key={idx} className="grid grid-cols-1 sm:grid-cols-[1fr_100px_140px_auto] gap-3 items-end">
                <Field label="Producto">
                  <select
                    value={l.productoId}
                    onChange={(e) => {
                      const p = GFDB.find("productos", Number(e.target.value));
                      setLinea(idx, { productoId: e.target.value, precio: p ? p.precio : 0 });
                    }}
                    className={inputClass}
                  >
                    {productos.map((p) => (
                      <option key={p.id} value={p.id}>
                        {p.nombre}
                      </option>
                    ))}
                  </select>
                </Field>
                <Field label="Cantidad">
                  <input type="number" min="1" value={l.cantidad} onChange={(e) => setLinea(idx, { cantidad: e.target.value })} className={inputClass} />
                </Field>
                <Field label="Precio unit.">
                  <input type="number" min="0" value={l.precio} onChange={(e) => setLinea(idx, { precio: e.target.value })} className={inputClass} />
                </Field>
                {lineas.length > 1 && (
                  <Button type="button" variant="ghost" onClick={() => removeLinea(idx)}>
                    Quitar
                  </Button>
                )}
              </div>
            ))}
          </div>
          <Button type="button" variant="secondary" onClick={addLinea}>
            <PlusIcon /> Agregar producto
          </Button>

          <div className="grid sm:grid-cols-2 gap-4 pt-2 border-t border-deep/8">
            <Field label="Medio de pago">
              <select value={medioPago} onChange={(e) => setMedioPago(e.target.value)} className={inputClass}>
                {window.GF_ENUMS.medio_pago.map((m) => (
                  <option key={m.value} value={m.value}>
                    {m.label}
                  </option>
                ))}
              </select>
            </Field>
            <div className="flex flex-col justify-end">
              <p className="text-xs font-semibold uppercase tracking-wide text-deep/50 mb-1.5">Total</p>

        filters={[
          {

            value: medioFiltro,
            onChange: setMedioFiltro,

    setMotivo("");
    bump();
    showToast("Ajuste de stock registrado.");

  return (
    <div>

/* ---------------------------------------------------------
   CATÁLOGO (responsable)
--------------------------------------------------------- */
const CatalogoTab = ({ session, bump, showToast }) => {
  const ubicacion = GFDB.ubicacionDeSucursal(session.sucursalId);
  const productos = GFDB.get("productos");
  const categorias = GFDB.get("categorias");
  const [nombreNuevo, setNombreNuevo] = useState("");
  const [categoriaNueva, setCategoriaNueva] = useState(categorias[0]?.id || "");
  const [precioNuevo, setPrecioNuevo] = useState("");

  const asociar = (productoId) => {
    GFDB.insert("stock_productos", { producto_id: productoId, ubicacion_stock_id: ubicacion.id, cantidad_actual: 0, stock_minimo: 0, stock_maximo: 0 });
    bump();
    showToast("Producto asociado a la sucursal.");
  };

  const guardarProducto = (producto, patch) => {
    GFDB.update("productos", producto.id, patch);
    bump();
    showToast("Catálogo actualizado.");
  };

  const crearProducto = (e) => {
    e.preventDefault();
    if (!nombreNuevo.trim() || !precioNuevo) return;
    const nuevo = GFDB.insert("productos", {
      nombre: nombreNuevo,
      descripcion: "",
      precio: Number(precioNuevo),
      imagen: "",
      categoria_id: Number(categoriaNueva),
      marca_id: null,
      grupo_id: null,
      es_fabricacion_propia: false,
      visible: true,
    });
    GFDB.insert("stock_productos", { producto_id: nuevo.id, ubicacion_stock_id: ubicacion.id, cantidad_actual: 0, stock_minimo: 0, stock_maximo: 0 });
    setNombreNuevo("");
    setPrecioNuevo("");
    bump();
    showToast("Producto creado y asociado a esta sucursal.");
  };

  return (
    <div>
      <SectionBar
        eyebrowNumber={EYEBROWS.catalogo.n}
        eyebrow={EYEBROWS.catalogo.label}
        title="Lista de productos"
        description="El precio y la descripción son del catálogo general de Green Fire; la visibilidad, el stock y la asociación son por sucursal."
      />

      <Card className="p-6 mb-6">
        <form onSubmit={crearProducto} className="flex flex-wrap items-end gap-3">
          <Field label="Nombre del producto nuevo">
            <input value={nombreNuevo} onChange={(e) => setNombreNuevo(e.target.value)} className={inputClass} />
          </Field>
          <Field label="Categoría">
            <select value={categoriaNueva} onChange={(e) => setCategoriaNueva(e.target.value)} className={inputClass}>
              {categorias.map((c) => (
                <option key={c.id} value={c.id}>
                  {c.nombre}
                </option>
              ))}
            </select>
          </Field>
          <Field label="Precio">
            <input type="number" min="0" value={precioNuevo} onChange={(e) => setPrecioNuevo(e.target.value)} className={inputClass} />
          </Field>
          <Button type="submit">
            <PlusIcon /> Nuevo producto o servicio
          </Button>
        </form>
      </Card>

      <div className="grid md:grid-cols-2 gap-5">
        {productos.map((p) => {
          const sp = GFDB.stockDeProducto(p.id, ubicacion.id);
          const asociado = !!sp;
          return (
            <Card key={p.id} className="p-5">
              <div className="flex items-start justify-between gap-3 mb-3">
                <div>
                  <p className="font-semibold text-deep">{p.nombre}</p>
                  <p className="text-xs text-deep/45">
                    {asociado ? `Stock en esta sucursal: ${sp.cantidad_actual}` : "No asociado a esta sucursal"}
                  </p>
                </div>
                <div className="flex items-center gap-1.5">
                  {!asociado && (
                    <Button variant="secondary" onClick={() => asociar(p.id)}>
                      Asociar
                    </Button>
                  )}
                  <button
                    onClick={() => guardarProducto(p, { visible: !p.visible })}
                    title={p.visible ? "Desactivar (ocultar del catálogo público)" : "Activar (mostrar en el catálogo público)"}
                    className={`p-1.5 rounded-lg ${p.visible ? "text-institutional hover:bg-institutional/10" : "text-deep/35 hover:bg-deep/5"}`}
                  >
                    <PowerIcon className="w-4 h-4" />
                  </button>
                </div>
              </div>
              <div className="space-y-3">
                <Field label="Precio">
                  <input
                    type="number"
                    defaultValue={p.precio}
                    onBlur={(e) => guardarProducto(p, { precio: Number(e.target.value) })}
                    className={inputClass}
                  />
                </Field>
                <Field label="Descripción">
                  <textarea
                    defaultValue={p.descripcion}
                    rows={2}
                    onBlur={(e) => guardarProducto(p, { descripcion: e.target.value })}
                    className={inputClass}
                  />
                </Field>
                <label className="flex items-center gap-2 text-sm text-deep/70">
                  <input type="checkbox" checked={p.visible} onChange={(e) => guardarProducto(p, { visible: e.target.checked })} />
                  Visible para clientes
                </label>
              </div>
            </Card>
          );
        })}
      </div>
    </div>
  );
};

/* ---------------------------------------------------------
   CAJA (responsable)
--------------------------------------------------------- */
const CajaTab = ({ session, bump, showToast }) => {
  const hoy = GFDB.fechaHoy();
  const ventasHoy = GFDB.query("ventas", (v) => v.sucursal_id === session.sucursalId && v.fecha_hora.slice(0, 10) === hoy);
  const sumaPorMedio = (medio) => ventasHoy.filter((v) => v.medio_pago === medio).reduce((acc, v) => acc + v.total, 0);

  const cierreHoy = GFDB.query("cierres_caja", (c) => c.sucursal_id === session.sucursalId && c.fecha === hoy)[0] || null;

  const [efectivo, setEfectivo] = useState(sumaPorMedio("efectivo"));
  const [transferencia, setTransferencia] = useState(sumaPorMedio("transferencia"));
  const [billetera, setBilletera] = useState(sumaPorMedio("billetera_virtual"));
  const [observaciones, setObservaciones] = useState("");

  const historial = GFDB.query("cierres_caja", (c) => c.sucursal_id === session.sucursalId).sort((a, b) => (a.fecha < b.fecha ? 1 : -1));

  const cerrar = (e) => {
    e.preventDefault();
    GFDB.cerrarCaja({
      sucursalId: session.sucursalId,
      usuarioId: session.usuarioId,
      fecha: hoy,
      totalEfectivo: Number(efectivo),
      totalTransferencia: Number(transferencia),
      totalBilletera: Number(billetera),
      observaciones,
    });
    bump();
    showToast("Caja cerrada correctamente.");
  };

  return (
    <div>
      <SectionBar eyebrowNumber={EYEBROWS.caja.n} eyebrow={EYEBROWS.caja.label} title="Caja" description="El cierre de esta sucursal no es visible para otras sucursales ni para fábrica." />

      <h2 className="font-display font-bold text-lg text-deep mb-3">Ingresos de hoy ({fmtDate(hoy)})</h2>
      <div className="grid grid-cols-3 gap-4 mb-8 max-w-xl">
        {window.GF_ENUMS.medio_pago.map((m) => (
          <Card key={m.value} className="p-4 text-center">
            <p className="text-xs text-deep/50">{m.label}</p>
            <p className="text-lg font-display font-bold text-deep">{money(sumaPorMedio(m.value))}</p>
          </Card>
        ))}
      </div>

      {cierreHoy ? (
        <Card className="p-6 max-w-xl mb-8">
          <p className="text-sm font-semibold text-institutional mb-3">La caja de hoy ya está cerrada.</p>
          <div className="grid grid-cols-2 gap-3 text-sm">
            <p className="text-deep/60">Efectivo</p>
            <p className="text-right font-medium">{money(cierreHoy.total_efectivo)}</p>
            <p className="text-deep/60">Transferencia</p>
            <p className="text-right font-medium">{money(cierreHoy.total_transferencia)}</p>
            <p className="text-deep/60">Billetera virtual</p>
            <p className="text-right font-medium">{money(cierreHoy.total_billetera)}</p>
            <p className="text-deep font-semibold">Total general</p>
            <p className="text-right font-bold">{money(cierreHoy.total_general)}</p>
          </div>
          {cierreHoy.observaciones && <p className="text-xs text-deep/50 mt-3">Obs: {cierreHoy.observaciones}</p>}
        </Card>
      ) : (
        <Card className="p-6 max-w-xl mb-8">
          <form onSubmit={cerrar} className="space-y-4">
            <div className="grid grid-cols-3 gap-3">
              <Field label="Efectivo">
                <input type="number" value={efectivo} onChange={(e) => setEfectivo(e.target.value)} className={inputClass} />
              </Field>
              <Field label="Transferencia">
                <input type="number" value={transferencia} onChange={(e) => setTransferencia(e.target.value)} className={inputClass} />
              </Field>
              <Field label="Billetera virtual">
                <input type="number" value={billetera} onChange={(e) => setBilletera(e.target.value)} className={inputClass} />
              </Field>
            </div>
            <p className="text-sm text-deep/70">
              Total general: <span className="font-bold text-deep">{money(Number(efectivo) + Number(transferencia) + Number(billetera))}</span>
            </p>
            <Field label="Observaciones (diferencias o aclaraciones)">
              <textarea value={observaciones} onChange={(e) => setObservaciones(e.target.value)} rows={2} className={inputClass} />
            </Field>
            <Button type="submit">Cerrar caja del día</Button>
          </form>
        </Card>
      )}

      <h2 className="font-display font-bold text-lg text-deep mb-3">Historial de cierres de mi sucursal</h2>
      {historial.length === 0 ? (
        <EmptyState text="Todavía no hay cierres de caja registrados." />
      ) : (
        <TableWrap>
          <table className="w-full text-sm">
            <thead className="bg-institutional/10 text-deep/70 text-xs uppercase">
              <tr>
                <th className="text-left px-4 py-3">Fecha</th>
                <th className="text-left px-4 py-3">Efectivo</th>
                <th className="text-left px-4 py-3">Transferencia</th>
                <th className="text-left px-4 py-3">Billetera</th>
                <th className="text-left px-4 py-3">Total</th>
              </tr>
            </thead>
            <tbody>
              {historial.map((c, i) => (
                <tr key={c.id} className={i % 2 === 1 ? "bg-deep/[0.025]" : ""}>
                  <td className="px-4 py-3 border-t border-deep/5 whitespace-nowrap">{fmtDate(c.fecha)}</td>
                  <td className="px-4 py-3 border-t border-deep/5">{money(c.total_efectivo)}</td>
                  <td className="px-4 py-3 border-t border-deep/5">{money(c.total_transferencia)}</td>
                  <td className="px-4 py-3 border-t border-deep/5">{money(c.total_billetera)}</td>
                  <td className="px-4 py-3 border-t border-deep/5 font-medium">{money(c.total_general)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </TableWrap>
      )}
    </div>
  );
};

/* ---------------------------------------------------------
   VENTAS CON NUMERACIÓN — Facturas / Presupuestos / Recibos /
   Remitos / Recibos App (una sola pantalla parametrizada por tipo,
   igual criterio que "compras" en fábrica: un solo motor de datos,
   varias puertas de entrada en el sidebar).
--------------------------------------------------------- */
const COMPROBANTE_TITULOS = { factura: "Facturas", presupuesto: "Presupuestos", recibo: "Recibos", remito: "Remitos" };
const COMPROBANTE_SINGULAR = { factura: "Factura", presupuesto: "Presupuesto", recibo: "Recibo", remito: "Remito" };
const COMPROBANTE_MSG_EMITIDO = {
  factura: "Factura emitida. Conexión ARCA pendiente de integración.",
  presupuesto: "Presupuesto emitido.",
  recibo: "Recibo emitido.",
  remito: "Remito emitido.",
};
const COMPROBANTE_MSG_ANULADO = {
  factura: "Factura anulada.",
  presupuesto: "Presupuesto anulado.",
  recibo: "Recibo anulado.",
  remito: "Remito anulado.",
};
const COMPROBANTE_NUEVO_LABEL = { factura: "Nueva factura", presupuesto: "Nuevo presupuesto", recibo: "Nuevo recibo", remito: "Nuevo remito" };

const ComprobanteScreen = ({ tipo, tabKey, session, bump, showToast, soloLectura }) => {
  const clientes = GFDB.get("clientes");
  const productos = GFDB.get("productos");
  const [clienteId, setClienteId] = useState(clientes[0]?.id || "");
  const [lineas, setLineas] = useState([{ productoId: productos[0]?.id || "", cantidad: 1, precio: productos[0]?.precio || 0 }]);
  const [observaciones, setObservaciones] = useState("");
  const [filtroEstado, setFiltroEstado] = useState("todos");
  const [detalleId, setDetalleId] = useState(null);

  const setLinea = (idx, patch) => setLineas((prev) => prev.map((l, i) => (i === idx ? { ...l, ...patch } : l)));
  const addLinea = () => setLineas((prev) => [...prev, { productoId: productos[0]?.id || "", cantidad: 1, precio: productos[0]?.precio || 0 }]);
  const removeLinea = (idx) => setLineas((prev) => prev.filter((_, i) => i !== idx));
  const total = lineas.reduce((acc, l) => acc + Number(l.cantidad || 0) * Number(l.precio || 0), 0);

  const todos = soloLectura
    ? []
    : GFDB.query("comprobantes_venta", (c) => c.sucursal_id === session.sucursalId && c.tipo === tipo)
        .filter((c) => filtroEstado === "todos" || c.estado === filtroEstado)
        .sort((a, b) => new Date(b.fecha) - new Date(a.fecha));

  const handleSubmit = (e) => {
    e.preventDefault();
    const items = lineas
      .filter((l) => l.productoId && Number(l.cantidad) > 0)
      .map((l) => ({ productoId: Number(l.productoId), cantidad: Number(l.cantidad), precioUnitario: Number(l.precio) }));
    if (!clienteId || items.length === 0) return;
    GFDB.emitirComprobante({ sucursalId: session.sucursalId, usuarioId: session.usuarioId, tipo, clienteId: Number(clienteId), items, observaciones });
    setLineas([{ productoId: productos[0]?.id || "", cantidad: 1, precio: productos[0]?.precio || 0 }]);
    setObservaciones("");
    bump();
    showToast(COMPROBANTE_MSG_EMITIDO[tipo]);
  };

  const columns = [
    { key: "numero", label: "Número", render: (c) => `${c.punto_venta}-${String(c.numero).padStart(8, "0")}` },
    {
      key: "cliente",
      label: "Cliente",
      render: (c) => GFDB.find("clientes", c.cliente_id)?.nombre || "-",
      searchValue: (c) => GFDB.find("clientes", c.cliente_id)?.nombre || "",
    },
    { key: "fecha", label: "Fecha", render: (c) => fmtDate(c.fecha) },
    { key: "total", label: "Total", render: (c) => money(c.total) },
    {
      key: "estado",
      label: "Estado",
      render: (c) => (
        <span className={`text-xs font-semibold ${c.estado === "anulado" ? "text-red-600" : "text-institutional"}`}>
          {c.estado === "anulado" ? "Anulado" : "Emitido"}
        </span>
      ),
      csvValue: (c) => (c.estado === "anulado" ? "Anulado" : "Emitido"),
    },
  ];
  if (tipo === "factura") {
    columns.push({
      key: "arca",
      label: "ARCA",
      render: () => (
        <span className="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-semibold bg-amber-100 text-amber-700">
          Pendiente de integración
        </span>
      ),
      csvValue: () => "Pendiente de integración",
    });
  }

  const actionsRenderer = (c) => (
    <RowActions
      onView={() => setDetalleId(c.id)}
      onPrint={() => window.print()}
      deleteLabel="Anular"
      onDelete={
        c.estado === "emitido"
          ? () => {
              GFDB.anularComprobante(c.id, session.usuarioId);
              bump();
              showToast(COMPROBANTE_MSG_ANULADO[tipo], "error");
            }
          : undefined
      }
    />
  );

  const comprobanteActivo = detalleId ? GFDB.find("comprobantes_venta", detalleId) : null;

  return (
    <div>
      <SectionBar
        eyebrowNumber={EYEBROWS[tabKey].n}
        eyebrow={EYEBROWS[tabKey].label}
        title={soloLectura ? `${COMPROBANTE_TITULOS[tipo]} (App)` : COMPROBANTE_TITULOS[tipo]}
        description={
          soloLectura
            ? "Recibos generados por clientes desde la app / portal online."
            : tipo === "factura"
            ? "Venta a consumidor final con numeración. Conexión ARCA: pendiente de integración."
            : undefined
        }
      />

      {soloLectura ? (
        <EmptyState text="Todavía no existe un canal de clientes (app/portal) generando recibos — esta vista queda lista para cuando exista." />
      ) : (
        <>
          <ListToolbar onExport={() => exportCSV(`${tipo}s.csv`, columns, todos)} onPrint={() => window.print()} />
          <FiltersBar
            filters={[
              {
                label: "Estado",
                value: filtroEstado,
                onChange: setFiltroEstado,
                options: [
                  { value: "todos", label: "Todos" },
                  { value: "emitido", label: "Emitido" },
                  { value: "anulado", label: "Anulado" },
                ],
              },
            ]}
          />
          <DataTable columns={columns} rows={todos} getRowId={(c) => c.id} actionsRenderer={actionsRenderer} searchPlaceholder="Buscar cliente…" />

          {comprobanteActivo && (
            <Modal open={true} onClose={() => setDetalleId(null)} title={`${COMPROBANTE_SINGULAR[tipo]} ${comprobanteActivo.punto_venta}-${String(comprobanteActivo.numero).padStart(8, "0")}`}>
              <p className="text-sm text-deep/60 mb-1">
                Cliente: <span className="font-medium text-deep">{GFDB.find("clientes", comprobanteActivo.cliente_id)?.nombre}</span>
              </p>
              <p className="text-sm text-deep/60 mb-4">Fecha: {fmtDateTime(comprobanteActivo.fecha)}</p>
              <ul className="divide-y divide-deep/6 mb-4">
                {GFDB.query("detalle_comprobante_venta", (d) => d.comprobante_id === comprobanteActivo.id).map((l) => (
                  <li key={l.id} className="py-2 flex items-center justify-between text-sm">
                    <span>
                      {GFDB.find("productos", l.producto_id)?.nombre} · {l.cantidad}
                    </span>
                    <span className="font-medium">{money(l.subtotal)}</span>
                  </li>
                ))}
              </ul>
              <p className="text-right font-semibold text-deep">Total: {money(comprobanteActivo.total)}</p>
              {tipo === "factura" && (
                <p className="text-xs text-amber-700 bg-amber-50 rounded-lg px-3 py-2 mt-3">
                  CAE: pendiente — la conexión con ARCA todavía no está integrada.
                </p>
              )}
            </Modal>
          )}

          <div className="mt-8">
            <h2 className="font-display font-bold text-lg text-deep mb-3">{COMPROBANTE_NUEVO_LABEL[tipo]}</h2>
            <Card className="p-6">
              <form onSubmit={handleSubmit} className="space-y-4">
                <Field label="Cliente">
                  <select value={clienteId} onChange={(e) => setClienteId(e.target.value)} className={inputClass}>
                    {clientes.map((c) => (
                      <option key={c.id} value={c.id}>
                        {c.nombre}
                      </option>
                    ))}
                  </select>
                </Field>

                <div className="space-y-3">
                  {lineas.map((l, idx) => (
                    <div key={idx} className="grid grid-cols-1 sm:grid-cols-[1fr_100px_140px_auto] gap-3 items-end">
                      <Field label="Producto">
                        <select
                          value={l.productoId}
                          onChange={(e) => {
                            const p = GFDB.find("productos", Number(e.target.value));
                            setLinea(idx, { productoId: e.target.value, precio: p ? p.precio : 0 });
                          }}
                          className={inputClass}
                        >
                          {productos.map((p) => (
                            <option key={p.id} value={p.id}>
                              {p.nombre}
                            </option>
                          ))}
                        </select>
                      </Field>
                      <Field label="Cantidad">
                        <input type="number" min="1" value={l.cantidad} onChange={(e) => setLinea(idx, { cantidad: e.target.value })} className={inputClass} />
                      </Field>
                      <Field label="Precio unit.">
                        <input type="number" min="0" value={l.precio} onChange={(e) => setLinea(idx, { precio: e.target.value })} className={inputClass} />
                      </Field>
                      {lineas.length > 1 && (
                        <Button type="button" variant="ghost" onClick={() => removeLinea(idx)}>
                          Quitar
                        </Button>
                      )}
                    </div>
                  ))}
                </div>
                <Button type="button" variant="secondary" onClick={addLinea}>
                  <PlusIcon /> Agregar producto
                </Button>

                <div className="flex items-center justify-between pt-2 border-t border-deep/8">
                  <p className="text-2xl font-display font-bold text-deep">{money(total)}</p>
                </div>

                <Field label="Observaciones">
                  <textarea value={observaciones} onChange={(e) => setObservaciones(e.target.value)} rows={2} className={inputClass} />
                </Field>
                <Button type="submit">Emitir {COMPROBANTE_SINGULAR[tipo].toLowerCase()}</Button>
              </form>
            </Card>
          </div>
        </>
      )}
    </div>
  );
};

/* ---------------------------------------------------------
   COBRANZAS
--------------------------------------------------------- */
const CobranzasTab = ({ session, bump, showToast }) => {
  const clientes = GFDB.get("clientes");
  const [clienteId, setClienteId] = useState(clientes[0]?.id || "");
  const [medioPago, setMedioPago] = useState("efectivo");
  const [monto, setMonto] = useState("");
  const [observaciones, setObservaciones] = useState("");
  const [aplicaciones, setAplicaciones] = useState({});

  const comprobantesPendientes = GFDB.query(
    "comprobantes_venta",
    (c) => c.sucursal_id === session.sucursalId && c.cliente_id === Number(clienteId) && c.estado === "emitido" && (c.tipo === "factura" || c.tipo === "recibo")
  );

  const cobranzas = GFDB.query("cobranzas", (c) => c.sucursal_id === session.sucursalId).sort((a, b) => new Date(b.fecha) - new Date(a.fecha));

  const handleSubmit = (e) => {
    e.preventDefault();
    const aplicacionesArr = Object.entries(aplicaciones)
      .filter(([, importe]) => Number(importe) > 0)
      .map(([comprobanteId, importe]) => ({ comprobanteId: Number(comprobanteId), importe: Number(importe) }));
    if (!clienteId || !monto || Number(monto) <= 0) return;
    GFDB.registrarCobranza({
      sucursalId: session.sucursalId,
      clienteId: Number(clienteId),
      usuarioId: session.usuarioId,
      medioPago,
      monto: Number(monto),
      aplicaciones: aplicacionesArr,
      observaciones,
    });
    setMonto("");
    setObservaciones("");
    setAplicaciones({});
    bump();
    showToast("Cobranza registrada.");
  };

  const columns = [
    { key: "fecha", label: "Fecha", render: (c) => fmtDateTime(c.fecha) },
    {
      key: "cliente",
      label: "Cliente",
      render: (c) => GFDB.find("clientes", c.cliente_id)?.nombre || "-",
      searchValue: (c) => GFDB.find("clientes", c.cliente_id)?.nombre || "",
    },
    { key: "medio", label: "Medio de pago", render: (c) => enumLabel("medio_pago", c.medio_pago) },
    { key: "monto", label: "Monto", render: (c) => money(c.monto) },
  ];

  return (
    <div>
      <SectionBar eyebrowNumber={EYEBROWS.cobranzas.n} eyebrow={EYEBROWS.cobranzas.label} title="Cobranzas" description="Registrar un cobro y aplicarlo contra facturas o recibos pendientes del cliente." />
      <Card className="p-6 mb-8">
        <form onSubmit={handleSubmit} className="space-y-4">
          <div className="grid sm:grid-cols-3 gap-4">
            <Field label="Cliente">
              <select
                value={clienteId}
                onChange={(e) => {
                  setClienteId(e.target.value);
                  setAplicaciones({});
                }}
                className={inputClass}
              >
                {clientes.map((c) => (
                  <option key={c.id} value={c.id}>
                    {c.nombre}
                  </option>
                ))}
              </select>
            </Field>
            <Field label="Medio de pago">
              <select value={medioPago} onChange={(e) => setMedioPago(e.target.value)} className={inputClass}>
                {window.GF_ENUMS.medio_pago.map((m) => (
                  <option key={m.value} value={m.value}>
                    {m.label}
                  </option>
                ))}
              </select>
            </Field>
            <Field label="Monto cobrado">
              <input type="number" min="0" value={monto} onChange={(e) => setMonto(e.target.value)} className={inputClass} />
            </Field>
          </div>

          <div>
            <p className="text-xs font-semibold uppercase tracking-wide text-deep/50 mb-2">Aplicar contra comprobantes pendientes</p>
            {comprobantesPendientes.length === 0 ? (
              <p className="text-sm text-deep/40">Este cliente no tiene facturas ni recibos pendientes en esta sucursal.</p>
            ) : (
              <div className="space-y-2">
                {comprobantesPendientes.map((c) => (
                  <div key={c.id} className="flex items-center gap-3">
                    <span className="text-sm text-deep flex-1">
                      {COMPROBANTE_SINGULAR[c.tipo]} {c.punto_venta}-{String(c.numero).padStart(8, "0")} · {money(c.total)}
                    </span>
                    <input
                      type="number"
                      min="0"
                      placeholder="Importe a aplicar"
                      value={aplicaciones[c.id] || ""}
                      onChange={(e) => setAplicaciones((prev) => ({ ...prev, [c.id]: e.target.value }))}
                      className={`${inputClass} w-40`}
                    />
                  </div>
                ))}
              </div>
            )}
          </div>

          <Field label="Observaciones">
            <textarea value={observaciones} onChange={(e) => setObservaciones(e.target.value)} rows={2} className={inputClass} />
          </Field>
          <Button type="submit">Registrar cobranza</Button>
        </form>
      </Card>

      <h2 className="font-display font-bold text-lg text-deep mb-3">Historial de cobranzas</h2>
      <DataTable columns={columns} rows={cobranzas} getRowId={(c) => c.id} searchPlaceholder="Buscar cliente…" />
    </div>
  );
};

/* ---------------------------------------------------------
   LISTAS DE PRECIOS
--------------------------------------------------------- */
const ListasPreciosTab = ({ bump, showToast }) => {
  const listas = GFDB.get("listas_precios");
  const productos = GFDB.get("productos");
  const [nombreNueva, setNombreNueva] = useState("");
  const [listaEditando, setListaEditando] = useState(null);

  const crearLista = (e) => {
    e.preventDefault();
    if (!nombreNueva.trim()) return;
    GFDB.insert("listas_precios", { nombre: nombreNueva, es_predeterminada: false });
    setNombreNueva("");
    bump();
    showToast("Lista de precios creada.");
  };

  const precioEnLista = (listaId, productoId) => {
    const item = GFDB.query("lista_precios_items", (i) => i.lista_id === listaId && i.producto_id === productoId)[0];
    return item ? item.precio : GFDB.find("productos", productoId).precio;
  };

  const guardarPrecio = (listaId, productoId, precio) => {
    const item = GFDB.query("lista_precios_items", (i) => i.lista_id === listaId && i.producto_id === productoId)[0];
    if (item) GFDB.update("lista_precios_items", item.id, { precio });
    else GFDB.insert("lista_precios_items", { lista_id: listaId, producto_id: productoId, precio });
    bump();
  };

  const listaActiva = listaEditando ? GFDB.find("listas_precios", listaEditando) : null;

  return (
    <div>
      <SectionBar
        eyebrowNumber={EYEBROWS["listas-precios"].n}
        eyebrow={EYEBROWS["listas-precios"].label}
        title="Listas de Precios"
        description="El punto de venta sigue usando el precio base del producto — elegir la lista al vender queda para una próxima etapa."
      />
      <Card className="p-6 mb-8 max-w-lg">
        <form onSubmit={crearLista} className="flex items-end gap-3">
          <Field label="Nueva lista">
            <input value={nombreNueva} onChange={(e) => setNombreNueva(e.target.value)} className={inputClass} placeholder="Ej: Mayorista" />
          </Field>
          <Button type="submit">
            <PlusIcon /> Crear
          </Button>
        </form>
      </Card>

      <TableWrap>
        <table className="w-full text-sm">
          <thead className="bg-institutional/10 text-deep/70 text-xs uppercase">
            <tr>
              <th className="text-left px-4 py-3">Lista</th>
              <th className="px-4 py-3"></th>
            </tr>
          </thead>
          <tbody>
            {listas.map((l, i) => (
              <tr key={l.id} className={i % 2 === 1 ? "bg-deep/[0.025]" : ""}>
                <td className="px-4 py-3 border-t border-deep/5 font-medium text-deep">
                  {l.nombre} {l.es_predeterminada && <span className="text-xs text-deep/40 font-normal">(predeterminada)</span>}
                </td>
                <td className="px-4 py-3 border-t border-deep/5 text-right">
                  <Button variant="secondary" onClick={() => setListaEditando(l.id)}>
                    Editar precios
                  </Button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </TableWrap>

      <Modal open={!!listaActiva} onClose={() => setListaEditando(null)} title={listaActiva ? `Precios — ${listaActiva.nombre}` : ""} wide>
        {listaActiva && (
          <div className="space-y-2 max-h-[60vh] overflow-y-auto">
            {productos.map((p) => (
              <div key={p.id} className="flex items-center gap-3">
                <span className="text-sm text-deep flex-1">{p.nombre}</span>
                <input
                  type="number"
                  defaultValue={precioEnLista(listaActiva.id, p.id)}
                  onBlur={(e) => guardarPrecio(listaActiva.id, p.id, Number(e.target.value))}
                  className={`${inputClass} w-32`}
                />
              </div>
            ))}
          </div>
        )}
      </Modal>
    </div>
  );
};

/* ---------------------------------------------------------
   TRANSFERENCIAS DE STOCK (recibir, del lado sucursal)
--------------------------------------------------------- */
const TransferenciasTab = ({ session, bump, showToast }) => {
  const ubicacion = GFDB.ubicacionDeSucursal(session.sucursalId);
  const transferencias = GFDB.query("transferencias_stock", (t) => t.destino_ubicacion_id === ubicacion.id).sort((a, b) => (a.fecha < b.fecha ? 1 : -1));

  const columns = [
    { key: "fecha", label: "Fecha", render: (t) => fmtDate(t.fecha) },
    { key: "origen", label: "Origen", render: (t) => GFDB.find("ubicaciones_stock", t.origen_ubicacion_id)?.nombre || "-" },
    {
      key: "items",
      label: "Productos",
      render: (t) =>
        GFDB.query("detalle_transferencia_stock", (d) => d.transferencia_id === t.id)
          .map((d) => `${GFDB.find("productos", d.producto_id).nombre} (${d.cantidad})`)
          .join(", "),
    },
    {
      key: "estado",
      label: "Estado",
      render: (t) => (
        <span className={`text-xs font-semibold ${t.estado === "recibido" ? "text-institutional" : "text-amber-600"}`}>
          {enumLabel("estado_transferencia", t.estado)}
        </span>
      ),
      csvValue: (t) => enumLabel("estado_transferencia", t.estado),
    },
  ];

  const actionsRenderer = (t) =>
    t.estado === "enviado" ? (
      <div className="flex justify-end">
        <MiniButton
          onClick={() => {
            GFDB.recibirTransferencia(t.id, session.usuarioId);
            bump();
            showToast("Transferencia recibida. Stock actualizado.");
          }}
        >
          Recibir
        </MiniButton>
      </div>
    ) : null;

  return (
    <div>
      <SectionBar
        eyebrowNumber={EYEBROWS.transferencias.n}
        eyebrow={EYEBROWS.transferencias.label}
        title="Transferencias de Stock"
        description={`Ingresos de mercadería hacia ${ubicacion.nombre} desde fábrica.`}
      />
      <DataTable columns={columns} rows={transferencias} getRowId={(t) => t.id} actionsRenderer={actionsRenderer} searchPlaceholder="Buscar producto…" />
    </div>
  );
};

/* ---------------------------------------------------------
   ESTADÍSTICAS
--------------------------------------------------------- */
const ESTADOS_VENTA_CONTABLE = ["confirmado", "en_preparacion", "listo_retiro", "pendiente_envio", "finalizado"];

const EstadisticasClientesTab = ({ session }) => {
  const totales = {};
  GFDB.query("pedidos", (p) => p.sucursal_id === session.sucursalId && ESTADOS_VENTA_CONTABLE.includes(p.estado)).forEach((p) => {
    totales[p.cliente_id] = (totales[p.cliente_id] || 0) + p.total;
  });
  GFDB.query("comprobantes_venta", (c) => c.sucursal_id === session.sucursalId && c.estado === "emitido" && c.tipo !== "presupuesto").forEach((c) => {
    totales[c.cliente_id] = (totales[c.cliente_id] || 0) + c.total;
  });
  const filas = Object.entries(totales)
    .map(([clienteId, total]) => ({ id: Number(clienteId), cliente: GFDB.find("clientes", Number(clienteId)), total }))
    .filter((f) => f.cliente)
    .sort((a, b) => b.total - a.total)
    .slice(0, 10);

  const columns = [
    { key: "cliente", label: "Cliente", render: (f) => f.cliente.nombre },
    { key: "total", label: "Total comprado", render: (f) => money(f.total) },
  ];

  return (
    <div>
      <SectionBar eyebrowNumber={EYEBROWS["stats-clientes"].n} eyebrow={EYEBROWS["stats-clientes"].label} title="Top clientes" description="Suma de pedidos confirmados en adelante + comprobantes emitidos (no presupuestos)." />
      {filas.length === 0 ? <EmptyState text="Todavía no hay datos suficientes." /> : <DataTable columns={columns} rows={filas} getRowId={(f) => f.id} searchPlaceholder="Buscar cliente…" />}
    </div>
  );
};

const EstadisticasProductosTab = ({ session }) => {
  const ubicacion = GFDB.ubicacionDeSucursal(session.sucursalId);
  const cantidades = {};
  GFDB.query("detalle_ventas", (d) => GFDB.find("ventas", d.venta_id)?.sucursal_id === session.sucursalId).forEach((d) => {
    cantidades[d.producto_id] = (cantidades[d.producto_id] || 0) + d.cantidad;
  });
  GFDB.query("detalle_pedidos", (d) => {
    const pedido = GFDB.find("pedidos", d.pedido_id);
    return pedido && pedido.sucursal_id === session.sucursalId && ESTADOS_VENTA_CONTABLE.includes(pedido.estado);
  }).forEach((d) => {
    cantidades[d.producto_id] = (cantidades[d.producto_id] || 0) + d.cantidad;
  });
  GFDB.query("detalle_comprobante_venta", (d) => {
    const c = GFDB.find("comprobantes_venta", d.comprobante_id);
    return c && c.sucursal_id === session.sucursalId && c.estado === "emitido" && c.tipo !== "presupuesto";
  }).forEach((d) => {
    cantidades[d.producto_id] = (cantidades[d.producto_id] || 0) + d.cantidad;
  });
  const filas = Object.entries(cantidades)
    .map(([productoId, cantidad]) => ({ id: Number(productoId), producto: GFDB.find("productos", Number(productoId)), cantidad }))
    .filter((f) => f.producto)
    .sort((a, b) => b.cantidad - a.cantidad)
    .slice(0, 10);

  const columns = [
    { key: "producto", label: "Producto", render: (f) => f.producto.nombre },
    { key: "cantidad", label: "Unidades vendidas", render: (f) => f.cantidad },
  ];

  return (
    <div>
      <SectionBar eyebrowNumber={EYEBROWS["stats-productos"].n} eyebrow={EYEBROWS["stats-productos"].label} title="Top productos" description={`Ventas presenciales + pedidos + comprobantes de ${ubicacion.nombre}.`} />

    </div>
  );
};

const EstadisticasVentasTab = ({ session }) => {

const EstadisticasPresupuestosTab = ({ session }) => {
  const presupuestos = GFDB.query("comprobantes_venta", (c) => c.sucursal_id === session.sucursalId && c.tipo === "presupuesto");
  const facturas = GFDB.query("comprobantes_venta", (c) => c.sucursal_id === session.sucursalId && c.tipo === "factura");
  const totalPresupuestado = presupuestos.reduce((acc, c) => acc + c.total, 0);

  return (
    <div>
      <SectionBar eyebrowNumber={EYEBROWS["stats-presupuestos"].n} eyebrow={EYEBROWS["stats-presupuestos"].label} title="Presupuestos" />

const UsuariosTab = ({ session, bump, showToast }) => {
  const usuarios = GFDB.get("usuarios");
  const roles = GFDB.get("roles");
  const sucursales = GFDB.get("sucursales");
  const [nombre, setNombre] = useState("");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [rolId, setRolId] = useState(roles[0]?.id || "");
  const [sucursalId, setSucursalId] = useState(session.sucursalId || "");
  const [nuevoAbierto, setNuevoAbierto] = useState(false);

  const rolElegido = roles.find((r) => r.id === Number(rolId));
  const esFabrica = rolElegido?.nombre === "administrativo_fabrica";

  const crear = (e) => {
    e.preventDefault();
    if (!nombre.trim() || !email.trim() || !password.trim()) return;
    GFDB.insert("usuarios", { nombre, email, password, rol_id: Number(rolId), sucursal_id: esFabrica ? null : Number(sucursalId), activo: true });
    setNombre("");
    setEmail("");
    setPassword("");
    setNuevoAbierto(false);
    bump();
    showToast("Usuario creado.");
  };

  const columns = [
    { key: "nombre", label: "Nombre", render: (u) => u.nombre },
    { key: "email", label: "Email", render: (u) => u.email },
    { key: "rol", label: "Rol", render: (u) => ROLE_LABELS[GFDB.find("roles", u.rol_id)?.nombre] || "-" },
    { key: "sucursal", label: "Sucursal", render: (u) => GFDB.find("sucursales", u.sucursal_id)?.nombre || "Fábrica" },
    {
      key: "estado",
      label: "Estado",
      render: (u) => <span className={`text-xs font-semibold ${u.activo ? "text-institutional" : "text-deep/40"}`}>{u.activo ? "Activo" : "Inactivo"}</span>,
      csvValue: (u) => (u.activo ? "Activo" : "Inactivo"),
    },
  ];

  const actionsRenderer = (u) => (
    <RowActions
      onDelete={() => {
        GFDB.update("usuarios", u.id, { activo: !u.activo });
        bump();
        showToast(u.activo ? "Usuario desactivado." : "Usuario reactivado.");
      }}
      deleteIcon={PowerIcon}
      deleteLabel={u.activo ? "Desactivar" : "Activar"}
    />
  );

  return (
    <div>
      <SectionBar eyebrowNumber={EYEBROWS["config-usuarios"].n} eyebrow={EYEBROWS["config-usuarios"].label} title="Usuarios" description="Usuarios internos autorizados a acceder al panel." />
      <ListToolbar onNew={() => setNuevoAbierto(true)} newLabel="Nuevo usuario" onExport={() => exportCSV("usuarios.csv", columns, usuarios)} />
      <DataTable columns={columns} rows={usuarios} getRowId={(u) => u.id} actionsRenderer={actionsRenderer} searchPlaceholder="Buscar usuario…" />

      <Modal open={nuevoAbierto} onClose={() => setNuevoAbierto(false)} title="Nuevo usuario">
        <form onSubmit={crear} className="space-y-4">
          <Field label="Nombre">
            <input required value={nombre} onChange={(e) => setNombre(e.target.value)} className={inputClass} />
          </Field>
          <Field label="Email">
            <input type="email" required value={email} onChange={(e) => setEmail(e.target.value)} className={inputClass} />
          </Field>
          <Field label="Contraseña">
            <input type="password" required value={password} onChange={(e) => setPassword(e.target.value)} className={inputClass} />
          </Field>
          <Field label="Rol">
            <select value={rolId} onChange={(e) => setRolId(e.target.value)} className={inputClass}>
              {roles.map((r) => (
                <option key={r.id} value={r.id}>
                  {ROLE_LABELS[r.nombre]}
                </option>
              ))}
            </select>
          </Field>
          {!esFabrica && (
            <Field label="Sucursal">
              <select value={sucursalId} onChange={(e) => setSucursalId(e.target.value)} className={inputClass}>
                {sucursales.map((s) => (
                  <option key={s.id} value={s.id}>
                    {s.nombre}
                  </option>
                ))}
              </select>
            </Field>
          )}
          <Button type="submit">
            <PlusIcon /> Crear usuario
          </Button>
        </form>
      </Modal>
    </div>
  );
};

const RolesTab = () => {
  const roles = GFDB.get("roles");
  return (
    <div>
      <SectionBar eyebrowNumber={EYEBROWS["config-roles"].n} eyebrow={EYEBROWS["config-roles"].label} title="Roles" description="Roles fijos del sistema — no se crean roles nuevos desde acá." />
      <TableWrap>
        <table className="w-full text-sm">
          <thead className="bg-institutional/10 text-deep/70 text-xs uppercase">
            <tr>
              <th className="text-left px-4 py-3">Rol</th>
              <th className="text-left px-4 py-3">Descripción</th>
            </tr>
          </thead>
          <tbody>
            {roles.map((r, i) => (
              <tr key={r.id} className={i % 2 === 1 ? "bg-deep/[0.025]" : ""}>
                <td className="px-4 py-3 border-t border-deep/5 font-medium text-deep">{ROLE_LABELS[r.nombre]}</td>
                <td className="px-4 py-3 border-t border-deep/5 text-deep/50">{r.descripcion}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </TableWrap>
    </div>
  );
};

const IntegracionesTab = ({ session }) => {
  const sucursal = GFDB.find("sucursales", session.sucursalId);
  return (
    <div>
      <SectionBar eyebrowNumber={EYEBROWS["config-integraciones"].n} eyebrow={EYEBROWS["config-integraciones"].label} title="Integraciones" />
      <Card className="p-6 max-w-lg">
        <div className="flex items-center gap-3 mb-4">
          <span className="w-11 h-11 rounded-full bg-amber-100 text-amber-700 flex items-center justify-center">
            <PlugIcon className="w-5 h-5" />
          </span>
          <div>
            <p className="font-semibold text-deep">Conexión ARCA</p>
            <span className="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-semibold bg-amber-100 text-amber-700">Pendiente de integración</span>
          </div>
        </div>
        <p className="text-sm text-deep/60 mb-1">
          CUIT de esta sucursal: <span className="font-medium text-deep">{sucursal.cuit}</span>
        </p>
        <p className="text-xs text-deep/45 mt-3">
          Cada sucursal tiene su propia conexión ARCA con su propio CUIT — nunca se comparte ni se consolida con otra sucursal ni con fábrica. La numeración y el circuito de facturas ya están construidos; falta conectar la API real de ARCA para autorizar comprobantes (CAE) automáticamente.
        </p>
      </Card>
    </div>
  );
};

/* ---------------------------------------------------------
   APP
--------------------------------------------------------- */
const SucursalApp = () => {
  const [session] = useState(() => GFAuth.requireRole(["empleado_sucursal", "responsable_sucursal"]));
  const [tab, setTab] = useState(() => (session?.rolNombre === "empleado_sucursal" ? "clientes" : "dashboard"));
  const [tick, setTick] = useState(0);
  const [toast, setToast] = useState(null);

  const bump = () => setTick((t) => t + 1);
  const showToast = (message, kind = "success") => {
    setToast({ message, kind });
    setTimeout(() => setToast(null), 3000);
  };

  if (!session) return null;

  const modules = modulosParaRol(session.rolNombre);
  const quickAccess = quickAccessParaRol(session.rolNombre);
  const notifCount = GFDB.query("pedidos", (p) => p.sucursal_id === session.sucursalId && p.estado === "pendiente").length;

  let content;
  if (tab === "dashboard") content = <DashboardSucursalTab session={session} onNavigate={setTab} />;
  else if (tab === "stock") content = <StockTab session={session} />;
  else if (tab === "ingreso") content = <IngresoTab session={session} bump={bump} showToast={showToast} />;
  else if (tab === "pedidos") content = <PedidosTab session={session} bump={bump} showToast={showToast} />;
  else if (tab === "ventas") content = <VentasTab session={session} bump={bump} showToast={showToast} />;
  else if (tab === "ajuste" && session.rolNombre === "responsable_sucursal") content = <AjusteTab session={session} bump={bump} showToast={showToast} />;
  else if (tab === "catalogo" && session.rolNombre === "responsable_sucursal") content = <CatalogoTab session={session} bump={bump} showToast={showToast} />;
  else if (tab === "caja" && session.rolNombre === "responsable_sucursal") content = <CajaTab session={session} bump={bump} showToast={showToast} />;
  else if (tab === "catalogo-consulta") content = <CatalogoConsultaTab session={session} />;
  else if (tab === "transferencias") content = <TransferenciasTab session={session} bump={bump} showToast={showToast} />;
  else if (tab === "venta-facturas" && session.rolNombre === "responsable_sucursal")
    content = <ComprobanteScreen tipo="factura" tabKey="venta-facturas" session={session} bump={bump} showToast={showToast} />;
  else if (tab === "venta-presupuestos" && session.rolNombre === "responsable_sucursal")
    content = <ComprobanteScreen tipo="presupuesto" tabKey="venta-presupuestos" session={session} bump={bump} showToast={showToast} />;
  else if (tab === "venta-recibos" && session.rolNombre === "responsable_sucursal")
    content = <ComprobanteScreen tipo="recibo" tabKey="venta-recibos" session={session} bump={bump} showToast={showToast} />;
  else if (tab === "venta-remitos" && session.rolNombre === "responsable_sucursal")
    content = <ComprobanteScreen tipo="remito" tabKey="venta-remitos" session={session} bump={bump} showToast={showToast} />;
  else if (tab === "venta-recibos-app") content = <ComprobanteScreen tipo="recibo" tabKey="venta-recibos-app" session={session} bump={bump} showToast={showToast} soloLectura />;
  else if (tab === "cobranzas" && session.rolNombre === "responsable_sucursal") content = <CobranzasTab session={session} bump={bump} showToast={showToast} />;
  else if (tab === "listas-precios" && session.rolNombre === "responsable_sucursal") content = <ListasPreciosTab bump={bump} showToast={showToast} />;
  else if (tab === "categorias" && session.rolNombre === "responsable_sucursal") content = <CategoriasTab bump={bump} showToast={showToast} />;
  else if (tab === "marcas" && session.rolNombre === "responsable_sucursal") content = <MarcasTab bump={bump} showToast={showToast} />;
  else if (tab === "grupos" && session.rolNombre === "responsable_sucursal") content = <GruposTab bump={bump} showToast={showToast} />;
  else if (tab === "variantes" && session.rolNombre === "responsable_sucursal") content = <VariantesTab bump={bump} showToast={showToast} />;
  else if (tab === "depositos" && session.rolNombre === "responsable_sucursal") content = <DepositosTab session={session} bump={bump} showToast={showToast} />;
  else if (tab === "clientes") content = <ClientesTab bump={bump} showToast={showToast} />;
  else if (tab === "stats-clientes" && session.rolNombre === "responsable_sucursal") content = <EstadisticasClientesTab session={session} />;
  else if (tab === "stats-productos" && session.rolNombre === "responsable_sucursal") content = <EstadisticasProductosTab session={session} />;
  else if (tab === "stats-ventas" && session.rolNombre === "responsable_sucursal") content = <EstadisticasVentasTab session={session} />;
  else if (tab === "stats-presupuestos" && session.rolNombre === "responsable_sucursal") content = <EstadisticasPresupuestosTab session={session} />;
  else if (tab === "config-usuarios" && session.rolNombre === "responsable_sucursal") content = <UsuariosTab session={session} bump={bump} showToast={showToast} />;
  else if (tab === "config-roles" && session.rolNombre === "responsable_sucursal") content = <RolesTab />;
  else if (tab === "config-integraciones" && session.rolNombre === "responsable_sucursal") content = <IntegracionesTab session={session} />;
  else if (session.rolNombre === "responsable_sucursal" && CAJA_PLACEHOLDER_ITEMS.some((it) => it.key === tab)) {
    const it = CAJA_PLACEHOLDER_ITEMS.find((i) => i.key === tab);
    content = (
      <ProximamenteTab
        eyebrowNumber={EYEBROWS[tab].n}
        eyebrow={EYEBROWS[tab].label}
        titulo={it.label}
        descripcion="Todavía no está construido — queda planificado para la etapa de Caja ampliada del roadmap."
      />
    );
  } else if (session.rolNombre === "responsable_sucursal" && CONTABILIDAD_ITEMS.some((it) => it.key === tab)) {
    const it = CONTABILIDAD_ITEMS.find((i) => i.key === tab);
    content = (
      <ProximamenteTab
        eyebrowNumber={EYEBROWS[tab].n}
        eyebrow={EYEBROWS[tab].label}
        titulo={it.label}
        descripcion={`Bajo el CUIT propio de esta sucursal (${GFDB.find("sucursales", session.sucursalId)?.cuit}) — nunca consolidado con otra sucursal ni fábrica. Motor contable planificado para una etapa siguiente del roadmap.`}
      />
    );
  } else if (session.rolNombre === "responsable_sucursal" && ["config-emails", "config-leyendas", "config-reportes"].includes(tab)) {
    const it = CONFIG_ITEMS.find((i) => i.key === tab);
    content = <ProximamenteTab eyebrowNumber={EYEBROWS[tab].n} eyebrow={EYEBROWS[tab].label} titulo={it.label} />;
  } else if (session.rolNombre === "empleado_sucursal") content = <ClientesTab bump={bump} showToast={showToast} />;
  else content = <DashboardSucursalTab session={session} onNavigate={setTab} />;

  return (
    <PrivateShell
      session={session}
      modules={modules}
      quickAccess={quickAccess}
      activeKey={tab}
      onNavigate={setTab}
      notifCount={notifCount}
      onLogout={GFAuth.logout}
    >
      {content}
      <Toast message={toast?.message} kind={toast?.kind} onClose={() => setToast(null)} />
    </PrivateShell>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<SucursalApp />);
</script>
