const fmtDate = (iso) => {
  if (!iso) return "-";
  // Fechas "solo fecha" (YYYY-MM-DD) se arman en horario local: new Date(iso)
  // las interpreta como medianoche UTC y en husos negativos (AR) muestran el
  // día anterior.
  const soloFecha = /^\d{4}-\d{2}-\d{2}$/.test(iso);
  const d = soloFecha ? new Date(`${iso}T00:00:00`) : new Date(iso);
  return d.toLocaleDateString("es-AR");
};

const fmtDateTime = (iso) => {
  if (!iso) return "-";
  const d = new Date(iso);
  return `${d.toLocaleDateString("es-AR")} ${d.toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" })}`;
};

const enumLabel = (enumName, value) => {
  const item = (window.GF_ENUMS[enumName] || []).find((e) => e.value === value);
  return item ? item.label : value;
};

const exportCSV = (filename, columns, rows) => {
  const esc = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const header = columns.map((c) => esc(c.label)).join(",");
  const lines = rows.map((r) => columns.map((c) => esc(c.csvValue ? c.csvValue(r) : c.searchValue ? c.searchValue(r) : r[c.key])).join(","));
  const csv = [header, ...lines].join("\n");
  const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
};

    <header style={{ top: "var(--gf-barra, 0px)" }} className="fixed left-0 right-0 h-16 z-40 bg-deep text-white flex items-center gap-3 px-4 md:px-6">

        onClick={() => onNavigate(session.rolNombre === "empleado_sucursal" ? "ventas" : "dashboard")}

        className="p-2.5 rounded-xl text-institutional hover:bg-white/10 transition-colors shrink-0"

      </button>
      <div className="h-8 w-px bg-white/10 hidden md:block shrink-0" />

      <nav className="hidden md:flex items-center gap-1 overflow-x-auto no-scrollbar">
        {quickAccess.map((q) => {
          const target = q.target || q.key;
          return (
            <button
              key={q.key}
              title={q.label}
              onClick={() => onNavigate(target)}
              className={`p-2.5 rounded-xl transition-colors shrink-0 ${
                activeKey === target ? "bg-institutional text-white" : "text-white/55 hover:text-white hover:bg-white/10"
              }`}
            >
              {q.icon}
            </button>
          );

      <div className="flex-1" />

      <button className="relative p-2 rounded-xl text-white/70 hover:text-white hover:bg-white/10 shrink-0" title={notifTitle || "Notificaciones"}>

const Sidebar = ({ modules, activeKey, onNavigate, mobileOpen, onCloseMobile }) => {
  const parentOfActive = modules.find((m) => m.children && m.children.some((c) => c.key === activeKey));
  const [openKey, setOpenKey] = useState(parentOfActive ? parentOfActive.key : null);

  const navigate = (key) => {
    onNavigate(key);
    onCloseMobile();
  };

  return (
    <>
      {mobileOpen && <div className="fixed inset-0 bg-deep/60 z-20 md:hidden" onClick={onCloseMobile} />}
      <aside
        style={{ top: "calc(4rem + var(--gf-barra, 0px))" }}
        className={`fixed left-0 bottom-0 w-64 bg-deep border-r border-white/5 overflow-y-auto py-4 z-30 transition-transform duration-200 md:translate-x-0 ${
          mobileOpen ? "translate-x-0" : "-translate-x-full"
        }`}
      >
        <nav className="px-3 space-y-1">
          {modules.map((m) => {
          if (m.children) {
            const isOpen = openKey === m.key;
            const childActive = m.children.some((c) => c.key === activeKey);
            return (
              <div key={m.key}>
                <button
                  onClick={() => setOpenKey(isOpen ? null : m.key)}
                  className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-colors ${
                    childActive ? "text-institutional" : "text-white/70 hover:text-white hover:bg-white/5"
                  }`}
                >
                  {m.icon}
                  <span className="flex-1 text-left">{m.label}</span>
                  <ChevronDownIcon className={`w-4 h-4 transition-transform ${isOpen ? "rotate-180" : ""}`} />
                </button>
                {isOpen && (
                  <div className="mt-1 ml-4 pl-4 border-l border-white/10 space-y-0.5">
                    {m.children.map((c) => {
                      const active = activeKey === c.key;
                      return (
                        <button
                          key={c.key}
                          onClick={() => navigate(c.key)}
                          className={`relative w-full flex items-center gap-2 pl-3 pr-2 py-2 rounded-lg text-sm text-left ${
                            active ? "bg-institutional/15 text-institutional font-semibold" : "text-white/60 hover:text-white hover:bg-white/5"
                          }`}
                        >
                          {active && <span className="absolute left-0 top-0 bottom-0 w-1 rounded-full bg-institutional" />}
                          <span className="w-1.5 h-1.5 rounded-full bg-current opacity-60 shrink-0" />
                          {c.label}
                        </button>
                      );
                    })}
                  </div>
                )}
              </div>
            );
          }
          const active = activeKey === m.key;
          return (
            <button
              key={m.key}
              onClick={() => navigate(m.key)}
              className={`relative w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-colors ${
                active ? "bg-institutional/15 text-institutional font-semibold" : "text-white/70 hover:text-white hover:bg-white/5"
              }`}
            >
              {active && <span className="absolute left-0 top-1.5 bottom-1.5 w-1 rounded-full bg-institutional" />}
              {m.icon}
              {m.label}
            </button>
          );
          })}
        </nav>
      </aside>
    </>
  );
};

const SalesChart = ({ data, range, onRangeChange }) => {
  const [hover, setHover] = useState(null);
  const max = Math.max(1, ...data.map((d) => d.value));
  const w = 640,
    h = 220,
    padTop = 16,
    padBottom = 28,
    padSide = 8,
    barGap = 10;
  const barW = data.length ? (w - padSide * 2 - barGap * (data.length - 1)) / data.length : 0;
  const hasData = data.some((d) => d.value > 0);

  return (
    <Card className="p-6">
      <div className="flex flex-wrap items-center justify-between gap-4 mb-5">
        <h3 className="font-display font-bold text-base text-deep">Ventas por período</h3>
        <div className="flex items-center gap-1 bg-deep/5 rounded-full p-1">
          {CHART_RANGES.map((r) => (
            <button
              key={r.key}
              onClick={() => onRangeChange(r.key)}
              className={`px-3 py-1.5 rounded-full text-xs font-semibold transition-colors ${
                range === r.key ? "bg-institutional text-white" : "text-deep/60 hover:text-deep"
              }`}
            >
              {r.label}
            </button>
          ))}
        </div>
      </div>

      {!hasData ? (
        <EmptyState text="Todavía no hay ventas ni pedidos confirmados en este período." />
      ) : (
        <div className="relative">
          <svg viewBox={`0 0 ${w} ${h}`} className="w-full h-52" preserveAspectRatio="none">
            {data.map((d, i) => {
              const barH = Math.max(2, ((h - padTop - padBottom) * d.value) / max);
              const x = padSide + i * (barW + barGap);
              const y = h - padBottom - barH;
              return (
                <g key={i} onMouseEnter={() => setHover(i)} onMouseLeave={() => setHover((v) => (v === i ? null : v))}>
                  <rect x={x} y={padTop} width={barW} height={h - padTop - padBottom} fill="transparent" />
                  <rect x={x} y={y} width={barW} height={barH} rx={4} fill={hover === i ? "#29683D" : "#00AE4C"} />
                  <text x={x + barW / 2} y={h - 8} textAnchor="middle" fontSize="9" fill="#1A312B" opacity="0.45">
                    {d.label}
                  </text>
                </g>
              );
            })}
          </svg>
          {hover !== null && data[hover] && (
            <div
              className="absolute -translate-x-1/2 -translate-y-full bg-deep text-white text-xs rounded-lg px-2.5 py-1.5 pointer-events-none whitespace-nowrap"
              style={{
                left: `${((padSide + hover * (barW + barGap) + barW / 2) / w) * 100}%`,
                top: `${((h - padBottom - Math.max(2, ((h - padTop - padBottom) * data[hover].value) / max)) / h) * 100}%`,
              }}
            >
              {money(data[hover].value)}
            </div>
          )}
        </div>
      )}
    </Card>
  );
};

const DataTable = ({ columns, rows, getRowId, actionsRenderer, searchPlaceholder = "Buscar…", pageSizeOptions = [10, 25, 50] }) => {
  const [query, setQuery] = useState("");
  const [visibleCols, setVisibleCols] = useState(() => new Set(columns.filter((c) => c.defaultVisible !== false).map((c) => c.key)));
  const [colsMenuOpen, setColsMenuOpen] = useState(false);
  const [pageSize, setPageSize] = useState(pageSizeOptions[0]);
  const [page, setPage] = useState(1);

  const q = query.trim().toLowerCase();
  const filtered = q
    ? rows.filter((r) => columns.some((c) => String((c.searchValue ? c.searchValue(r) : r[c.key]) ?? "").toLowerCase().includes(q)))
    : rows;

  const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
  const safePage = Math.min(page, totalPages);
  const start = (safePage - 1) * pageSize;
  const pageRows = filtered.slice(start, start + pageSize);
  const visibleColumns = columns.filter((c) => visibleCols.has(c.key));

  const toggleCol = (key) => {
    setVisibleCols((prev) => {
      const next = new Set(prev);
      if (next.has(key)) next.delete(key);
      else next.add(key);
      return next;
    });
  };

  return (
    <div>
      <div className="flex flex-wrap items-center gap-2 mb-3">
        <div className="relative flex-1 min-w-[200px] max-w-xs">
          <SearchIcon className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-deep/35" />
          <input
            value={query}
            onChange={(e) => {
              setQuery(e.target.value);
              setPage(1);
            }}
            placeholder={searchPlaceholder}
            className={`${inputClass} pl-9`}
          />
        </div>
        <div className="flex-1" />
        <div className="relative">
          <Button variant="secondary" onClick={() => setColsMenuOpen((v) => !v)}>
            <ColumnsIcon /> Columnas
          </Button>
          {colsMenuOpen && (
            <div
              className="absolute right-0 top-11 w-56 bg-white rounded-xl shadow-xl border border-deep/8 py-2 z-30"
              onMouseLeave={() => setColsMenuOpen(false)}
            >
              {columns.map((c) => (
                <label key={c.key} className="flex items-center gap-2 px-3.5 py-1.5 text-sm text-deep/80 cursor-pointer">
                  <input type="checkbox" checked={visibleCols.has(c.key)} onChange={() => toggleCol(c.key)} />
                  {c.label}
                </label>
              ))}
            </div>
          )}
        </div>
        <select
          value={pageSize}
          onChange={(e) => {
            setPageSize(Number(e.target.value));
            setPage(1);
          }}
          className={`${inputClass} w-auto`}
        >
          {pageSizeOptions.map((n) => (
            <option key={n} value={n}>
              {n} por página
            </option>
          ))}
        </select>
      </div>

      {filtered.length === 0 ? (
        <EmptyState text="No se encontraron resultados." />
      ) : (
        <>
          <TableWrap>
            <table className="w-full text-sm">
              <thead className="bg-institutional/10 text-deep/70 text-xs uppercase">
                <tr>
                  {visibleColumns.map((c) => (
                    <th key={c.key} className="text-left px-4 py-3 font-semibold whitespace-nowrap">
                      {c.label}
                    </th>
                  ))}
                  {actionsRenderer && <th className="px-4 py-3"></th>}
                </tr>
              </thead>
              <tbody>
                {pageRows.map((row, i) => (
                  <tr key={getRowId(row)} className={i % 2 === 1 ? "bg-deep/[0.025]" : ""}>
                    {visibleColumns.map((c) => (
                      <td key={c.key} className="px-4 py-3 border-t border-deep/5">
                        {c.render ? c.render(row) : row[c.key]}
                      </td>
                    ))}
                    {actionsRenderer && <td className="px-4 py-3 border-t border-deep/5">{actionsRenderer(row)}</td>}
                  </tr>
                ))}
              </tbody>
            </table>
          </TableWrap>

          <div className="flex flex-wrap items-center justify-between gap-3 mt-3 text-sm text-deep/55">
            <p>
              {start + 1}-{Math.min(start + pageSize, filtered.length)} de {filtered.length}
            </p>
            <div className="flex items-center gap-1">
              <button
                disabled={safePage <= 1}
                onClick={() => setPage((p) => Math.max(1, p - 1))}
                className="px-2.5 py-1.5 rounded-lg border border-deep/10 disabled:opacity-30"
              >
                ‹
              </button>
              <span className="px-2">
                {safePage} / {totalPages}
              </span>
              <button
                disabled={safePage >= totalPages}
                onClick={() => setPage((p) => Math.min(totalPages, p + 1))}
                className="px-2.5 py-1.5 rounded-lg border border-deep/10 disabled:opacity-30"
              >
                ›
              </button>
            </div>
          </div>
        </>
      )}
    </div>
  );
};

const ESTADOS_CONTABLES = ["confirmado", "en_preparacion", "listo_retiro", "pendiente_envio", "finalizado"];

const buildRangeBuckets = (range) => {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const buckets = [];
  if (range === "semana") {
    for (let i = 6; i >= 0; i--) {
      const start = new Date(today);
      start.setDate(start.getDate() - i);
      const end = new Date(start);
      end.setDate(end.getDate() + 1);
      buckets.push({ start, end, label: start.toLocaleDateString("es-AR", { day: "2-digit", month: "2-digit" }) });
    }
  } else if (range === "mes") {
    for (let i = 3; i >= 0; i--) {
      const end = new Date(today);
      end.setDate(end.getDate() - i * 7);
      const start = new Date(end);
      start.setDate(start.getDate() - 7);
      buckets.push({ start, end, label: start.toLocaleDateString("es-AR", { day: "2-digit", month: "2-digit" }) });
    }
  } else {
    for (let i = 5; i >= 0; i--) {
      const start = new Date(today.getFullYear(), today.getMonth() - i, 1);
      const end = new Date(today.getFullYear(), today.getMonth() - i + 1, 1);
      buckets.push({ start, end, label: start.toLocaleDateString("es-AR", { month: "short" }) });
    }
  }
  return buckets;
};

const useSalesChartData = (sucursalId) => {
  const [range, setRange] = useState("semana");
  const buckets = buildRangeBuckets(range);
  const ventas = GFDB.query("ventas", (v) => v.sucursal_id === sucursalId);
  const pedidos = GFDB.query("pedidos", (p) => p.sucursal_id === sucursalId && ESTADOS_CONTABLES.includes(p.estado));
  const data = buckets.map((b) => {
    const totalVentas = ventas
      .filter((v) => {
        const d = new Date(v.fecha_hora);
        return d >= b.start && d < b.end;
      })
      .reduce((acc, v) => acc + v.total, 0);
    const totalPedidos = pedidos
      .filter((p) => {
        const d = new Date(p.fecha);
        return d >= b.start && d < b.end;
      })
      .reduce((acc, p) => acc + p.total, 0);
    return { label: b.label, value: totalVentas + totalPedidos };
  });
  return { range, setRange, data };
};

const NuevoPedidoModal = ({ session, onClose, bump, showToast }) => {
  const clientes = GFDB.get("clientes");

  const [modalidad, setModalidad] = useState("retiro_sucursal");

  const [observaciones, setObservaciones] = useState("");

  const setLinea = (idx, patch) => setLineas((prev) => prev.map((l, i) => (i === idx ? { ...l, ...patch } : l)));
  const addLinea = () => setLineas((prev) => [...prev, { productoId: productos[0]?.id || "", cantidad: 1, precio: productos[0]?.precio || 0 }]);
  const removeLinea = (idx) => setLineas((prev) => prev.filter((_, i) => i !== idx));
  const total = lineas.reduce((acc, l) => acc + Number(l.cantidad || 0) * Number(l.precio || 0), 0);

    e.preventDefault();
    const items = lineas

    showToast("Pedido cargado como pendiente de confirmar.");

  return (
    <Modal open={true} onClose={onClose} title="Nuevo pedido" wide>

            <select value={modalidad} onChange={(e) => setModalidad(e.target.value)} className={inputClass}>
              {window.GF_ENUMS.modalidad_entrega.map((m) => (
                <option key={m.value} value={m.value}>
                  {m.label}
                </option>
              ))}
            </select>
          </Field>
        </div>

        <div className="space-y-3">
          {lineas.map((l, idx) => (
            <div key={idx} className="grid grid-cols-1 sm:grid-cols-[1fr_100px_140px_auto] gap-3 items-end">
              <Field label="Producto">
                <select
                  value={l.productoId}
                  onChange={(e) => {
                    const p = GFDB.find("productos", Number(e.target.value));

              <Field label="Precio unit.">
                <input type="number" min="0" value={l.precio} onChange={(e) => setLinea(idx, { precio: e.target.value })} className={inputClass} />
              </Field>

/* ---------------------------------------------------------
   CAJA Y VENTAS CONECTADAS A LA API
   Estas pantallas usan datos reales (/api/caja, /api/ventas,
   /api/precios, /api/stock, /api/clientes). El perfil sale de la
   sesión real (GF_SESION_REAL), no de los datos de prueba, y los
   permisos los vuelve a validar siempre el servidor.
--------------------------------------------------------- */
const { useEffect, useRef } = React;

const perfilReal = () => window.GF_SESION_REAL?.ambitoActivo?.perfil;
const esDueno = () => perfilReal() === "dueno_local";

const PANTALLAS_CONECTADAS = ["ventas", "ventas-dia", "caja"];

const pesos = (n) =>
  new Intl.NumberFormat("es-AR", { style: "currency", currency: "ARS", minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(Number(n || 0));
const cantidadTexto = (n) => Number(n || 0).toLocaleString("es-AR", { maximumFractionDigits: 3 });
const porcentajeTexto = (fraccion) =>
  fraccion === null || fraccion === undefined ? "—" : `${(Number(fraccion) * 100).toLocaleString("es-AR", { maximumFractionDigits: 1 })} %`;
const hora = (iso) => (iso ? new Date(iso).toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit", hourCycle: "h23" }) : "-");
const hoyISO = () => new Date().toLocaleDateString("sv-SE", { timeZone: "America/Argentina/Buenos_Aires" });
const redondear2 = (n) => Math.round((Number(n) + Number.EPSILON) * 100) / 100;

const MEDIOS = { efectivo: "Efectivo", transferencia: "Transferencia", billetera_virtual: "Billetera virtual", cuenta_corriente: "Cuenta corriente" };
const RUBROS = { gasto: "Gasto", retiro: "Retiro", aporte: "Aporte", pago_fabrica: "Pago a la fábrica", otro: "Otro" };
const TIPO_DEL_RUBRO = { gasto: "egreso", retiro: "egreso", pago_fabrica: "egreso", aporte: "ingreso" };
const ORIGENES = { manual: "Manual", venta: "Venta", cobranza: "Cobranza", devolucion: "Devolución" };
const CAMPOS = {
  saldoInicial: "Saldo inicial",
  efectivoContado: "Efectivo contado",
  monto: "Monto",
  observacion: "Observación",
  motivo: "Motivo",
  medioPago: "Medio de pago",
  porcentajeDescuento: "Descuento",
  renglones: "Artículos",
};

/** Sin sesión (401): al login, avisando que venció. Igual que shared/auth.js. */
const sesionVencida = () => {
  try {
    sessionStorage.removeItem("gf_hubo_sesion");
  } catch (e) {}
  window.location.replace("login.html?motivo=vencida");
};

/** GFAuth.api manda el token CSRF en cada POST, PUT o DELETE. Acá se agrega el manejo de la sesión vencida. */
const pedirApi = async (ruta, opciones) => {
  const r = await GFAuth.api(ruta, opciones);
  if (r.status === 401) {
    sesionVencida();
    return new Promise(() => {});
  }
  return r;
};

/** Un mensaje claro para cada error de la API. El servidor ya responde en castellano; acá se agregan pistas. */
const mensajeDeError = (r) => {
  const d = r.data || {};
  const base = d.mensaje || "";
  if (r.status === 0) return base || "No se pudo conectar con el servidor.";
  if (r.status >= 500) return "Ocurrió un error en el servidor y no se guardó nada. Probá de nuevo en un momento.";
  let texto = base;
  if (d.campos && Object.keys(d.campos).length) {
    const detalle = Object.entries(d.campos)
      .map(([campo, error]) => `${CAMPOS[campo.replace(/\[\d+\].*/, "")] || campo}: ${error}`)
      .join(" · ");
    texto = texto ? `${texto} (${detalle})` : detalle;
  }
  if (base.startsWith("Stock insuficiente")) return `No hay stock suficiente para esta venta. ${base.replace(/^Stock insuficiente:?\s*/, "")}`.trim();
  if (base.startsWith("No hay una caja abierta")) return `${base} Abrila desde Caja y volvé a intentar.`;
  if (r.status === 403 && (!base || base === "No tenés permiso para realizar esta acción."))
    return "Tu perfil no tiene permiso para hacer esto.";
  if (r.status === 404 && !base) return "No se encontró lo que buscabas.";
  return texto || `Error ${r.status}.`;
};

const Aviso = ({ tipo = "error", children, className = "" }) => {
  const estilos = {
    error: "border-red-200 bg-red-50 text-red-800",
    aviso: "border-amber-300 bg-amber-50 text-amber-900",
    info: "border-institutional/30 bg-institutional/5 text-deep",
    ok: "border-institutional/40 bg-institutional/10 text-deep",
  };
  return (
    <div role={tipo === "error" ? "alert" : "status"} className={`flex gap-3 items-start rounded-2xl border px-4 py-3 text-sm ${estilos[tipo]} ${className}`}>
      {tipo === "ok" ? <CheckIcon className="w-5 h-5 shrink-0 text-institutional" /> : <AlertIcon className="w-5 h-5 shrink-0 mt-px" />}
      <div className="min-w-0">{children}</div>
    </div>
  );
};

  s.cierre
    ? { esperado: s.cierre.efectivoEsperado, contado: s.cierre.efectivoContado, diferencia: s.cierre.diferencia, total: s.cierre.totalGeneral, cerradaAt: s.cierre.cerradaAt, usuario: s.cierre.usuarioCierre }

const CorreccionCierreModal = ({ sesion, onClose, onHecho }) => {
  const [contado, setContado] = useState(sesion ? String(sesion.efectivoContado ?? "") : "");
  const [motivo, setMotivo] = useState("");
  const [error, setError] = useState(null);
  const [enviando, setEnviando] = useState(false);
  if (!sesion) return null;
  const enviar = async (e) => {
    e.preventDefault();
    setEnviando(true);
    setError(null);
    const r = await pedirApi(`/api/caja/sesiones/${sesion.id}/correccion`, { method: "POST", body: { efectivoContado: Number(contado), motivo } });
    setEnviando(false);
    if (!r.ok) return setError(mensajeDeError(r));
    onHecho("Cierre corregido. Queda en la auditoría con el valor anterior y el nuevo.");
  };
  return (
    <Modal open onClose={onClose} title={`Corregir el cierre del ${fmtDate(sesion.cerradaAt)}`}>
      <form onSubmit={enviar} className="space-y-4">
        <p className="text-sm text-deep/60">

        </Field>
        <Field label="Motivo">
          <textarea required maxLength={500} rows={2} value={motivo} onChange={(e) => setMotivo(e.target.value)} className={inputClass} />

          <Button type="submit" disabled={enviando}>

const BuscadorCliente = ({ cliente, onElegir }) => {
  const [q, setQ] = useState("");
  const [resultados, setResultados] = useState([]);
  const [error, setError] = useState(null);
  useEffect(() => {
    if (q.trim().length < 2) {
      setResultados([]);
      return;
    }
    const t = setTimeout(async () => {
      const r = await pedirApi(`/api/clientes?activo=true&tamano=8&q=${encodeURIComponent(q.trim())}`);
      if (r.ok) {
        setResultados(r.data.clientes);
        setError(null);
      } else setError(mensajeDeError(r));
    }, 300);
    return () => clearTimeout(t);
  }, [q]);

  if (cliente)
    return (
      <div className="flex items-center justify-between gap-3 rounded-xl border border-institutional/40 bg-institutional/5 px-3.5 py-2.5 text-sm">
        <span>
          <span className="font-semibold">{cliente.nombre}</span>
          {cliente.documentoNumero && <span className="text-deep/50"> · {cliente.documentoNumero}</span>}
        </span>
        <button type="button" className="text-deep/50 hover:text-deep text-xs font-semibold" onClick={() => onElegir(null)}>
          Quitar
        </button>
      </div>
    );
  return (
    <div className="relative">
      <input value={q} onChange={(e) => setQ(e.target.value)} className={inputClass} placeholder="Consumidor final, o buscá un cliente…" />
      {error && <p className="text-xs text-red-700 mt-1">{error}</p>}
      {resultados.length > 0 && (
        <div className="absolute z-10 mt-1 w-full bg-white rounded-xl border border-deep/10 shadow-lg py-1 max-h-64 overflow-y-auto">
          {resultados.map((c) => (
            <button
              type="button"
              key={c.id}
              onClick={() => {
                onElegir(c);
                setQ("");
                setResultados([]);
              }}
              className="w-full text-left px-3.5 py-2 text-sm hover:bg-institutional/10"
            >
              <span className="font-medium">{c.nombre}</span>

            </button>
          ))}
        </div>
      )}
      {q.trim().length >= 2 && resultados.length === 0 && !error && <p className="text-xs text-deep/45 mt-1">Sin resultados.</p>}
    </div>
  );
};

const NuevaVentaTab = ({ showToast, onNavigate }) => {
  const dueno = esDueno();
  const [precios, setPrecios] = useState([]);
  const [stock, setStock] = useState({});
  const [enUnidades, setEnUnidades] = useState({});
  const [tope, setTope] = useState(null);
  const [cajaAbierta, setCajaAbierta] = useState(null);
  const [errorCarga, setErrorCarga] = useState(null);
  const [busqueda, setBusqueda] = useState("");
  const [lineas, setLineas] = useState([]);
  const [cliente, setCliente] = useState(null);
  const [medioPago, setMedioPago] = useState("efectivo");
  const [descuento, setDescuento] = useState("");
  const [error, setError] = useState(null);
  const [enviando, setEnviando] = useState(false);
  const [registrada, setRegistrada] = useState(null);

  const cargar = async () => {
    const [p, s, c, k] = await Promise.all([
      pedirApi("/api/precios"),
      pedirApi("/api/stock"),
      pedirApi("/api/ambito/condiciones-venta"),
      pedirApi("/api/caja/actual"),
    ]);
    if (!p.ok) return setErrorCarga(mensajeDeError(p));
    setPrecios(p.data);
    if (s.ok) {
      const porArticulo = {};
      const unidades = {};
      s.data.forEach((x) => (unidades[x.articuloId] = x.unidadMedida === "unidad"));
      s.data.filter((x) => x.ubicacionNombre === "Principal").forEach((x) => (porArticulo[x.articuloId] = Number(x.cantidad)));
      setStock(porArticulo);
      setEnUnidades(unidades);
    }
    if (c.ok) setTope(Number(c.data.descuentoMaximoEmpleado));
    setCajaAbierta(k.status === 200);
  };
  useEffect(() => {
    cargar();
  }, []);

  const pct = Number(descuento || 0);
  const superaTope = !dueno && tope !== null && pct > tope;
  const unitario = (precio) => redondear2(precio * (1 - pct / 100));
  const totalEstimado = lineas.reduce((acc, l) => acc + redondear2(unitario(l.precio) * Number(l.cantidad || 0)), 0);

  const visibles = precios
    .filter((p) => !lineas.some((l) => l.articuloId === p.articuloId))
    .filter((p) => p.articuloNombre.toLowerCase().includes(busqueda.trim().toLowerCase()))
    .slice(0, 8);

  const agregar = (p) => {
    setLineas((prev) => [...prev, { articuloId: p.articuloId, nombre: p.articuloNombre, precio: Number(p.precio), cantidad: "1" }]);
    setBusqueda("");
    setRegistrada(null);
  };
  const cambiarCantidad = (id, cantidad) => setLineas((prev) => prev.map((l) => (l.articuloId === id ? { ...l, cantidad } : l)));
  const quitar = (id) => setLineas((prev) => prev.filter((l) => l.articuloId !== id));

  const confirmar = async (e) => {
    e.preventDefault();
    if (lineas.length === 0) return setError("Agregá al menos un artículo.");
    if (superaTope) return setError(`El descuento máximo que podés aplicar en este local es ${cantidadTexto(tope)} %.`);
    setEnviando(true);
    setError(null);
    const body = {
      clienteId: cliente ? cliente.id : null,
      medioPago,
      porcentajeDescuento: pct,
      renglones: lineas.map((l) => ({ articuloId: l.articuloId, cantidad: Number(l.cantidad) })),
    };
    const r = await pedirApi("/api/ventas", { method: "POST", body });
    setEnviando(false);
    if (!r.ok) {
      setError(mensajeDeError(r));
      if (r.status === 409) cargar();
      return;
    }
    setRegistrada(r.data);
    setLineas([]);
    setCliente(null);
    setDescuento("");
    setMedioPago("efectivo");
    showToast(`Venta registrada: ${pesos(r.data.total)}.`);
    cargar();
  };

  return (
    <div>
      <SectionBar
        eyebrowNumber={EYEBROWS.ventas.n}
        eyebrow={EYEBROWS.ventas.label}
        title="Nueva venta"
        description="Venta presencial en el local. Descuenta el stock, emite el comprobante X y, si se cobra en el momento, entra a la caja."
      />
      {errorCarga && <Aviso className="mb-6">{errorCarga}</Aviso>}
      {cajaAbierta === false && (
        <Aviso tipo="aviso" className="mb-6">
          <span className="font-semibold">La caja está cerrada.</span> Para registrar una venta, primero abrí la caja.{" "}
          <button type="button" className="underline font-semibold" onClick={() => onNavigate("caja")}>
            Ir a Caja
          </button>
        </Aviso>
      )}
      {registrada && <VentaRegistrada venta={registrada} onNueva={() => setRegistrada(null)} />}

      <form onSubmit={confirmar} className="grid xl:grid-cols-[1fr_380px] gap-6 items-start">
        <Card className="p-6">
          <Field label="Buscar artículo">
            <div className="relative">
              <SearchIcon className="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-deep/40" />
              <input value={busqueda} onChange={(e) => setBusqueda(e.target.value)} className={`${inputClass} pl-10`} placeholder="Nombre del artículo…" />
            </div>
          </Field>
          <div className="mt-3 mb-6 rounded-xl border border-deep/8 divide-y divide-deep/5">
            {visibles.length === 0 ? (
              <p className="px-4 py-3 text-sm text-deep/45">{precios.length === 0
                  ? "No hay artículos con precio en la lista del local."
                  : busqueda.trim()
                  ? "Sin resultados."
                  : "Ya agregaste todos los artículos con precio."}</p>
            ) : (
              visibles.map((p) => (
                <div key={p.articuloId} className="flex items-center gap-3 px-4 py-2.5 text-sm">
                  <span className="flex-1 min-w-0 truncate font-medium">{p.articuloNombre}</span>
                  <span className="text-deep/50 whitespace-nowrap">Stock: {stock[p.articuloId] !== undefined ? cantidadTexto(stock[p.articuloId]) : "—"}</span>
                  <span className="font-semibold whitespace-nowrap w-28 text-right">{pesos(p.precio)}</span>
                  <MiniButton type="button" onClick={() => agregar(p)}>
                    Agregar
                  </MiniButton>
                </div>
              ))
            )}
          </div>

          <h2 className="font-display font-bold text-lg text-deep mb-3">Artículos de la venta</h2>
          {lineas.length === 0 ? (
            <EmptyState text="Todavía no agregaste artículos." />
          ) : (
            <TableWrap>
              <table className="w-full text-sm">
                <thead className="bg-institutional/10 text-deep/70 text-xs uppercase">
                  <tr>
                    <Th>Artículo</Th>
                    <Th className="text-right">Precio</Th>
                    <Th className="w-28">Cantidad</Th>
                    <Th className="text-right">Subtotal</Th>
                    <Th></Th>
                  </tr>
                </thead>
                <tbody>
                  {lineas.map((l) => {
                    const disponible = stock[l.articuloId];
                    const falta = disponible !== undefined && Number(l.cantidad) > disponible;
                    return (
                      <tr key={l.articuloId}>
                        <Td>
                          <p className="font-medium">{l.nombre}</p>
                          {falta && <p className="text-xs text-red-700">Hay {cantidadTexto(disponible)} en stock.</p>}
                        </Td>
                        <Td className="text-right whitespace-nowrap">
                          {pct > 0 && <span className="block text-xs text-deep/40 line-through">{pesos(l.precio)}</span>}
                          {pesos(unitario(l.precio))}
                        </Td>
                        <Td>
                          <input
                            type="number"
                            min={enUnidades[l.articuloId] ? "1" : "0.001"}
                            step={enUnidades[l.articuloId] ? "1" : "any"}
                            required
                            value={l.cantidad}
                            onChange={(e) => cambiarCantidad(l.articuloId, e.target.value)}
                            className={`${inputClass} py-1.5 ${falta ? "border-red-300" : ""}`}
                            aria-label={`Cantidad de ${l.nombre}`}
                          />
                        </Td>
                        <Td className="text-right whitespace-nowrap font-medium">{pesos(redondear2(unitario(l.precio) * Number(l.cantidad || 0)))}</Td>
                        <Td className="text-right">
                          <button type="button" onClick={() => quitar(l.articuloId)} className="text-deep/40 hover:text-red-600" title="Quitar">
                            <CloseIcon className="w-4 h-4" />
                          </button>
                        </Td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </TableWrap>
          )}
        </Card>

        <div className="xl:sticky" style={{ top: "calc(var(--gf-barra, 0px) + 5rem)" }}>
        <Card className="p-6 space-y-4">
          <Field label="Cliente (opcional)">
            <BuscadorCliente cliente={cliente} onElegir={setCliente} />
          </Field>
          <Field label="Medio de pago">
            <select value={medioPago} onChange={(e) => setMedioPago(e.target.value)} className={inputClass}>
              {["efectivo", "transferencia", "billetera_virtual"].map((m) => (
                <option key={m} value={m}>
                  {MEDIOS[m]}
                </option>
              ))}
            </select>
          </Field>
          <Field label="Descuento (%)">
            <input type="number" min="0" max="100" step="0.01" value={descuento} onChange={(e) => setDescuento(e.target.value)} className={inputClass} placeholder="0" />
          </Field>
          <p className={`text-xs ${superaTope ? "text-red-700 font-semibold" : "text-deep/45"}`}>
            {dueno
              ? "Como dueño, podés aplicar cualquier descuento."
              : tope === null
              ? ""
              : superaTope
              ? `Supera tu tope: podés aplicar hasta ${cantidadTexto(tope)} %.`
              : `Podés aplicar hasta ${cantidadTexto(tope)} %.`}
          </p>
          <div className="border-t border-deep/8 pt-4">
            <p className="text-xs font-semibold uppercase tracking-wide text-deep/50">Total</p>
            <p className="text-3xl font-display font-bold text-deep">{pesos(totalEstimado)}</p>
            <p className="text-xs text-deep/45 mt-1">
              Precios finales de la lista del local. Si el cliente tiene una lista propia, el sistema usa esa y el total del comprobante puede variar.
            </p>
          </div>
          {error && <Aviso>{error}</Aviso>}
          <Button type="submit" className="w-full" disabled={enviando || lineas.length === 0 || superaTope}>
            {enviando ? "Registrando…" : "Confirmar venta"}
          </Button>
          <p className="text-xs text-deep/40">La venta en cuenta corriente se habilita más adelante.</p>
        </Card>
        </div>
      </form>
    </div>
  );
};

  const [venta, setVenta] = useState(null);

  useEffect(() => {
    if (!id) return;
    setVenta(null);
    setError(null);
    pedirApi(`/api/ventas/${id}`).then((r) => (r.ok ? setVenta(r.data) : setError(mensajeDeError(r))));

  return (
    <Modal open wide="xl" onClose={onClose} title={venta ? `Venta ${venta.comprobante.letra} ${venta.comprobante.numero}` : "Venta"}>
      {error && <Aviso>{error}</Aviso>}
      {venta && (
        <div className="space-y-4 text-sm">
          <div className="flex flex-wrap items-center gap-2 text-deep/60">
            <EstadoVenta venta={venta} />
            <span>
              {fmtDateTime(venta.fechaHora)} · {venta.usuario} · {MEDIOS[venta.medioPago]} · {venta.cliente ? venta.cliente.nombre : "Consumidor final"}

          <TableWrap>
            <table className="w-full text-sm">
              <thead className="bg-institutional/10 text-deep/70 text-xs uppercase">
                <tr>
                  <Th>Artículo</Th>
                  <Th className="text-right">Cant.</Th>
                  <Th className="text-right">Devuelto</Th>
                  <Th className="text-right">Precio</Th>
                  <Th className="text-right">Subtotal</Th>
                  {dueno && <Th className="text-right">Costo unit.</Th>}
                  {dueno && <Th className="text-right">Margen</Th>}
                </tr>
              </thead>
              <tbody>
                {venta.renglones.map((l) => (
                  <tr key={l.id}>
                    <Td>{l.articulo}</Td>
                    <Td className="text-right">{cantidadTexto(l.cantidad)}</Td>
                    <Td className="text-right">{Number(l.cantidadDevuelta) > 0 ? cantidadTexto(l.cantidadDevuelta) : "—"}</Td>
                    <Td className="text-right whitespace-nowrap">{pesos(l.precioUnitario)}</Td>
                    <Td className="text-right whitespace-nowrap">{pesos(l.subtotal)}</Td>

            <span className="text-deep/60">Subtotal</span>
            <span className="text-right">{pesos(venta.subtotal)}</span>
            {Number(venta.descuento) > 0 && (
              <>
                <span className="text-deep/60">Descuento ({cantidadTexto(venta.porcentajeDescuento)} %)</span>
                <span className="text-right">− {pesos(venta.descuento)}</span>
              </>
            )}
            <span className="font-semibold">Total</span>
            <span className="text-right font-bold">{pesos(venta.total)}</span>

              <>
                <span className="text-deep/60">Devuelto</span>
                <span className="text-right">− {pesos(venta.totalDevuelto)}</span>
              </>
            )}
            {dueno && (
              <>
                <span className="text-deep/60">Costo total</span>
                <span className="text-right">{venta.costoTotal === null ? "Sin costo" : pesos(venta.costoTotal)}</span>
                <span className="text-deep/60">Margen</span>
                <span className="text-right">{porcentajeTexto(venta.margen)}</span>
              </>

const AnularVentaModal = ({ venta, onClose, onHecho }) => {
  const [motivo, setMotivo] = useState("");
  const [error, setError] = useState(null);
  const [enviando, setEnviando] = useState(false);
  const enviar = async (e) => {
    e.preventDefault();
    setEnviando(true);
    setError(null);
    const r = await pedirApi(`/api/ventas/${venta.id}/anular`, { method: "POST", body: { motivo } });
    setEnviando(false);
    if (!r.ok) return setError(mensajeDeError(r));
    onHecho(`Venta anulada. Se devolvió el stock${venta.sesionCajaId ? " y el dinero salió de la caja" : ""}.`);
  };
  return (
    <Modal open onClose={onClose} title={`Anular la venta ${venta.comprobante.numero}`}>
      <form onSubmit={enviar} className="space-y-4">
        <p className="text-sm text-deep/60">
          Se anula el comprobante, vuelve todo el stock y, si se cobró en la caja, se registra la salida de {pesos(venta.total)} en la caja abierta. No
          se puede deshacer.
        </p>
        <Field label="Motivo">
          <textarea required maxLength={500} rows={2} value={motivo} onChange={(e) => setMotivo(e.target.value)} className={inputClass} />
        </Field>
        {error && <Aviso>{error}</Aviso>}
        <div className="flex gap-2 justify-end">
          <Button type="button" variant="ghost" onClick={onClose}>
            Cancelar
          </Button>
          <Button type="submit" variant="danger" disabled={enviando}>
            {enviando ? "Anulando…" : "Anular venta"}
          </Button>
        </div>
      </form>
    </Modal>
  );
};

const DevolverVentaModal = ({ venta, onClose, onHecho }) => {
  const [cantidades, setCantidades] = useState({});
  const [motivo, setMotivo] = useState("");
  const [error, setError] = useState(null);
  const [enviando, setEnviando] = useState(false);
  const renglones = venta.renglones.filter((l) => Number(l.cantidad) > Number(l.cantidadDevuelta));
  const total = renglones.reduce((acc, l) => acc + redondear2(Number(cantidades[l.id] || 0) * Number(l.precioUnitario)), 0);
  const enviar = async (e) => {
    e.preventDefault();
    const elegidos = renglones.filter((l) => Number(cantidades[l.id] || 0) > 0).map((l) => ({ detalleVentaId: l.id, cantidad: Number(cantidades[l.id]) }));
    if (elegidos.length === 0) return setError("Indicá qué cantidad se devuelve de al menos un artículo.");
    setEnviando(true);
    setError(null);
    const r = await pedirApi(`/api/ventas/${venta.id}/devoluciones`, { method: "POST", body: { motivo, renglones: elegidos } });
    setEnviando(false);
    if (!r.ok) return setError(mensajeDeError(r));
    const nc = r.data.devoluciones[r.data.devoluciones.length - 1].notaCredito;
    onHecho(`Devolución registrada con la nota de crédito ${nc.letra} ${nc.numero}.`, nc.id);
  };
  return (
    <Modal open wide onClose={onClose} title={`Devolver artículos de la venta ${venta.comprobante.numero}`}>
      <form onSubmit={enviar} className="space-y-4">
        <TableWrap>
          <table className="w-full text-sm">
            <thead className="bg-institutional/10 text-deep/70 text-xs uppercase">
              <tr>
                <Th>Artículo</Th>
                <Th className="text-right">Vendido</Th>
                <Th className="text-right">Ya devuelto</Th>
                <Th className="text-right">Precio</Th>
                <Th className="w-28">Devolver</Th>
              </tr>
            </thead>
            <tbody>
              {renglones.map((l) => (
                <tr key={l.id}>
                  <Td>{l.articulo}</Td>
                  <Td className="text-right">{cantidadTexto(l.cantidad)}</Td>
                  <Td className="text-right">{cantidadTexto(l.cantidadDevuelta)}</Td>
                  <Td className="text-right whitespace-nowrap">{pesos(l.precioUnitario)}</Td>
                  <Td>
                    <input
                      type="number"
                      min="0"
                      step="any"
                      value={cantidades[l.id] || ""}
                      placeholder="0"
                      onChange={(e) => setCantidades({ ...cantidades, [l.id]: e.target.value })}
                      className={`${inputClass} py-1.5`}
                      aria-label={`Cantidad a devolver de ${l.articulo}`}
                    />
                  </Td>
                </tr>
              ))}
            </tbody>
          </table>
        </TableWrap>
        <p className="text-sm">
          Total a devolver: <span className="font-bold">{pesos(total)}</span>
          {venta.sesionCajaId && <span className="text-deep/50"> · sale de la caja abierta</span>}
        </p>
        <Field label="Motivo">
          <textarea required maxLength={500} rows={2} value={motivo} onChange={(e) => setMotivo(e.target.value)} className={inputClass} />
        </Field>
        {error && <Aviso>{error}</Aviso>}
        <div className="flex gap-2 justify-end">
          <Button type="button" variant="ghost" onClick={onClose}>
            Cancelar
          </Button>
          <Button type="submit" disabled={enviando}>
            {enviando ? "Registrando…" : "Registrar devolución"}
          </Button>
        </div>
      </form>
    </Modal>
  );
};

const VentasDelDiaTab = ({ showToast }) => {
  const dueno = esDueno();
  const [fecha, setFecha] = useState(hoyISO());
  const [ventas, setVentas] = useState(null);
  const [error, setError] = useState(null);
  const [verId, setVerId] = useState(null);
  const [anulando, setAnulando] = useState(null);
  const [devolviendo, setDevolviendo] = useState(null);

  const cargar = async () => {
    const r = await pedirApi(dueno ? `/api/ventas?desde=${fecha}&hasta=${fecha}&tamano=100` : "/api/ventas?tamano=100");
    if (r.ok) {
      setVentas(r.data.ventas);
      setError(null);
    } else setError(mensajeDeError(r));
  };
  useEffect(() => {
    cargar();
  }, [fecha]);

  const confirmadas = (ventas || []).filter((v) => v.estado === "confirmada");
  const totalDia = confirmadas.reduce((acc, v) => acc + Number(v.total) - Number(v.totalDevuelto), 0);

  const terminar = (mensaje, comprobanteId) => {
    setAnulando(null);
    setDevolviendo(null);
    showToast(mensaje);
    if (comprobanteId) abrirImprimible(comprobanteId);
    cargar();
  };

  return (
    <div>
      <SectionBar
        eyebrowNumber={EYEBROWS["ventas-dia"].n}
        eyebrow={EYEBROWS["ventas-dia"].label}
        title={dueno ? "Ventas" : "Ventas del día"}
        description={dueno ? "Ventas del local por día, con costo y margen. Desde acá se anulan o se registran devoluciones." : "Las ventas de hoy en el local."}
        action={
          dueno && (
            <input type="date" value={fecha} max={hoyISO()} onChange={(e) => setFecha(e.target.value || hoyISO())} className={inputClass} aria-label="Día" />
          )
        }
      />
      {error && <Aviso className="mb-6">{error}</Aviso>}
      {ventas && (
        <div className="grid grid-cols-2 gap-3 mb-6 max-w-xl">
          <Card className="p-4">
            <p className="text-[11px] font-semibold uppercase tracking-wider text-deep/45">Ventas confirmadas</p>
            <p className="text-xl font-display font-bold text-deep">{confirmadas.length}</p>
          </Card>
          <Card className="p-4">
            <p className="text-[11px] font-semibold uppercase tracking-wider text-deep/45">Total, menos devoluciones</p>
            <p className="text-xl font-display font-bold text-deep">{pesos(totalDia)}</p>
          </Card>
        </div>
      )}
      {ventas && ventas.length === 0 && <EmptyState text="No hay ventas en este día." />}
      {ventas && ventas.length > 0 && (
        <TableWrap>
          <table className="w-full text-sm">
            <thead className="bg-institutional/10 text-deep/70 text-xs uppercase">
              <tr>
                <Th>Hora y vendedor</Th>
                <Th>Comprobante</Th>
                <Th>Cliente</Th>
                <Th>Medio</Th>
                <Th className="text-right">Total</Th>
                <Th>Estado</Th>
                {dueno && <Th className="text-right">Costo y margen</Th>}
                <Th></Th>
              </tr>
            </thead>
            <tbody>
              {ventas.map((v, i) => (
                <tr key={v.id} className={i % 2 === 1 ? "bg-deep/[0.025]" : ""}>
                  <Td>
                    <span className="font-medium">{hora(v.fechaHora)}</span>
                    <span className="block text-xs text-deep/50">{v.usuario}</span>
                  </Td>
                  <Td className="whitespace-nowrap">
                    {v.comprobante.letra} {v.comprobante.numero}
                  </Td>
                  <Td>{v.cliente ? v.cliente.nombre : <span className="text-deep/45">Consumidor final</span>}</Td>
                  <Td>{MEDIOS[v.medioPago]}</Td>
                  <Td className="text-right whitespace-nowrap">
                    <span className="font-medium">{pesos(v.total)}</span>
                    {Number(v.totalDevuelto) > 0 && <span className="block text-xs text-deep/50">Devuelto {pesos(v.totalDevuelto)}</span>}
                  </Td>
                  <Td>
                    <EstadoVenta venta={v} />
                  </Td>
                  {dueno && (
                    <Td className="text-right whitespace-nowrap">
                      {v.costoTotal === null ? <span className="text-deep/50">Sin costo</span> : pesos(v.costoTotal)}
                      <span className="block text-xs text-deep/50">Margen {porcentajeTexto(v.margen)}</span>
                    </Td>
                  )}
                  <Td className="text-right">
                    <span className="flex flex-wrap justify-end gap-1.5 w-[124px] ml-auto">
                      <MiniButton variant="secondary" onClick={() => setVerId(v.id)}>
                        Ver
                      </MiniButton>
                      <MiniButton variant="secondary" onClick={() => abrirImprimible(v.comprobante.id)} title="Comprobante para imprimir">
                        <PrinterIcon className="w-3.5 h-3.5" />
                      </MiniButton>
                      {dueno && v.estado === "confirmada" && v.renglones.some((l) => Number(l.cantidad) > Number(l.cantidadDevuelta)) && (
                        <MiniButton variant="secondary" onClick={() => setDevolviendo(v)}>
                          Devolver
                        </MiniButton>
                      )}
                      {dueno && v.estado === "confirmada" && Number(v.totalDevuelto) === 0 && (
                        <MiniButton variant="danger" onClick={() => setAnulando(v)}>
                          Anular
                        </MiniButton>
                      )}
                    </span>
                  </Td>
                </tr>
              ))}
            </tbody>
          </table>
        </TableWrap>
      )}
      <DetalleVentaModal id={verId} onClose={() => setVerId(null)} />
      {anulando && <AnularVentaModal venta={anulando} onClose={() => setAnulando(null)} onHecho={terminar} />}
      {devolviendo && <DevolverVentaModal venta={devolviendo} onClose={() => setDevolviendo(null)} onHecho={terminar} />}
    </div>
  );
};

const AjusteTab = ({ session, bump, showToast }) => {
  const ubicacion = GFDB.ubicacionDeSucursal(session.sucursalId);
  const rows = GFDB.query("stock_productos", (s) => s.ubicacion_stock_id === ubicacion.id);
  const [stockProductoId, setStockProductoId] = useState(rows[0]?.id || "");
  const [cantidad, setCantidad] = useState("");
  const [motivo, setMotivo] = useState("");

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!stockProductoId || !cantidad || !motivo.trim()) return;
    GFDB.ajustarStock({ stockProductoId: Number(stockProductoId), cantidad: Number(cantidad), motivo, usuarioId: session.usuarioId });
    setCantidad("");
    setMotivo("");
    bump();
    showToast("Ajuste de stock registrado.");
  };

  return (
    <div>
      <SectionBar eyebrowNumber={EYEBROWS.ajuste.n} eyebrow={EYEBROWS.ajuste.label} title="Ajustar stock" description="Solo disponible para responsables de sucursal. Requiere motivo." />
      <Card className="p-6 max-w-xl">
        <form onSubmit={handleSubmit} className="space-y-4">
          <Field label="Producto">
            <select value={stockProductoId} onChange={(e) => setStockProductoId(e.target.value)} className={inputClass}>
              {rows.map((r) => {
                const p = GFDB.find("productos", r.producto_id);
                return (
                  <option key={r.id} value={r.id}>
                    {p.nombre} (actual: {r.cantidad_actual})
                  </option>
                );
              })}
            </select>
          </Field>
          <Field label="Cantidad (positivo suma, negativo resta)">
            <input type="number" required value={cantidad} onChange={(e) => setCantidad(e.target.value)} className={inputClass} placeholder="Ej: -3" />
          </Field>
          <Field label="Motivo">
            <input required value={motivo} onChange={(e) => setMotivo(e.target.value)} className={inputClass} placeholder="Ej: producto dañado, conteo físico, etc." />
          </Field>
          <Button type="submit">Aplicar ajuste</Button>
        </form>
      </Card>
    </div>
  );
};

/* ---------------------------------------------------------
   CATÁLOGO (responsable)
--------------------------------------------------------- */
const CatalogoTab = ({ session, bump, showToast }) => {
  const ubicacion = GFDB.ubicacionDeSucursal(session.sucursalId);
  const productos = GFDB.get("productos");
  const categorias = GFDB.get("categorias");
  const [nombreNuevo, setNombreNuevo] = useState("");
  const [categoriaNueva, setCategoriaNueva] = useState(categorias[0]?.id || "");
  const [precioNuevo, setPrecioNuevo] = useState("");

  const asociar = (productoId) => {
    GFDB.insert("stock_productos", { producto_id: productoId, ubicacion_stock_id: ubicacion.id, cantidad_actual: 0, stock_minimo: 0, stock_maximo: 0 });
    bump();
    showToast("Producto asociado a la sucursal.");
  };

  const guardarProducto = (producto, patch) => {
    GFDB.update("productos", producto.id, patch);
    bump();
    showToast("Catálogo actualizado.");
  };

  const crearProducto = (e) => {
    e.preventDefault();
    if (!nombreNuevo.trim() || !precioNuevo) return;
    const nuevo = GFDB.insert("productos", {
      nombre: nombreNuevo,
      descripcion: "",
      precio: Number(precioNuevo),
      imagen: "",
      categoria_id: Number(categoriaNueva),
      marca_id: null,
      grupo_id: null,
      es_fabricacion_propia: false,
      visible: true,
    });
    GFDB.insert("stock_productos", { producto_id: nuevo.id, ubicacion_stock_id: ubicacion.id, cantidad_actual: 0, stock_minimo: 0, stock_maximo: 0 });
    setNombreNuevo("");
    setPrecioNuevo("");
    bump();
    showToast("Producto creado y asociado a esta sucursal.");
  };

  return (
    <div>
      <SectionBar
        eyebrowNumber={EYEBROWS.catalogo.n}
        eyebrow={EYEBROWS.catalogo.label}
        title="Lista de productos"
        description="El precio y la descripción son del catálogo general de Green Fire; la visibilidad, el stock y la asociación son por sucursal."
      />

      <Card className="p-6 mb-6">
        <form onSubmit={crearProducto} className="flex flex-wrap items-end gap-3">
          <Field label="Nombre del producto nuevo">
            <input value={nombreNuevo} onChange={(e) => setNombreNuevo(e.target.value)} className={inputClass} />
          </Field>
          <Field label="Categoría">
            <select value={categoriaNueva} onChange={(e) => setCategoriaNueva(e.target.value)} className={inputClass}>
              {categorias.map((c) => (
                <option key={c.id} value={c.id}>
                  {c.nombre}
                </option>
              ))}
            </select>
          </Field>
          <Field label="Precio">
            <input type="number" min="0" value={precioNuevo} onChange={(e) => setPrecioNuevo(e.target.value)} className={inputClass} />
          </Field>
          <Button type="submit">
            <PlusIcon /> Nuevo producto o servicio
          </Button>
        </form>
      </Card>

      <div className="grid md:grid-cols-2 gap-5">
        {productos.map((p) => {
          const sp = GFDB.stockDeProducto(p.id, ubicacion.id);
          const asociado = !!sp;
          return (
            <Card key={p.id} className="p-5">
              <div className="flex items-start justify-between gap-3 mb-3">
                <div>
                  <p className="font-semibold text-deep">{p.nombre}</p>
                  <p className="text-xs text-deep/45">
                    {asociado ? `Stock en esta sucursal: ${sp.cantidad_actual}` : "No asociado a esta sucursal"}
                  </p>
                </div>
                <div className="flex items-center gap-1.5">
                  {!asociado && (
                    <Button variant="secondary" onClick={() => asociar(p.id)}>
                      Asociar
                    </Button>
                  )}
                  <button
                    onClick={() => guardarProducto(p, { visible: !p.visible })}
                    title={p.visible ? "Desactivar (ocultar del catálogo público)" : "Activar (mostrar en el catálogo público)"}
                    className={`p-1.5 rounded-lg ${p.visible ? "text-institutional hover:bg-institutional/10" : "text-deep/35 hover:bg-deep/5"}`}
                  >
                    <PowerIcon className="w-4 h-4" />
                  </button>
                </div>
              </div>
              <div className="space-y-3">
                <Field label="Precio">
                  <input
                    type="number"
                    defaultValue={p.precio}
                    onBlur={(e) => guardarProducto(p, { precio: Number(e.target.value) })}
                    className={inputClass}
                  />
                </Field>
                <Field label="Descripción">
                  <textarea
                    defaultValue={p.descripcion}
                    rows={2}
                    onBlur={(e) => guardarProducto(p, { descripcion: e.target.value })}
                    className={inputClass}
                  />
                </Field>
                <label className="flex items-center gap-2 text-sm text-deep/70">
                  <input type="checkbox" checked={p.visible} onChange={(e) => guardarProducto(p, { visible: e.target.checked })} />
                  Visible para clientes
                </label>
              </div>
            </Card>
          );
        })}
      </div>
    </div>
  );
};

/* ---------------------------------------------------------
   VENTAS CON NUMERACIÓN — Facturas / Presupuestos / Recibos /
   Remitos / Recibos App (una sola pantalla parametrizada por tipo,
   igual criterio que "compras" en fábrica: un solo motor de datos,
   varias puertas de entrada en el sidebar).
--------------------------------------------------------- */
const COMPROBANTE_TITULOS = { factura: "Facturas", presupuesto: "Presupuestos", recibo: "Recibos", remito: "Remitos" };
const COMPROBANTE_SINGULAR = { factura: "Factura", presupuesto: "Presupuesto", recibo: "Recibo", remito: "Remito" };
const COMPROBANTE_MSG_EMITIDO = {
  factura: "Factura emitida. Conexión ARCA pendiente de integración.",
  presupuesto: "Presupuesto emitido.",
  recibo: "Recibo emitido.",
  remito: "Remito emitido.",
};
const COMPROBANTE_MSG_ANULADO = {
  factura: "Factura anulada.",
  presupuesto: "Presupuesto anulado.",
  recibo: "Recibo anulado.",
  remito: "Remito anulado.",
};
const COMPROBANTE_NUEVO_LABEL = { factura: "Nueva factura", presupuesto: "Nuevo presupuesto", recibo: "Nuevo recibo", remito: "Nuevo remito" };

const ComprobanteScreen = ({ tipo, tabKey, session, bump, showToast, soloLectura }) => {
  const clientes = GFDB.get("clientes");
  const productos = GFDB.get("productos");
  const [clienteId, setClienteId] = useState(clientes[0]?.id || "");
  const [lineas, setLineas] = useState([{ productoId: productos[0]?.id || "", cantidad: 1, precio: productos[0]?.precio || 0 }]);
  const [observaciones, setObservaciones] = useState("");
  const [filtroEstado, setFiltroEstado] = useState("todos");
  const [detalleId, setDetalleId] = useState(null);

  const setLinea = (idx, patch) => setLineas((prev) => prev.map((l, i) => (i === idx ? { ...l, ...patch } : l)));
  const addLinea = () => setLineas((prev) => [...prev, { productoId: productos[0]?.id || "", cantidad: 1, precio: productos[0]?.precio || 0 }]);
  const removeLinea = (idx) => setLineas((prev) => prev.filter((_, i) => i !== idx));
  const total = lineas.reduce((acc, l) => acc + Number(l.cantidad || 0) * Number(l.precio || 0), 0);

  const todos = soloLectura
    ? []
    : GFDB.query("comprobantes_venta", (c) => c.sucursal_id === session.sucursalId && c.tipo === tipo)
        .filter((c) => filtroEstado === "todos" || c.estado === filtroEstado)
        .sort((a, b) => new Date(b.fecha) - new Date(a.fecha));

  const handleSubmit = (e) => {
    e.preventDefault();
    const items = lineas
      .filter((l) => l.productoId && Number(l.cantidad) > 0)
      .map((l) => ({ productoId: Number(l.productoId), cantidad: Number(l.cantidad), precioUnitario: Number(l.precio) }));
    if (!clienteId || items.length === 0) return;
    GFDB.emitirComprobante({ sucursalId: session.sucursalId, usuarioId: session.usuarioId, tipo, clienteId: Number(clienteId), items, observaciones });
    setLineas([{ productoId: productos[0]?.id || "", cantidad: 1, precio: productos[0]?.precio || 0 }]);
    setObservaciones("");
    bump();
    showToast(COMPROBANTE_MSG_EMITIDO[tipo]);
  };

  const columns = [
    { key: "numero", label: "Número", render: (c) => `${c.punto_venta}-${String(c.numero).padStart(8, "0")}` },
    {
      key: "cliente",
      label: "Cliente",
      render: (c) => GFDB.find("clientes", c.cliente_id)?.nombre || "-",
      searchValue: (c) => GFDB.find("clientes", c.cliente_id)?.nombre || "",
    },
    { key: "fecha", label: "Fecha", render: (c) => fmtDate(c.fecha) },
    { key: "total", label: "Total", render: (c) => money(c.total) },
    {
      key: "estado",
      label: "Estado",
      render: (c) => (
        <span className={`text-xs font-semibold ${c.estado === "anulado" ? "text-red-600" : "text-institutional"}`}>
          {c.estado === "anulado" ? "Anulado" : "Emitido"}
        </span>
      ),
      csvValue: (c) => (c.estado === "anulado" ? "Anulado" : "Emitido"),
    },
  ];
  if (tipo === "factura") {
    columns.push({
      key: "arca",
      label: "ARCA",
      render: () => (
        <span className="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-semibold bg-amber-100 text-amber-700">
          Pendiente de integración
        </span>
      ),
      csvValue: () => "Pendiente de integración",
    });
  }

  const actionsRenderer = (c) => (
    <RowActions
      onView={() => setDetalleId(c.id)}
      onPrint={() => window.print()}
      deleteLabel="Anular"
      onDelete={
        c.estado === "emitido"
          ? () => {
              GFDB.anularComprobante(c.id, session.usuarioId);
              bump();
              showToast(COMPROBANTE_MSG_ANULADO[tipo], "error");
            }
          : undefined
      }
    />
  );

  const comprobanteActivo = detalleId ? GFDB.find("comprobantes_venta", detalleId) : null;

  return (
    <div>
      <SectionBar
        eyebrowNumber={EYEBROWS[tabKey].n}
        eyebrow={EYEBROWS[tabKey].label}
        title={soloLectura ? `${COMPROBANTE_TITULOS[tipo]} (App)` : COMPROBANTE_TITULOS[tipo]}
        description={
          soloLectura
            ? "Recibos generados por clientes desde la app / portal online."
            : tipo === "factura"
            ? "Venta a consumidor final con numeración. Conexión ARCA: pendiente de integración."
            : undefined
        }
      />

      {soloLectura ? (
        <EmptyState text="Todavía no existe un canal de clientes (app/portal) generando recibos — esta vista queda lista para cuando exista." />
      ) : (
        <>
          <ListToolbar onExport={() => exportCSV(`${tipo}s.csv`, columns, todos)} onPrint={() => window.print()} />
          <FiltersBar
            filters={[
              {
                label: "Estado",
                value: filtroEstado,
                onChange: setFiltroEstado,
                options: [
                  { value: "todos", label: "Todos" },
                  { value: "emitido", label: "Emitido" },
                  { value: "anulado", label: "Anulado" },
                ],
              },
            ]}
          />
          <DataTable columns={columns} rows={todos} getRowId={(c) => c.id} actionsRenderer={actionsRenderer} searchPlaceholder="Buscar cliente…" />

          {comprobanteActivo && (
            <Modal open={true} onClose={() => setDetalleId(null)} title={`${COMPROBANTE_SINGULAR[tipo]} ${comprobanteActivo.punto_venta}-${String(comprobanteActivo.numero).padStart(8, "0")}`}>
              <p className="text-sm text-deep/60 mb-1">
                Cliente: <span className="font-medium text-deep">{GFDB.find("clientes", comprobanteActivo.cliente_id)?.nombre}</span>
              </p>
              <p className="text-sm text-deep/60 mb-4">Fecha: {fmtDateTime(comprobanteActivo.fecha)}</p>
              <ul className="divide-y divide-deep/6 mb-4">
                {GFDB.query("detalle_comprobante_venta", (d) => d.comprobante_id === comprobanteActivo.id).map((l) => (
                  <li key={l.id} className="py-2 flex items-center justify-between text-sm">
                    <span>
                      {GFDB.find("productos", l.producto_id)?.nombre} · {l.cantidad}
                    </span>
                    <span className="font-medium">{money(l.subtotal)}</span>
                  </li>
                ))}
              </ul>
              <p className="text-right font-semibold text-deep">Total: {money(comprobanteActivo.total)}</p>
              {tipo === "factura" && (
                <p className="text-xs text-amber-700 bg-amber-50 rounded-lg px-3 py-2 mt-3">
                  CAE: pendiente — la conexión con ARCA todavía no está integrada.
                </p>
              )}
            </Modal>
          )}

          <div className="mt-8">
            <h2 className="font-display font-bold text-lg text-deep mb-3">{COMPROBANTE_NUEVO_LABEL[tipo]}</h2>
            <Card className="p-6">
              <form onSubmit={handleSubmit} className="space-y-4">
                <Field label="Cliente">
                  <select value={clienteId} onChange={(e) => setClienteId(e.target.value)} className={inputClass}>
                    {clientes.map((c) => (
                      <option key={c.id} value={c.id}>
                        {c.nombre}
                      </option>
                    ))}
                  </select>
                </Field>

                <div className="space-y-3">
                  {lineas.map((l, idx) => (
                    <div key={idx} className="grid grid-cols-1 sm:grid-cols-[1fr_100px_140px_auto] gap-3 items-end">
                      <Field label="Producto">
                        <select
                          value={l.productoId}
                          onChange={(e) => {
                            const p = GFDB.find("productos", Number(e.target.value));
                            setLinea(idx, { productoId: e.target.value, precio: p ? p.precio : 0 });
                          }}
                          className={inputClass}
                        >
                          {productos.map((p) => (
                            <option key={p.id} value={p.id}>
                              {p.nombre}
                            </option>
                          ))}
                        </select>
                      </Field>
                      <Field label="Cantidad">
                        <input type="number" min="1" value={l.cantidad} onChange={(e) => setLinea(idx, { cantidad: e.target.value })} className={inputClass} />
                      </Field>
                      <Field label="Precio unit.">
                        <input type="number" min="0" value={l.precio} onChange={(e) => setLinea(idx, { precio: e.target.value })} className={inputClass} />
                      </Field>
                      {lineas.length > 1 && (
                        <Button type="button" variant="ghost" onClick={() => removeLinea(idx)}>
                          Quitar
                        </Button>
                      )}
                    </div>
                  ))}
                </div>
                <Button type="button" variant="secondary" onClick={addLinea}>
                  <PlusIcon /> Agregar producto
                </Button>

                <div className="flex items-center justify-between pt-2 border-t border-deep/8">
                  <p className="text-2xl font-display font-bold text-deep">{money(total)}</p>
                </div>

                <Field label="Observaciones">
                  <textarea value={observaciones} onChange={(e) => setObservaciones(e.target.value)} rows={2} className={inputClass} />
                </Field>
                <Button type="submit">Emitir {COMPROBANTE_SINGULAR[tipo].toLowerCase()}</Button>
              </form>
            </Card>
          </div>
        </>
      )}
    </div>
  );
};

/* ---------------------------------------------------------
   COBRANZAS
--------------------------------------------------------- */
const CobranzasTab = ({ session, bump, showToast }) => {
  const clientes = GFDB.get("clientes");
  const [clienteId, setClienteId] = useState(clientes[0]?.id || "");
  const [medioPago, setMedioPago] = useState("efectivo");
  const [monto, setMonto] = useState("");
  const [observaciones, setObservaciones] = useState("");
  const [aplicaciones, setAplicaciones] = useState({});

  const comprobantesPendientes = GFDB.query(
    "comprobantes_venta",
    (c) => c.sucursal_id === session.sucursalId && c.cliente_id === Number(clienteId) && c.estado === "emitido" && (c.tipo === "factura" || c.tipo === "recibo")
  );

  const cobranzas = GFDB.query("cobranzas", (c) => c.sucursal_id === session.sucursalId).sort((a, b) => new Date(b.fecha) - new Date(a.fecha));

  const handleSubmit = (e) => {
    e.preventDefault();
    const aplicacionesArr = Object.entries(aplicaciones)
      .filter(([, importe]) => Number(importe) > 0)
      .map(([comprobanteId, importe]) => ({ comprobanteId: Number(comprobanteId), importe: Number(importe) }));
    if (!clienteId || !monto || Number(monto) <= 0) return;
    GFDB.registrarCobranza({
      sucursalId: session.sucursalId,
      clienteId: Number(clienteId),
      usuarioId: session.usuarioId,
      medioPago,
      monto: Number(monto),
      aplicaciones: aplicacionesArr,
      observaciones,
    });
    setMonto("");
    setObservaciones("");
    setAplicaciones({});
    bump();
    showToast("Cobranza registrada.");
  };

  const columns = [
    { key: "fecha", label: "Fecha", render: (c) => fmtDateTime(c.fecha) },
    {
      key: "cliente",
      label: "Cliente",
      render: (c) => GFDB.find("clientes", c.cliente_id)?.nombre || "-",
      searchValue: (c) => GFDB.find("clientes", c.cliente_id)?.nombre || "",
    },
    { key: "medio", label: "Medio de pago", render: (c) => enumLabel("medio_pago", c.medio_pago) },
    { key: "monto", label: "Monto", render: (c) => money(c.monto) },
  ];

  return (
    <div>
      <SectionBar eyebrowNumber={EYEBROWS.cobranzas.n} eyebrow={EYEBROWS.cobranzas.label} title="Cobranzas" description="Registrar un cobro y aplicarlo contra facturas o recibos pendientes del cliente." />
      <Card className="p-6 mb-8">
        <form onSubmit={handleSubmit} className="space-y-4">
          <div className="grid sm:grid-cols-3 gap-4">
            <Field label="Cliente">
              <select
                value={clienteId}
                onChange={(e) => {
                  setClienteId(e.target.value);
                  setAplicaciones({});
                }}
                className={inputClass}
              >
                {clientes.map((c) => (
                  <option key={c.id} value={c.id}>
                    {c.nombre}
                  </option>
                ))}
              </select>
            </Field>
            <Field label="Medio de pago">
              <select value={medioPago} onChange={(e) => setMedioPago(e.target.value)} className={inputClass}>
                {window.GF_ENUMS.medio_pago.map((m) => (
                  <option key={m.value} value={m.value}>
                    {m.label}
                  </option>
                ))}
              </select>
            </Field>
            <Field label="Monto cobrado">
              <input type="number" min="0" value={monto} onChange={(e) => setMonto(e.target.value)} className={inputClass} />
            </Field>
          </div>

          <div>
            <p className="text-xs font-semibold uppercase tracking-wide text-deep/50 mb-2">Aplicar contra comprobantes pendientes</p>
            {comprobantesPendientes.length === 0 ? (
              <p className="text-sm text-deep/40">Este cliente no tiene facturas ni recibos pendientes en esta sucursal.</p>
            ) : (
              <div className="space-y-2">
                {comprobantesPendientes.map((c) => (
                  <div key={c.id} className="flex items-center gap-3">
                    <span className="text-sm text-deep flex-1">
                      {COMPROBANTE_SINGULAR[c.tipo]} {c.punto_venta}-{String(c.numero).padStart(8, "0")} · {money(c.total)}
                    </span>
                    <input
                      type="number"
                      min="0"
                      placeholder="Importe a aplicar"
                      value={aplicaciones[c.id] || ""}
                      onChange={(e) => setAplicaciones((prev) => ({ ...prev, [c.id]: e.target.value }))}
                      className={`${inputClass} w-40`}
                    />
                  </div>
                ))}
              </div>
            )}
          </div>

          <Field label="Observaciones">
            <textarea value={observaciones} onChange={(e) => setObservaciones(e.target.value)} rows={2} className={inputClass} />
          </Field>
          <Button type="submit">Registrar cobranza</Button>
        </form>
      </Card>

      <h2 className="font-display font-bold text-lg text-deep mb-3">Historial de cobranzas</h2>
      <DataTable columns={columns} rows={cobranzas} getRowId={(c) => c.id} searchPlaceholder="Buscar cliente…" />
    </div>
  );
};

/* ---------------------------------------------------------
   LISTAS DE PRECIOS
--------------------------------------------------------- */
const ListasPreciosTab = ({ bump, showToast }) => {
  const listas = GFDB.get("listas_precios");
  const productos = GFDB.get("productos");
  const [nombreNueva, setNombreNueva] = useState("");
  const [listaEditando, setListaEditando] = useState(null);

  const crearLista = (e) => {
    e.preventDefault();
    if (!nombreNueva.trim()) return;
    GFDB.insert("listas_precios", { nombre: nombreNueva, es_predeterminada: false });
    setNombreNueva("");
    bump();
    showToast("Lista de precios creada.");
  };

  const precioEnLista = (listaId, productoId) => {
    const item = GFDB.query("lista_precios_items", (i) => i.lista_id === listaId && i.producto_id === productoId)[0];
    return item ? item.precio : GFDB.find("productos", productoId).precio;
  };

  const guardarPrecio = (listaId, productoId, precio) => {
    const item = GFDB.query("lista_precios_items", (i) => i.lista_id === listaId && i.producto_id === productoId)[0];
    if (item) GFDB.update("lista_precios_items", item.id, { precio });
    else GFDB.insert("lista_precios_items", { lista_id: listaId, producto_id: productoId, precio });
    bump();
  };

  const listaActiva = listaEditando ? GFDB.find("listas_precios", listaEditando) : null;

  return (
    <div>
      <SectionBar
        eyebrowNumber={EYEBROWS["listas-precios"].n}

/* ---------------------------------------------------------

--------------------------------------------------------- */
const ESTADOS_VENTA_CONTABLE = ["confirmado", "en_preparacion", "listo_retiro", "pendiente_envio", "finalizado"];

const EstadisticasClientesTab = ({ session }) => {
  const totales = {};
  GFDB.query("pedidos", (p) => p.sucursal_id === session.sucursalId && ESTADOS_VENTA_CONTABLE.includes(p.estado)).forEach((p) => {
    totales[p.cliente_id] = (totales[p.cliente_id] || 0) + p.total;
  });
  GFDB.query("comprobantes_venta", (c) => c.sucursal_id === session.sucursalId && c.estado === "emitido" && c.tipo !== "presupuesto").forEach((c) => {
    totales[c.cliente_id] = (totales[c.cliente_id] || 0) + c.total;
  });
  const filas = Object.entries(totales)
    .map(([clienteId, total]) => ({ id: Number(clienteId), cliente: GFDB.find("clientes", Number(clienteId)), total }))
    .filter((f) => f.cliente)
    .sort((a, b) => b.total - a.total)
    .slice(0, 10);

  const columns = [
    { key: "cliente", label: "Cliente", render: (f) => f.cliente.nombre },
    { key: "total", label: "Total comprado", render: (f) => money(f.total) },
  ];

  return (
    <div>
      <SectionBar eyebrowNumber={EYEBROWS["stats-clientes"].n} eyebrow={EYEBROWS["stats-clientes"].label} title="Top clientes" description="Suma de pedidos confirmados en adelante + comprobantes emitidos (no presupuestos)." />
      {filas.length === 0 ? <EmptyState text="Todavía no hay datos suficientes." /> : <DataTable columns={columns} rows={filas} getRowId={(f) => f.id} searchPlaceholder="Buscar cliente…" />}
    </div>
  );
};

const EstadisticasProductosTab = ({ session }) => {

  }).forEach((d) => {
